<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiện ích — Thầy Lê Hoàng</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f3f6fa;color:#172033}.wrap{padding:16px;width:100%;max-width:none}.head{display:flex;justify-content:space-between;gap:12px;align-items:center}.head small{display:block;color:#64748b;margin-top:4px}.back,.btn{border:1px solid #d8dee9;background:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;text-decoration:none;color:inherit}.hero,.card{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin-top:14px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.btn{text-align:left}.btn strong,.seat b{display:block}.btn small{color:#64748b}.status{margin-top:10px;padding:10px;border:1px dashed #cbd5e1;border-radius:9px}.status.ok{background:#f0fdf4;color:#166534}.toolbar{display:flex;justify-content:space-between;gap:10px;align-items:center}.classroom{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:14px;margin-top:14px;min-height:calc(100vh - 250px)}.group{background:#fff;border:2px solid #d7e0ea;border-radius:14px;padding:12px;display:flex;flex-direction:column}.group h3{text-align:center;margin:0 0 10px}.desks{display:grid;grid-template-columns:1fr;gap:7px;flex:1}.desk{display:grid;grid-template-columns:28px 1fr 1fr;gap:7px}.no{display:flex;align-items:center;justify-content:center;color:#64748b}.seat{background:#f8fafc;border:1px solid #dbe3ee;border-radius:8px;padding:8px;display:flex;align-items:center}.note{color:#64748b;font-size:13px}@media(max-width:900px){.actions{grid-template-columns:1fr}.classroom{grid-template-columns:1fr;grid-template-rows:auto}.group{min-height:260px}}
</style></head><body><div class="wrap"><div class="head"><div><b>🧰 TIỆN ÍCH — THẦY LÊ HOÀNG</b><small>Trang độc lập · chỉ dùng để xếp sơ đồ lớp/xếp tổ</small></div><a class="back" href="index.html">← Về Quản lý lớp học</a></div><div class="hero"><h1>Tiện ích</h1><div class="actions"><button id="upload" class="btn" type="button"><strong>📤 Tải lên</strong><small>STT | Họ và tên | Giới tính | Xếp loại | Ghi chú</small></button><button id="make" class="btn" type="button"><strong>📐 Tạo sơ đồ lớp học</strong><small>42 HS · 21 bàn · 4 tổ · 2 HS/bàn</small></button></div><div id="status" class="status">Chưa tải danh sách.</div></div><input id="file" type="file" accept=".csv,.tsv,.txt" hidden><div id="layout"></div><div id="preview"></div></div><script>
(()=>{const $=id=>document.getElementById(id);const STORAGE_KEY='LH_TIEN_ICH_DANH_SACH_2026_2027_5C';let students=[];const clean=x=>String(x??'').trim().replace(/\s+/g,' '),norm=x=>clean(x).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d'),esc=x=>String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function split(s){s=s.trim().replace(/^\|/,'').replace(/\|$/,'');if(s.includes('\t'))return s.split('\t').map(clean);if(s.includes('|'))return s.split('|').map(clean);if(s.includes(';'))return s.split(';').map(clean);return s.split(',').map(clean)}
function parse(txt){const rows=String(txt).replace(/^\uFEFF/,'').replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean).map(split);if(!rows.length)throw Error('Tệp không có dữ liệu.');let hi=-1;for(let i=0;i<Math.min(rows.length,5);i++){const h=rows[i].map(norm);if(h.some(x=>x.includes('ho va ten')||x==='ho ten'||x.includes('hoc sinh'))){hi=i;break}}const h=rows[hi<0?0:hi].map(norm),find=(a,d)=>{const i=h.findIndex(x=>a.some(n=>x===n||x.includes(n)));return i<0?d:i},ni=find(['ho va ten','ho ten','hoc sinh','name'],1),gi=find(['gioi tinh'],2),li=find(['xep loai','trinh do','hoc luc','level'],3),start=hi<0?0:hi+1,out=[];for(let i=start;i<rows.length;i++){const r=rows[i],name=clean(r[ni]);if(!name)continue;if(/^(ho va ten|ho ten|hoc sinh|name)$/i.test(norm(name)))continue;out.push({name,gender:clean(r[gi]),level:clean(r[li])||'H'})}if(out.length!==42)throw Error('Danh sách phải có đúng 42 học sinh. Hiện đã đọc '+out.length+'.');return out}
function save(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify({savedAt:new Date().toISOString(),students}))}catch(e){console.warn('Không thể lưu danh sách Tiện ích',e)}}
function load(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return false;const data=JSON.parse(raw);if(!Array.isArray(data?.students)||data.students.length!==42)return false;students=data.students;const d=data.savedAt?new Date(data.savedAt):null;const when=d&&!isNaN(d)?' · lưu '+d.toLocaleString('vi-VN') :'';$('status').className='status ok';$('status').innerHTML='Danh sách đang lưu: <b>'+students.length+'</b> học sinh'+when+'. Sẽ giữ nguyên cho đến khi tải danh sách mới.';renderPreview();return true}catch(e){console.warn('Không đọc được danh sách đã lưu',e);return false}}
function rank(x){const s=norm(x);return s==='t'||/tot|gioi|xuat sac/.test(s)?2:1}function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function order(){let t=shuffle(students.filter(s=>rank(s.level)===2)),h=shuffle(students.filter(s=>rank(s.level)!==2)),o=[];while(t.length||h.length){if(t.length)o.push(t.shift());if(h.length)o.push(h.shift())}return o.slice(0,42)}
function render(){if(students.length!==42){alert('Hãy tải đúng 42 học sinh trước.');return}const o=order(),pairs=[];for(let i=0;i<42;i+=2)pairs.push([o[i],o[i+1]]);const groups=[pairs.slice(0,6),pairs.slice(6,11),pairs.slice(11,16),pairs.slice(16,21)];let count=0;groups.forEach(g=>g.forEach(p=>p.forEach(s=>{if(s)count++})));if(count!==42){alert('Lỗi: sơ đồ chưa đủ 42 học sinh.');return}$('layout').innerHTML='<div class="card"><div class="toolbar"><b>42 học sinh · 21 bàn · 4 tổ</b><button id="again" class="back" type="button">🔀 Xếp lại</button></div><div class="classroom">'+groups.map((g,i)=>'<section class="group"><h3>Tổ '+(i+1)+' <small>('+g.length+' bàn)</small></h3><div class="desks">'+g.map((p,j)=>'<div class="desk"><span class="no">'+(j+1)+'</span><div class="seat"><b>'+esc(p[0].name)+'</b></div><div class="seat"><b>'+esc(p[1].name)+'</b></div></div>').join('')+'</div></section>').join('')+'</div><p class="note">Xếp loại T/H chỉ dùng để cân bằng khi xếp chỗ; không hiển thị trên sơ đồ.</p></div>';$("again").onclick=render}
$('upload').onclick=()=>$('file').click();$('file').onchange=async()=>{const f=$('file').files[0];$('file').value='';if(!f)return;try{students=parse(await f.text());save();$('status').className='status ok';$('status').innerHTML='Đã tải <b>'+students.length+'</b> học sinh · đã lưu lại. Tự động dùng danh sách này cho đến khi tải danh sách mới.';renderPreview();render()}catch(e){$('status').className='status';alert(e.message)}};$('make').onclick=render;function renderPreview(){$('preview').innerHTML='<div class="card"><div class="toolbar"><b>Danh sách đang lưu: '+students.length+' học sinh</b><span>Xếp loại chỉ là dữ liệu căn cứ.</span></div></div>'}
load();
})();</script></body></html>
