<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tiện ích — Thầy Lê Hoàng</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#f3f6fa;color:#172033}body{overflow-x:hidden}.wrap{width:100%;max-width:none;margin:0;padding:18px}.head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:14px}.brand{font-weight:800}.brand small{display:block;color:#64748b;font-weight:500;margin-top:4px}.back{padding:9px 14px;border:1px solid #d8dee9;background:#fff;border-radius:10px}.hero{background:#fff;border:1px solid #e2e8f0;border-radius:16px;padding:18px}h1{margin:0 0 6px;font-size:26px}p{color:#64748b}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.btn{border:1px solid #dbe3ee;border-radius:12px;padding:15px;text-align:left;background:#fff;cursor:pointer}.btn strong{display:block;font-size:16px}.btn small{display:block;color:#64748b;margin-top:4px}.status{margin-top:12px;padding:10px 12px;border:1px dashed #cbd5e1;background:#f8fafc;border-radius:10px;color:#64748b}.status.ok{background:#f0fdf4;border-color:#86efac;color:#166534}.card{margin-top:14px;background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:12px;overflow:auto}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:8px;border-bottom:1px solid #edf1f5;text-align:left;font-size:13px}th{background:#f8fafc}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:10px}.mini{padding:8px 11px;border:1px solid #d8dee9;background:#fff;border-radius:9px;cursor:pointer}.layout-wrap{width:100%;margin-top:14px}.layout-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:10px 12px}.classroom{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:14px;margin-top:14px;width:100%;min-height:calc(100vh - 250px)}.group{border:2px solid #d7e0ea;border-radius:14px;padding:12px;background:#fff;display:flex;flex-direction:column;min-width:0}.group h3{margin:0 0 10px;text-align:center;font-size:18px}.desks{display:grid;grid-template-columns:repeat(1,minmax(0,1fr));gap:7px;flex:1}.desk{display:grid;grid-template-columns:30px 1fr 1fr;gap:7px;align-items:stretch}.rowno{display:flex;align-items:center;justify-content:center;color:#64748b;font-size:12px}.seat{background:#f8fafc;border:1px solid #dbe3ee;border-radius:9px;padding:8px 10px;display:flex;align-items:center;min-height:38px}.seat b{display:block;font-size:13px;line-height:1.25}.note{margin:12px 2px 0;color:#64748b;font-size:13px}@media(max-width:900px){.wrap{padding:10px}.head{align-items:flex-start}.actions{grid-template-columns:1fr}.classroom{grid-template-columns:1fr;grid-template-rows:auto;min-height:auto}.group{min-height:280px}}
</style></head><body><div class="wrap"><div class="head"><div class="brand">🧰 TIỆN ÍCH — THẦY LÊ HOÀNG<small>Trang độc lập · không liên quan dữ liệu/menu quản lý lớp học</small></div><a class="back" href="index.html">← Về Quản lý lớp học</a></div><div class="hero"><h1>Tiện ích</h1><p>Chỉ dùng để tải danh sách trình độ và xếp sơ đồ lớp/xếp tổ. Không đọc, ghi, sửa hoặc xóa Google Sheets.</p><div class="actions"><button class="btn" id="uploadBtn" type="button"><strong>📤 Tải lên</strong><small>Mẫu: STT | Họ và tên | Giới tính | Xếp loại | Ghi chú</small></button><button class="btn" id="layoutBtn" type="button"><strong>📐 Tạo sơ đồ lớp học</strong><small>4 tổ · 2 HS/bàn · cân bằng T/H</small></button></div><div id="status" class="status">Chưa tải danh sách.</div></div><input id="file" type="file" accept=".csv,.tsv,.txt" hidden><div id="preview"></div><div id="layout" class="layout-wrap" hidden></div></div><script>(function(){'use strict';let data=[];const $=id=>document.getElementById(id),clean=v=>String(v??'').trim().replace(/\s+/g,' '),norm=v=>clean(v).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d'),esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');function split(line){let s=line.trim();if(s.startsWith('|'))s=s.slice(1);if(s.endsWith('|'))s=s.slice(0,-1);if(s.includes('\t'))return s.split('\t').map(clean);if(s.includes('|'))return s.split('|').map(clean);if(s.includes(';'))return s.split(';').map(clean);return s.split(',').map(clean)}function dividerRow(r){return r.length>0&&r.every(v=>/^:?-{2,}:?$/.test(clean(v)))}function parse(text){const rows=String(text||'').replace(/^\uFEFF/,'').replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean).map(split);if(!rows.length)throw Error('Tệp không có dữ liệu.');let hi=-1;for(let i=0;i<Math.min(rows.length,5);i++){const h=rows[i].map(norm);if(h.some(x=>x==='ho va ten'||x.includes('ho va ten')||x==='ho ten'||x.includes('hoc sinh')||x==='name')){hi=i;break}}const h=(hi>=0?rows[hi]:rows[0]).map(norm),find=(arr,def)=>{const i=h.findIndex(x=>arr.some(n=>x===n||x.includes(n)));return i>=0?i:def},nameI=find(['ho va ten','ho ten','hoc sinh','name'],1),genderI=find(['gioi tinh'],2),levelI=find(['xep loai','trinh do','hoc luc','level'],3),noteI=find(['ghi chu','note'],4),start=hi>=0?hi+1:0,out=[];for(let i=start;i<rows.length;i++){const r=rows[i];if(dividerRow(r))continue;const name=clean(r[nameI]);if(!name)continue;const nn=norm(name);if(nn==='ho va ten'||nn==='ho ten'||nn==='hoc sinh'||nn==='name')continue;out.push({stt:out.length+1,name,gender:clean(r[genderI]),level:clean(r[levelI])||'H',note:clean(r[noteI])})}if(out.length!==42)throw Error('Danh sách phải có đúng 42 học sinh. Hiện đã đọc '+out.length+' học sinh.');return out}function rank(v){const s=norm(v);if(s==='t'||/tot|gioi|xuat sac/.test(s))return 2;if(s==='h'||/hoan thanh|kha|dat/.test(s))return 1;return 0}function shuffle(a){const x=a.slice();for(let i=x.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}function pair(list){const w=shuffle(list),p=[];while(w.length){const first=w.shift();let bi=-1,bd=99;for(let i=0;i<w.length;i++){const d=Math.abs(rank(first.level)-rank(w[i].level));if(d<bd){bd=d;bi=i;if(d===0)break}}p.push([first,bi>=0?w.splice(bi,1)[0]:null])}return p}function renderPreview(){$('preview').innerHTML='<div class="card"><div class="toolbar"><b>Danh sách đã tải: '+data.length+' học sinh</b><button class="mini" id="layout2" type="button">📐 Tạo sơ đồ</button></div><div style="overflow:auto;margin-top:10px"><table><thead><tr><th>STT</th><th>Họ và tên</th><th>Giới tính</th><th>Xếp loại</th><th>Ghi chú</th></tr></thead><tbody>'+data.map(s=>'<tr><td>'+s.stt+'</td><td>'+esc(s.name)+'</td><td>'+esc(s.gender)+'</td><td><b>'+esc(s.level)+'</b></td><td>'+esc(s.note)+'</td></tr>').join('')+'</tbody></table></div></div>';$('layout2').onclick=renderLayout}function renderLayout(){if(data.length!==42){alert('Danh sách phải có đúng 42 học sinh.');return}const cols=[[],[],[],[]];pair(data).forEach((p,i)=>cols[i%4].push(p));$('layout').hidden=false;$('layout').innerHTML='<div class="layout-toolbar"><b>42 học sinh · 21 bàn · 4 tổ · 2 HS/bàn</b><button class="mini" id="reshuffle" type="button">🔀 Xếp lại</button></div><div class="classroom">'+cols.map((c,i)=>'<div class="group"><h3>Tổ '+(i+1)+'</h3><div class="desks">'+c.map((p,j)=>'<div class="desk"><span class="rowno">'+(j+1)+'</span><div class="seat"><b>'+esc(p[0].name)+'</b></div><div class="seat">'+(p[1]?'<b>'+esc(p[1].name)+'</b>':'—')+'</div></div>').join('')+'</div></div>').join('')+'</div><p class="note">Xếp loại T/H chỉ dùng làm căn cứ cân bằng khi xếp chỗ; không hiển thị trên sơ đồ lớp.</p>';$('reshuffle').onclick=renderLayout}$('uploadBtn').onclick=function(){$('file').click()};$('file').onchange=async function(){const f=$('file').files[0];$('file').value='';if(!f)return;try{data=parse(await f.text());$('status').className='status ok';$('status').innerHTML='Đã tải <b>'+data.length+'</b> học sinh từ <b>'+esc(f.name)+'</b> · mẫu 5 cột hợp lệ.';renderPreview()}catch(e){$('status').className='status';alert(e.message||'Tệp không hợp lệ.')}};$('layoutBtn').onclick=renderLayout})();</script></body></html>
