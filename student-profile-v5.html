<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Hồ sơ học sinh | Thầy Lê Hoàng</title><style>body{margin:0;background:#f8fafc;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#0f172a}.wrap{max-width:1100px;margin:auto;padding:18px}.top{font-weight:800;margin-bottom:16px}.top small{display:block;color:#64748b;font-weight:500;margin-top:4px}.card{background:#fff;border:1px solid #e2e8f0;border-radius:18px;box-shadow:0 10px 28px rgba(15,23,42,.07);padding:18px;margin-bottom:14px}.loading{text-align:center;color:#64748b;padding:46px}.error{text-align:center}.hero{display:flex;align-items:center;gap:15px}.avatar{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:#2563eb;color:#fff;font-weight:900;font-size:21px}.eyebrow{font-size:12px;font-weight:800;color:#2563eb;text-transform:uppercase}.hero h1{margin:5px 0;font-size:27px}.hero p{margin:0;color:#64748b}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.stat{background:#f8fafc;border:1px solid #e2e8f0;border-radius:11px;padding:12px;text-align:center}.stat b{display:block;font-size:21px}.stat span{font-size:12px;color:#64748b}.sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.section{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:14px}.section h2{font-size:16px;margin:0 0 9px}.list{display:grid;gap:7px}.item{padding:9px 10px;border-radius:9px;background:#f8fafc;border-left:3px solid #2563eb;line-height:1.45}.positive{border-left-color:#16a34a;background:#f0fdf4}.negative{border-left-color:#dc2626;background:#fef2f2}.reminder{border-left-color:#d97706;background:#fffbeb}.empty{color:#64748b;margin:0}.note{font-size:12px;color:#64748b;margin-top:12px}@media(max-width:800px){.wrap{padding:12px}.stats{grid-template-columns:repeat(3,1fr)}.sections{grid-template-columns:1fr}.hero h1{font-size:22px}}</style></head><body><main class="wrap"><div class="top">📚 QUẢN LÝ LỚP HỌC THẦY LÊ HOÀNG<small>Năm học 2026–2027 · Lớp 5A3</small></div><section id="loading" class="card loading">Đang kết nối Google Sheets…</section><section id="error" class="card error" hidden></section><div id="profile" hidden></div><p class="note">Trang chỉ hiển thị thông tin được phép chia sẻ với học sinh/phụ huynh; không hiển thị số điện thoại, địa chỉ hoặc dữ liệu gia đình.</p></main><script>'use strict';const $=id=>document.getElementById(id),clean=v=>String(v??'').trim().replace(/\s+/g,' '),esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;').replace(/'/g,'&#039;'),API='https://script.google.com/macros/s/AKfycbxTPwf-jhrR8JOoKY5ZLuzlsDgcv3nWILtDPTrNWY5DCEPpm2rkpXTn-sPAdFaUyy0z_uw/exec',PREFIX='LH_STUDENT_PROFILE_V3|2026-2027|5A3|';function fail(msg){$('loading').hidden=true;$('error').hidden=false;$('error').innerHTML='<div style="font-size:40px">🔒</div><h2>Không mở được hồ sơ</h2><p>'+esc(msg)+'</p><p>Hãy dùng đúng link cá nhân do giáo viên cung cấp.</p>'}function jsonp(action,params){return new Promise((resolve,reject)=>{const cb='__LHSP5_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false;const finish=(e,d)=>{if(done)return;done=true;clearTimeout(t);try{delete window[cb]}catch(_){}s.remove();e?reject(e):resolve(d)},t=setTimeout(()=>finish(Error('Google Apps Script không phản hồi sau 30 giây.')),30000);window[cb]=d=>finish(null,d);s.onerror=()=>finish(Error('Không truy cập được Google Apps Script.'));const q=Object.assign({action,callback:cb,_:Date.now()},params||{});s.src=API+'?'+Object.keys(q).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(typeof q[k]==='string'?q[k]:JSON.stringify(q[k]))).join('&');document.head.appendChild(s)})}async function tokenForStudent(id){const raw=PREFIX+clean(id),d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));return[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('')}function fmtDate(v){const s=clean(v),m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+'/'+m[2]+'/'+m[1]:s}function status(v){const x=clean(v).toLocaleLowerCase('vi');if(['present','co mat','có mặt','đi học'].includes(x))return'Có mặt';if(['excused','co phep','có phép'].includes(x))return'Có phép';if(['absent','vang','vắng','không phép'].includes(x))return'Không phép';return clean(v)}function items(a,fn,cls=''){if(!Array.isArray(a)||!a.length)return'<p class="empty">Chưa có dữ liệu.</p>';return'<div class="list">'+a.slice().sort((x,y)=>String(y.date||'').localeCompare(String(x.date||''))).slice(0,8).map(x=>'<div class="item '+cls+'">'+fn(x)+'</div>').join('')+'</div>'}function render(d){const s=d.student,att=Array.isArray(d.DIEM_DANH)?d.DIEM_DANH:[],vio=Array.isArray(d.VI_PHAM)?d.VI_PHAM:[],rew=Array.isArray(d.KHEN_THUONG)?d.KHEN_THUONG:[],learn=Array.isArray(d.HOC_TAP)?d.HOC_TAP:[],prog=Array.isArray(d.TIEN_BO)?d.TIEN_BO:[],comments=Array.isArray(d.NHAN_XET)?d.NHAN_XET:[],present=att.filter(x=>status(x.status)==='Có mặt').length,excused=att.filter(x=>status(x.status)==='Có phép').length,absent=att.filter(x=>status(x.status)==='Không phép').length,groups={};learn.forEach(x=>{const subject=clean(x.subject)||'Khác';(groups[subject]??=[]).push(x)});const subjects=Object.entries(groups).map(([subject,a])=>{const x=a[0];return'<div class="item"><b>'+esc(subject)+'</b><br>'+esc(clean(x.result)||clean(x.level)||clean(x.note)||'Đã có ghi nhận')+'</div>'}).join('')||'<p class="empty">Chưa có dữ liệu.</p>',reminders=[...new Set(vio.filter(x=>clean(x.status).toLocaleLowerCase('vi')!=='resolved').map(x=>clean(x.action)||clean(x.note)).filter(Boolean))],initials=clean(s.name).split(/\s+/).slice(-2).map(x=>x[0]).join('').toUpperCase();$('loading').hidden=true;$('profile').hidden=false;$('profile').innerHTML='<section class="card"><div class="hero"><div class="avatar">'+esc(initials||'HS')+'</div><div><span class="eyebrow">HỒ SƠ HỌC SINH</span><h1>'+esc(s.name)+'</h1><p>'+esc(s.gender||'')+(s.birthDate?' · '+esc(fmtDate(s.birthDate)):'')+'</p></div></div></section><section class="card"><div class="stats"><div class="stat"><b>'+att.length+'</b><span>Lần điểm danh</span></div><div class="stat"><b>'+present+'</b><span>Có mặt</span></div><div class="stat"><b>'+excused+'</b><span>Có phép</span></div><div class="stat"><b>'+absent+'</b><span>Không phép</span></div><div class="stat"><b>'+vio.length+'</b><span>Vi phạm</span></div><div class="stat"><b>'+rew.length+'</b><span>Khen thưởng</span></div></div></section><section class="sections"><article class="section"><h2>📅 Chuyên cần</h2>'+items(att,x=>'<b>'+esc(fmtDate(x.date))+'</b> — '+esc(status(x.status))+(x.note?' — '+esc(x.note):''))+'</article><article class="section"><h2>⚠️ Vi phạm</h2>'+items(vio,x=>'<b>'+esc(fmtDate(x.date))+'</b> — '+esc(x.type||'Ghi nhận')+(x.note?' — '+esc(x.note):''),'negative')+'</article><article class="section"><h2>🏆 Khen thưởng</h2>'+items(rew,x=>'<b>'+esc(fmtDate(x.date))+'</b> — '+esc(x.type||'Ghi nhận')+(x.note?' — '+esc(x.note):''),'positive')+'</article><article class="section"><h2>📚 Kết quả học tập</h2><div class="list">'+subjects+'</div></article><article class="section"><h2>📈 Tiến bộ</h2>'+items(prog,x=>'<b>'+esc(fmtDate(x.date))+'</b> — '+esc(x.result||x.level||x.note||x.category||'Có ghi nhận'),'positive')+'</article><article class="section"><h2>📝 Nhận xét của giáo viên</h2>'+items(comments,x=>'<b>'+esc(fmtDate(x.date))+'</b> — '+esc(x.content||x.note||''))+'</article><article class="section"><h2>🔔 Những điều cần nhắc nhở</h2>'+(reminders.length?'<div class="list">'+reminders.slice(0,8).map(x=>'<div class="item reminder">'+esc(x)+'</div>').join('')+'</div>':'<p class="empty">Hiện chưa có nội dung cần nhắc nhở được giáo viên ghi nhận.</p>')+'</article></section>'}async function main(){try{const token=clean(new URLSearchParams(location.search).get('t'));if(!token)return fail('Liên kết không có mã truy cập cá nhân.');const data=await jsonp('get_all');if(!data?.ok)throw Error(data?.error||'Google Apps Script không trả dữ liệu hợp lệ.');const students=Array.isArray(data.HOC_SINH)?data.HOC_SINH:[];if(!students.length)throw Error('Google Sheets chưa trả về danh sách học sinh.');let student=null;for(const x of students){if(clean(x?.id)&&await tokenForStudent(x.id)===token){student=x;break}}if(!student)return fail('Mã truy cập không hợp lệ hoặc liên kết đã thay đổi.');if(student.shareEnabled===false)return fail('Liên kết hồ sơ hiện đang được khóa.');render({student,DIEM_DANH:(data.DIEM_DANH||[]).filter(x=>clean(x?.studentId)===clean(student.id)),VI_PHAM:(data.VI_PHAM||[]).filter(x=>clean(x?.studentId)===clean(student.id)),KHEN_THUONG:(data.KHEN_THUONG||[]).filter(x=>clean(x?.studentId)===clean(student.id)),HOC_TAP:(data.HOC_TAP||[]).filter(x=>clean(x?.studentId)===clean(student.id)),TIEN_BO:(data.TIEN_BO||[]).filter(x=>clean(x?.studentId)===clean(student.id)),NHAN_XET:(data.NHAN_XET||[]).filter(x=>clean(x?.studentId)===clean(student.id)&&x?.visibleToStudent!==false)})}catch(e){fail(e?.message||'Không tải được dữ liệu hồ sơ.')}}main();</script></body></html>
