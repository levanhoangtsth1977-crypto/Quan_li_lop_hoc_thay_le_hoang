<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Hồ sơ học sinh | Thầy Lê Hoàng</title><style>:root{--p:#2563eb;--s:#16a34a;--w:#d97706;--d:#dc2626;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f8fafc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eff6ff,#f8fafc 50%,#ecfdf5);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}.wrap{max-width:1100px;margin:auto;padding:18px}.top{font-weight:800;margin-bottom:16px}.top small{display:block;color:var(--muted);font-weight:500;margin-top:4px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(15,23,42,.07);padding:18px;margin-bottom:14px}.loading{text-align:center;color:var(--muted);padding:46px}.error{text-align:center}.hero{display:flex;align-items:center;gap:15px}.avatar{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--p);color:#fff;font-weight:900;font-size:21px}.eyebrow{font-size:12px;font-weight:800;color:var(--p);text-transform:uppercase}.hero h1{margin:5px 0;font-size:27px}.hero p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.stat{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px;text-align:center}.stat b{display:block;font-size:21px}.stat span{font-size:12px;color:var(--muted)}.sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.section h2{font-size:16px;margin:0 0 9px}.list{display:grid;gap:7px}.item{padding:9px 10px;border-radius:9px;background:var(--bg);border-left:3px solid var(--p);line-height:1.45}.positive{border-left-color:var(--s);background:#f0fdf4}.negative{border-left-color:var(--d);background:#fef2f2}.reminder{border-left-color:var(--w);background:#fffbeb}.empty{color:var(--muted);margin:0}.source{font-size:11px;color:var(--muted);margin-top:8px}.note{font-size:12px;color:var(--muted);margin-top:12px}@media(max-width:800px){.wrap{padding:12px}.stats{grid-template-columns:repeat(3,1fr)}.sections{grid-template-columns:1fr}.hero h1{font-size:22px}}</style></head><body><main class="wrap"><div class="top">📚 QUẢN LÝ LỚP HỌC THẦY LÊ HOÀNG<small>Năm học 2026–2027 · Lớp 5A3</small></div><section id="loading" class="card loading">Đang tải hồ sơ học sinh…</section><section id="error" class="card error" hidden></section><div id="profile" hidden></div><p class="note">Trang chỉ hiển thị thông tin được phép chia sẻ với học sinh/phụ huynh; không hiển thị số điện thoại, địa chỉ hoặc dữ liệu gia đình.</p></main><script>'use strict';const $=id=>document.getElementById(id),clean=v=>String(v??'').trim().replace(/\s+/g,' '),esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'),norm=v=>clean(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'d').toLocaleLowerCase('vi'),GAS='https://script.google.com/macros/s/AKfycbxTPwf-jhrR8JOoKY5ZLuzlsDgcv3nWILtDPTrYNWZCEPpm2rkpXTn-sPAdFaUyy0z_uw/exec',PREFIX='LH_STUDENT_PROFILE_V3|2026-2027|5A3|',KEY='LH_CANONICAL_2026_2027';function fail(msg){$('loading').hidden=true;$('error').hidden=false;$('error').innerHTML='<div style="font-size:40px">🔒</div><h2>Không mở được hồ sơ</h2><p>'+esc(msg)+'</p><p>Hãy dùng đúng link cá nhân do giáo viên cung cấp.</p>'}function jsonp(action,params,ms=30000){return new Promise((resolve,reject)=>{const cb='__LHSP5_'+Date.now()+'_'+Math.random().toString(36).slice(2),s=document.createElement('script');let done=false,timer;const cleanup=()=>{try{delete window[cb]}catch(_){}s.remove();clearTimeout(timer)},ok=d=>{if(done)return;done=true;cleanup();resolve(d)},bad=e=>{if(done)return;done=true;cleanup();reject(e)};timer=setTimeout(()=>bad(Error('Google Apps Script không phản hồi.')),ms);window[cb]=ok;s.onerror=()=>bad(Error('Không truy cập được Google Apps Script.'));const q=Object.assign({action,callback:cb,_:Date.now()},params||{});s.src=GAS+'?'+Object.keys(q).map(k=>encodeURIComponent(k)+'='+encodeURIComponent(typeof q[k]==='string'?q[k]:JSON.stringify(q[k]))).join('&');document.head.appendChild(s)})}async function sha256(v){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));return[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('')}function fmtDate(v){const s=clean(v);const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+'/'+m[2]+'/'+m[1]:s}function status(v){const x=clean(v).toLocaleLowerCase('vi');if(['present','co mat','có mặt','đi học'].includes(x))return'Có mặt';if(['excused','co phep','có phép'].includes(x))return'Có phép';if(['absent','vang','vắng','không phép'].includes(x))return'Không phép';return clean(v)}function localData(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');return d&&typeof d==='object'?d:null}catch{return null}}function localStudent(name){const d=localData();return d&&Array.isArray(d.students)?d.students.find(s=>norm(s?.name)===norm(name)):null}function localEvents(d,sid){if(!d||!sid)return{DIEM_DANH:[],VI_PHAM:[],KHEN_THUONG:[],HOC_TAP:[],TIEN_BO:[],NHAN_XET:[]};const a=Array.isArray(d.attendance)?d.attendance.filter(x=>clean(x?.studentId)===sid):[],v=Array.isArray(d.violations)?d.violations.filter(x=>clean(x?.studentId)===sid):[],r=Array.isArray(d.rewards)?d.rewards.filter(x=>clean(x?.studentId)===sid):[],l=Object.values(d.learning||{}).flat().filter(x=>clean(x?.studentId)===sid),p=Array.isArray(d.progress)?d.progress.filter(x=>clean(x?.studentId)===sid):[],c=Array.isArray(d.comments)?d.comments.filter(x=>clean(x?.studentId)===sid):[];return{DIEM_DANH:a,VI_PHAM:v,KHEN_THUONG:r,HOC_TAP:l,TIEN_BO:p,NHAN_XET:c}}function fingerprint(x){return[clean(x?.date),clean(x?.type),clean(x?.status),clean(x?.level),clean(x?.subject),clean(x?.result),clean(x?.category),clean(x?.content),clean(x?.note),clean(x?.action)].join('|').toLocaleLowerCase('vi')}function merge(remote,local){const out={};for(const k of ['DIEM_DANH','VI_PHAM','KHEN_THUONG','HOC_TAP','TIEN_BO','NHAN_XET']){const seen=new Set(),arr=[];for(const x of [...(Array.isArray(remote?.[k])?remote[k]:[]),...(Array.isArray(local?.[k])?local[k]:[])]){const f=fingerprint(x);if(seen.has(f))continue;seen.add(f);arr.push(x)}out[k]=arr}return out}function items(a,fn,cls=''){if(!Array.isArray(a)||!a.length)return'<p class="empty">Chưa có dữ liệu.</p>';return'<div class="list">'+a.slice().sort((x,y)=>String(y.date||'').localeCompare(String(x.date||''))).map(x=>'<div class="item '+cls+'">'+fn(x)+'</div>').join('')+'</div>'}function render(st,data,sourceLabel){const local=localStudent(st.name),merged=merge(data,localEvents(localData(),local?.id)),sid=clean(st.id),name=clean(st.name),match=x=>clean(x?.studentId)===sid||clean(x?.studentName)===name,att=merged.DIEM_DANH.filter(match),vio=merged.VI_PHAM.filter(match),rew=merged.KHEN_THUONG.filter(match),learn=merged.HOC_TAP.filter(match),prog=merged.TIEN_BO.filter(match),comments=merged.NHAN_XET.filter(x=>match(x)&&x?.visibleToStudent!==false),present=att.filter(x=>status(x.status)==='Có mặt').length,excused=att.filter(x=>status(x.status)==='Có phép').length,absent=att.filter(x=>status(x.status)==='Không phép').length,groups={};learn.forEach(x=>{const s=clean(x.subject)||'Khác';(groups[s]??=[]).push(x)});const subjects=Object.entries(groups).map(([s,a])=>{const x=a.slice().sort((u,v)=>String(v.date||'').localeCompare(String(u.date||'')))[0];return'<div class="item"><b>'+esc(s)+'</b><br>'+esc(clean(x.result)||clean(x.level)||clean(x.note)||'Đã có ghi nhận')+'</div>'}).join('')||'<p class="empty">Chưa có dữ liệu.</p>',reminders=[...new Set(vio.filter(x=>clean(x.status).toLocaleLowerCase('vi')!=='resolved').map(x=>clean(x.action)||clean(x.note)).filter(Boolean))],initials=clean(st.name).split(/\s+/).slice(-2).map(x=>x[0]).join('').toUpperCase();$('loading').hidden=true;$('profile').hidden=false;$('profile').innerHTML='<section class="card"><div class="hero"><div class="avatar">'+esc(initials||'HS')+'</div><div><span class="eyebrow">HỒ SƠ HỌC SINH · 5A3</span><h1>'+esc(st.name)+'</h1><p>'+esc(st.gender||'')+(st.birthDate?' · '+esc(fmtDate(st.birthDate)):'')+'</p></div></div><div class="source">Nguồn hồ sơ: '+esc(sourceLabel)+'</div></section><section class="card"><div class="stats"><div class="stat"><b>'+att.length+'</b><span>Lần điểm danh</span></div><div class="stat"><b>'+present+'</b><span>Có mặt</span></div><div class="stat"><b>'+excused+'</b><span>Có phép</span></div><div class="stat"><b>'+absent+'</b><span>Không phép</span></div><div class="stat"><b>'+vio.length+'</b><span>Vi phạm</span></div><div class="stat"><b>'+rew.length+'</b><span>Khen thưởng</span></div></div></section><section class="sections"><article class="section"><h2>📅 Điểm danh</h2>'+items(att,x=>'<b>'+esc(fmtDate(x.date))+'</b> — '+esc(status(x.status))+(x.note?' — '+esc(x.note):''))+'</article><article class="section"><h2>⚠️ Vi phạm</h2>'+items(vio,x=>'<b>'+esc(fmtDate(x.date))+'</b> — '+esc(x.type||'Ghi nhận')+(x.level?' — Mức độ: '+esc(x.level):'')+(x.note?' — '+esc(x.note):''),'negative')+'</article><article class="section"><h2>🏆 Khen thưởng</h2>'+items(rew,x=>'<b>'+esc(fmtDate(x.date))+'</b> — '+esc(x.type||'Ghi nhận')+(x.note?' — '+esc(x.note):''),'positive')+'</article><article class="section"><h2>📚 Kết quả học tập</h2><div class="list">'+subjects+'</div></article><article class="section"><h2>📈 Tiến bộ</h2>'+items(prog,x=>'<b>'+esc(fmtDate(x.date))+'</b> — '+esc(x.result||x.level||x.note||x.category||'Có ghi nhận'),'positive')+'</article><article class="section"><h2>📝 Nhận xét của giáo viên</h2>'+items(comments,x=>'<b>'+esc(fmtDate(x.date))+'</b> — '+esc(x.content||x.note||''))+'</article><article class="section"><h2>🔔 Những điều cần nhắc nhở</h2>'+(reminders.length?'<div class="list">'+reminders.slice(0,12).map(x=>'<div class="item reminder">'+esc(x)+'</div>').join('')+'</div>':'<p class="empty">Hiện chưa có nội dung cần nhắc nhở được giáo viên ghi nhận.</p>')+'</article></section>'}async function main(){try{const token=clean(new URLSearchParams(location.search).get('t'));if(!token)return fail('Liên kết không có mã truy cập cá nhân.');const rosterResp=await jsonp('get_students');if(!rosterResp?.ok||!Array.isArray(rosterResp.students))throw Error(rosterResp?.error||'Không lấy được danh sách học sinh.');let student=null;for(const s of rosterResp.students){if(clean(s?.id)&&await sha256(PREFIX+clean(s.id))===token){student=s;break}}if(!student)return fail('Mã truy cập không hợp lệ hoặc liên kết đã thay đổi.');if(student.shareEnabled===false)return fail('Liên kết hồ sơ hiện đang được khóa.');const allResp=await jsonp('get_all');if(!allResp?.ok)throw Error(allResp?.error||'Không tải được dữ liệu hồ sơ.');const hasLocal=!!localStudent(student.name);render(student,allResp,hasLocal?'Google Sheets + dữ liệu hồ sơ cục bộ mới nhất':'Google Sheets');}catch(e){fail(e?.message||'Không tải được dữ liệu hồ sơ.')}}main();</script></body></html>
