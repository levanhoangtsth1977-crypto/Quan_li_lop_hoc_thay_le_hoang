<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Hồ sơ học sinh | Thầy Lê Hoàng</title><style>:root{--p:#2563eb;--s:#16a34a;--w:#d97706;--d:#dc2626;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f8fafc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eff6ff,#f8fafc 50%,#ecfdf5);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}.wrap{max-width:1100px;margin:auto;padding:18px}.top{font-weight:800;margin-bottom:16px}.top small{display:block;color:var(--muted);font-weight:500;margin-top:4px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(15,23,42,.07);padding:18px;margin-bottom:14px}.loading{text-align:center;color:var(--muted);padding:46px}.error{text-align:center}.hero{display:flex;align-items:center;gap:15px}.avatar{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--p);color:#fff;font-weight:900;font-size:21px}.eyebrow{font-size:12px;font-weight:800;color:var(--p);text-transform:uppercase}.hero h1{margin:5px 0;font-size:27px}.hero p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.stat{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px;text-align:center}.stat b{display:block;font-size:21px}.stat span{font-size:12px;color:var(--muted)}.sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.section h2{font-size:16px;margin:0 0 9px}.list{display:grid;gap:7px}.item{padding:9px 10px;border-radius:9px;background:var(--bg);border-left:3px solid var(--p);line-height:1.45}.positive{border-left-color:var(--s);background:#f0fdf4}.negative{border-left-color:var(--d);background:#fef2f2}.reminder{border-left-color:var(--w);background:#fffbeb}.empty{color:var(--muted);margin:0}.source{font-size:11px;color:var(--muted);margin-top:8px}.note{font-size:12px;color:var(--muted);margin-top:12px}@media(max-width:800px){.wrap{padding:12px}.stats{grid-template-columns:repeat(3,1fr)}.sections{grid-template-columns:1fr}.hero h1{font-size:22px}}</style></head><body><main class="wrap"><div class="top">📚 QUẢN LÝ LỚP HỌC THẦY LÊ HOÀNG<small>Năm học 2026–2027 · Lớp 5A3</small></div><section id="loading" class="card loading">Đang tải hồ sơ học sinh…</section><section id="error" class="card error" hidden></section><div id="profile" hidden></div><p class="note">Trang chỉ hiển thị thông tin được phép chia sẻ với học sinh/phụ huynh; không hiển thị số điện thoại, địa chỉ hoặc dữ liệu gia đình.</p></main><script>'use strict';const $=id=>document.getElementById(id),clean=v=>String(v??'').trim().replace(/\s+/g,' '),esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'),KEY='LH_CANONICAL_2026_2027';function fail(msg){$('loading').hidden=true;$('error').hidden=false;$('error').innerHTML='<div style="font-size:40px">🔒</div><h2>Không mở được hồ sơ</h2><p>'+esc(msg)+'</p><p>Hãy dùng đúng link cá nhân do giáo viên cung cấp.</p>'}function fmtDate(v){const s=clean(v);const iso=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(iso)return iso[3]+'/'+iso[2]+'/'+iso[1];const d=new Date(s);return Number.isNaN(d.getTime())?s:(String(d.getUTCDate()).padStart(2,'0')+'/'+String(d.getUTCMonth()+1).padStart(2,'0')+'/'+d.getUTCFullYear())}function status(v){const x=clean(v).toLocaleLowerCase('vi');if(['present','co mat','có mặt','đi học'].includes(x))return'Có mặt';if(['excused','co phep','có phép'].includes(x))return'Có phép';if(['absent','vang','vắng','không phép'].includes(x))return'Không phép';return clean(v)}async function load(){const token=clean(new URLSearchParams(location.search).get('t'));if(!token)return fail('Liên kết không có mã truy cập cá nhân.');const r=await fetch('/api/student-data?t='+encodeURIComponent(token)+'&_='+Date.now(),{cache:'no-store',credentials:'same-origin'});const data=await r.json().catch(()=>null);if(!r.ok||!data?.ok)throw Error(data?.error||'Không tải được dữ liệu hồ sơ.');return data}function localData(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');return d&&typeof d==='object'?d:null}catch{return null}}function fold(s){return clean(s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/đ/g,'d').replace(/Đ/g,'d').toLocaleLowerCase('vi')}function localStudent(name){const d=localData();return d&&Array.isArray(d.students)?d.students.find(s=>fold(s?.name)===fold(name)):null}function localEvents(){const d=localData();return d?{DIEM_DANH:Array.isArray(d.attendance)?d.attendance:[],VI_PHAM:Array.isArray(d.violations)?d.violations:[],KHEN_THUONG:Array.isArray(d.rewards)?d.rewards:[],HOC_TAP:Object.values(d.learning||{}).flat(),TIEN_BO:Array.isArray(d.progress)?d.progress:[],NHAN_XET:Array.isArray(d.comments)?d.comments:[]}:{DIEM_DANH:[],VI_PHAM:[],KHEN_THUONG:[],HOC_TAP:[],TIEN_BO:[],NHAN_XET:[]}}function fp(x){return[clean(x?.date),clean(x?.type),clean(x?.status),clean(x?.level),clean(x?.subject),clean(x?.result),clean(x?.category),clean(x?.content),clean(x?.note),clean(x?.action)].join('|').toLocaleLowerCase('vi')}function merge(remote,local,student){const out={};const ls=localStudent(student.name);const local=localEvents();for(const k of ['DIEM_DANH','VI_PHAM','KHEN_THUONG','HOC_TAP','TIEN_BO','NHAN_XET']){const a=Array.isArray(remote?.[k])?remote[k]:[],b=(Array.isArray(local?.[k])?local[k]:[]).filter(x=>clean(x?.studentId)===clean(ls?.id));const seen=new Set(),rows=[];for(const x of [...a,...b]){const idfp=fp(x);if(seen.has(idfp))continue;seen.add(idfp);rows.push(x)}out[k]=rows}return out}function items(a,fn,cls=''){if(!Array.isArray(a)||!a.length)return'<p class="empty">Chưa có dữ liệu.</p>';return'<div class="list">'+a.slice().sort((x,y)=>String(y.date||'').localeCompare(String(x.date||''))).map(x=>'<div class="item '+cls+'">'+fn(x)+'</div>').join('')+'</div>'}function render(data){const st=data.student,merged=merge(data,localEvents(),st),sid=clean(st.id),name=clean(st.name),match=x=>clean(x?.studentId)===sid||clean(x?.studentName)===name,att=merged.DIEM_DANH.filter(match),vio=merged.VI_PHAM.filter(match),rew=merged.KHEN_THUONG.filter(match),learn=merged.HOC_TAP.filter(match),prog=merged.TIEN_BO.filter(match),comments=merged.NHAN_XET.filter(x=>match(x)&&x?.visibleToStudent!==false),present=att.filter(x=>status(x.status)==='Có mặt').length,excused=att.filter(x=>status(x.status)==='Có phép').length,absent=att.filter(x=>status(x.status)==='Không phép').length,groups={};learn.forEach(x=>{const s=clean(x.subject)||'Khác';(groups[s]??=[]).push(x)});const subjects=Object.entries(groups).map(([s,a])=>{const x=a.slice().sort((u,v)=>String(v.date||'').localeCompare(String(u.date||'')))[0];return'<div class="item"><b>'+esc(s)+'</b><br>'+esc(clean(x.result)||clean(x.level)||clean(x.note)||'Đã có ghi nhận')+'</div>'}).join('')||'<p class="empty">Chưa có dữ liệu.</p>',reminders=[...new Set(vio.filter(x=>clean(x.status).toLocaleLowerCase('vi')!=='resolved'&&clean(x.status).toLocaleLowerCase('vi')!=='đã xử lý').map(x=>clean(x.action)||clean(x.note)).filter(Boolean))],initials=clean(st.name).split(/\s+/).slice(-2).map(x=>x[0]).join('').toUpperCase();$('loading').hidden=true;$('profile').hidden=false;$('profile').innerHTML='<section class="card"><div class="hero"><div class="avatar">'+esc(initials||'HS')+'</div><div><span class="eyebrow">HỒ SƠ HỌC SINH · 5A3</span><h1>'+esc(st.name)+'</h1><p>'+esc(st.gender||'')+(st.birthDate?' · '+esc(fmtDate(st.birthDate)):'')+'</p></div></div><div class="source">Nguồn hồ sơ: Google Sheets + dữ liệu cục bộ mới nhất khi có.</div></section><section class="card"><div class="stats"><div class="stat"><b>'+att.length+'</b><span>Lần điểm danh</span></div><div class="stat"><b>'+present+'</b><span>Có mặt</span></div><div class="stat"><b>'+excused+'</b><span>Có phép</span></div><div class="stat"><b>'+absent+'</b><span>Không phép</span></div><div class="stat"><b>'+vio.length+'</b><span>Vi phạm</span></div><div class="stat"><b>'+rew.length+'</b><span>Khen thưởng</span></div></div></section><section class="sections"><article class="section"><h2>📅 Điểm danh</h2>'+items(att,x=>'<b>'+esc(fmtDate(x.date))+'</b> — '+esc(status(x.status))+(x.note?' — '+esc(x.note):''))+'</article><article class="section"><h2>⚠️ Vi phạm</h2>'+items(vio,x=>'<b>'+esc(fmtDate(x.date))+'</b> — '+esc(x.type||'Ghi nhận')+(x.level?' — Mức độ: '+esc(x.level):'')+(x.note?' — '+esc(x.note):''),'negative')+'</article><article class="section"><h2>🏆 Khen thưởng</h2>'+items(rew,x=>'<b>'+esc(fmtDate(x.date))+'</b> — '+esc(x.type||'Ghi nhận')+(x.note?' — '+esc(x.note):''),'positive')+'</article><article class="section"><h2>📚 Kết quả học tập</h2><div class="list">'+subjects+'</div></article><article class="section"><h2>📈 Tiến bộ</h2>'+items(prog,x=>'<b>'+esc(fmtDate(x.date))+'</b> — '+esc(x.result||x.level||x.note||x.category||'Có ghi nhận'),'positive')+'</article><article class="section"><h2>📝 Nhận xét của giáo viên</h2>'+items(comments,x=>'<b>'+esc(fmtDate(x.date))+'</b> — '+esc(x.content||x.note||''))+'</article><article class="section"><h2>🔔 Những điều cần nhắc nhở</h2>'+(reminders.length?'<div class="list">'+reminders.slice(0,12).map(x=>'<div class="item reminder">'+esc(x)+'</div>').join('')+'</div>':'<p class="empty">Hiện chưa có nội dung cần nhắc nhở được giáo viên ghi nhận.</p>')+'</article></section>'}load().then(render).catch(e=>fail(e?.message||'Không tải được dữ liệu hồ sơ.'));</script></body></html>
