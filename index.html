function autoNormalizeResult(v){return clean(v).toLocaleLowerCase('vi').replace(/_/g,' ').replace(/-/g,' ')}
function autoParseScore(v){const m=clean(v).replace(',','.').match(/^(10(?:\.0+)?|[1-9](?:\.0+)?)$/);if(!m)return null;const n=Number(m[1]);if(!Number.isFinite(n)||n<1||n>10)return null;return Math.round(n)}
function autoDetect(row){const rawCat=fold(row?.category||'').replace(/_/g,' ');let item=clean(row?.item||'');let subject=clean(row?.subject||'');if(rawCat.includes('pham chat'))return{category:'PHAM_CHAT',item:item||subject||'Phẩm chất',key:fold(item||subject)};if(rawCat.includes('nang luc')){const nm=AUTO_ALIAS_COMP.get(fold(item||subject))||item||subject;return{category:'NANG_LUC',item:nm,key:fold(nm)}}const comp=AUTO_ALIAS_COMP.get(fold(item||subject));if(comp)return{category:'NANG_LUC',item:comp,key:fold(comp)};const qual=AUTO_ALIAS_QUALITY.get(fold(item||subject));if(qual)return{category:'PHAM_CHAT',item:qual,key:fold(qual)};return{category:'MON_HOC',item:subject||item,key:fold(subject||item)}}
function autoPick(list,used,seed){if(!Array.isArray(list)||!list.length)return '';const start=Math.abs(String(seed||'').split('').reduce((a,c)=>(a*31+c.charCodeAt(0))|0,7))%list.length;for(let i=0;i<list.length;i++){const x=list[(start+i)%list.length];if(!used.has(fold(x)))return x}return list[start]}
function autoBuildComment(studentId,stage){const rows=(D.learning?.[stage]||[]).filter(r=>r&&r.studentId===studentId);const latest=new Map();for(const r of rows){const d=autoDetect(r),result=clean(r.result);if(!d.key||!result)continue;latest.set(d.category+'|'+d.key,{...r,...d})}const used=new Set((D.comments||[]).filter(x=>x.studentId===studentId).map(x=>fold(x.content||'')));const out=[];for(const r of latest.values()){let content='';const score=autoParseScore(r.result);if(r.category==='MON_HOC'){if(score!==null){const tpl=autoPick(AUTO_SCORE_BANK[score],used,studentId+stage+r.key);content=tpl.replace('{s}',r.item)}else{const lv=AUTO_LEVELS.subject.get(autoNormalizeResult(r.result));if(lv)content=autoPick(AUTO_SUBJECT_LEVEL_BANK[lv],used,studentId+stage+r.key).replace('{s}',r.item)}}else if(r.category==='NANG_LUC'){const lv=AUTO_LEVELS.core.get(autoNormalizeResult(r.result));if(lv)content=autoPick(AUTO_COMP_BANK[lv],used,studentId+stage+r.key).replaceAll('{n}',r.item)}else if(r.category==='PHAM_CHAT'){const lv=AUTO_LEVELS.core.get(autoNormalizeResult(r.result));if(lv)content=autoPick(AUTO_QUALITY_BANK[lv],used,studentId+stage+r.key).replaceAll('{n}',r.item)}if(content){used.add(fold(content));out.push({id:uid(),studentId,stage,category:r.category,item:r.item,result:r.result,content,date:today(),source:'AUTO_TT27'})}}return out}
function autoComments(){const stage=params.stage||'GK1',sid=params.student||D.students[0]?.id||'',s=student(sid),rows=(D.learning?.[stage]||[]).filter(r=>r.studentId===sid),built=autoBuildComment(sid,stage),grouped={MON_HOC:built.filter(x=>x.category==='MON_HOC'),NANG_LUC:built.filter(x=>x.category==='NANG_LUC'),PHAM_CHAT:built.filter(x=>x.category==='PHAM_CHAT')};let links=['GK1','CK1','GK2','CK2'].map(function(x){return '<a class="btn '+(stage===x?'primary':'')+'" href="#comments?stage='+x+(sid?'&student='+encodeURIComponent(sid):'')+'">'+x+'</a>'}).join('');let options=D.students.map(function(x){return '<option value="'+x.id+'" '+(x.id===sid?'selected':'')+'>'+esc(x.name)+'</option>'}).join('');function cards(arr,empty){return arr.length?arr.map(function(x){return '<p><b>'+esc(x.item)+'</b> <span class="tag info">'+esc(x.result)+'</span><br>'+esc(x.content)+'</p>'}).join(''):empty}return head('Nhận xét tự động','Ngân hàng TT27 · chọn theo đúng điểm 1–10 hoặc mức đạt được',links)+'<div class="toolbar"><select id="autoCommentStudent" class="grow">'+options+'</select><button class="btn primary" data-action="generate-auto-comment" data-student="'+sid+'" data-stage="'+stage+'">✨ Tạo/cập nhật nhận xét</button><button class="btn" data-action="generate-auto-class-comments" data-stage="'+stage+'">✨ Tạo cho cả lớp</button><button class="btn danger" data-action="delete-auto-comments" data-student="'+sid+'" data-stage="'+stage+'">Xóa nhận xét tự động</button></div><div class="notice">Môn học dùng điểm 1–10 hoặc T/H/C; năng lực, phẩm chất dùng Tốt/Đạt/Cần cố gắng. Nhận xét tự động mới sẽ thay bộ AUTO_TT27 cũ của đúng học sinh/học kỳ và giữ nguyên nhận xét nhập tay.</div><div class="grid g3"><div class="card"><h3>📚 Môn học</h3>'+cards(grouped.MON_HOC,'<div class="empty">Chưa có dữ liệu môn học.</div>')+'</div><div class="card"><h3>🧠 Năng lực</h3>'+cards(grouped.NANG_LUC,'<div class="empty">Chưa có dữ liệu năng lực.</div>')+'</div><div class="card"><h3>❤️ Phẩm chất</h3>'+cards(grouped.PHAM_CHAT,'<div class="empty">Chưa có dữ liệu phẩm chất.</div>')+'</div></div>'}

function setupViolationForm(){
const type=$('mType'),level=$('mLevel');
if(!type||!level||type.dataset.violationFixedHandler==='1')return;
if(!$('violationMenuStyle')){
const st=document.createElement('style');st.id='violationMenuStyle';
st.textContent='.violation-fixed-level{background:#f8fafc!important;color:#334155!important;opacity:1!important;cursor:not-allowed!important}#violationOtherDialog{position:fixed;inset:0;z-index:1100;background:#0f172a99;display:flex;align-items:center;justify-content:center;padding:16px}#violationOtherDialog .vod{width:min(560px,100%);background:#fff;border-radius:14px;padding:18px;box-shadow:0 18px 50px #0003}#violationOtherDialog h2{margin:0 0 8px;font-size:20px}#violationOtherDialog p{margin:0 0 12px;color:#475569;font-size:13px}#violationOtherDialog textarea{width:100%;min-height:110px;box-sizing:border-box;padding:10px;border:1px solid #cbd5e1;border-radius:9px;font:inherit;resize:vertical}#violationOtherDialog .vod-level{display:flex;flex-wrap:wrap;gap:10px 20px;margin:12px 0 16px}#violationOtherDialog .vod-level label{display:flex;gap:6px;align-items:center;font-weight:600}#violationOtherDialog .vod-actions{display:flex;justify-content:flex-end;gap:8px}#violationOtherDialog button{border:1px solid #d7dee8;background:#fff;border-radius:9px;padding:8px 12px;font:inherit;cursor:pointer}#violationOtherDialog .primary{background:#1d4ed8;color:#fff;border-color:#1d4ed8}';
document.head.appendChild(st)}
function setLevelFixed(value){level.value=value;level.disabled=true;level.classList.add('violation-fixed-level');level.title='Mức độ tự động theo nội dung vi phạm.'}
function syncViolationLevel(){
const option=type.options[type.selectedIndex];if(!option)return;
const code=option.dataset.code||VIOLATION_CODES[type.value]||'';
if(code==='V32'){
if(type.dataset.violationCustom==='1'&&type.dataset.violationCustomLevel){setLevelFixed(type.dataset.violationCustomLevel)}
else{level.disabled=true;level.classList.add('violation-fixed-level');level.value='';level.title='V32 yêu cầu nhập nội dung và chọn mức độ trong hộp Khác.'}
return}
const fixed=option.dataset.level||VIOLATION_LEVELS[type.value]||'';
if(fixed){delete type.dataset.violationCustom;delete type.dataset.violationCustomLevel;type.dataset.violationPrevious=type.value;setLevelFixed(fixed)}
}
function showOtherDialog(){
closeViolationOtherDialog();
const previous=type.dataset.violationPrevious||type.options[0]?.value||'';
const bg=document.createElement('div');bg.id='violationOtherDialog';
const box=document.createElement('div');box.className='vod';
box.innerHTML='<h2>NỘI DUNG VI PHẠM KHÁC</h2><p>Nhập nội dung vi phạm của học sinh:</p><textarea id="violationOtherText" placeholder="Nhập nội dung vi phạm..."></textarea><div class="vod-level"><label><input type="radio" name="violationOtherLevel" value="Nhẹ"> Nhẹ</label><label><input type="radio" name="violationOtherLevel" value="Trung bình"> Trung bình</label><label><input type="radio" name="violationOtherLevel" value="Nghiêm trọng"> Nghiêm trọng</label></div><div class="vod-actions"><button type="button" id="violationOtherCancel">Hủy</button><button type="button" id="violationOtherSave" class="primary">Lưu</button></div>';
bg.appendChild(box);document.body.appendChild(bg);
$('violationOtherCancel').addEventListener('click',()=>{type.value=previous;delete type.dataset.violationCustom;delete type.dataset.violationCustomLevel;syncViolationLevel();closeViolationOtherDialog()});
$('violationOtherSave').addEventListener('click',()=>{
const text=$('violationOtherText').value.trim();
const picked=document.querySelector('input[name="violationOtherLevel"]:checked');
if(!text||!picked){toast('Vui lòng nhập nội dung vi phạm và chọn mức độ.');return}
[...type.options].filter(o=>o.dataset.customViolation==='1').forEach(o=>o.remove());
const option=new Option('V32 · Khác – GV tự ghi: '+text,text);
option.dataset.customViolation='1';option.dataset.code='V32';option.dataset.level=picked.value;
type.appendChild(option);type.value=text;
type.dataset.violationCustom='1';type.dataset.violationCustomLevel=picked.value;type.dataset.violationPrevious=text;
setLevelFixed(picked.value);closeViolationOtherDialog();
});
bg.addEventListener('click',e=>{if(e.target===bg)$('violationOtherCancel').click()});
setTimeout(()=>$('violationOtherText')?.focus(),0);
}
type.addEventListener('focus',()=>{const o=type.options[type.selectedIndex];if(o&&o.dataset.code!=='V32')type.dataset.violationPrevious=type.value});
type.addEventListener('change',()=>{
const o=type.options[type.selectedIndex];if(!o)return;
if(o.dataset.code==='V32'&&!o.dataset.customViolation){showOtherDialog();return}
syncViolationLevel();
});
level.addEventListener('change',()=>syncViolationLevel());
type.dataset.violationFixedHandler='1';
syncViolationLevel();
}
document.addEventListener('click',e=>{
const save=e.target.closest?.('[data-action="save-event"][data-kind="violation"]');if(!save)return;

},true);
function simpleForm(title,type,label){openModal(title,`<div class="form"><label>Học sinh</label><select id="mStudent">${D.students.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select><label>Ngày</label><input id="mSimpleDate" type="date" value="${today()}"><label>${esc(label)}</label><textarea id="mText"></textarea><div class="actions"><button class="btn" data-action="close">Hủy</button><button class="btn primary" data-action="save-simple" data-type="${type}">Lưu</button></div></div>`)}
function importBox(kind){openModal(kind==='students'?'Nhập học sinh':'Nhập kết quả SMAS',`<div class="form"><div class="notice">${kind==='students'?'CSV/TSV: Họ tên [tab] Ngày sinh [tab] Giới tính.':'CSV/TSV: Họ tên hoặc Student ID [tab] Môn [tab] Kết quả.'}</div><select id="mStage" ${kind==='students'?'style="display:none"':''}><option>GK1</option><option>CK1</option><option>GK2</option><option>CK2</option></select><input id="mFile" type="file" accept=".csv,.tsv,.txt"><div class="actions"><button class="btn" data-action="close">Hủy</button><button class="btn primary" data-action="do-import" data-kind="${kind}">Nhập</button></div></div>`)}
function textFile(f,cb){const r=new FileReader();r.onload=()=>cb(String(r.result||''));r.onerror=()=>toast('Không đọc được file');r.readAsText(f,'utf-8')}
function importData(kind){const f=$('mFile')?.files?.[0];if(!f)return toast('Chọn file trước');const stage=$('mStage')?.value||'GK1';textFile(f,text=>{const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let n=0;for(const line of lines){const c=line.includes('\t')?line.split('\t').map(x=>x.trim()):line.split(',').map(x=>x.trim());if(!c[0])continue;if(/^họ|^student|^mã học sinh/i.test(fold(c[0])))continue;if(kind==='students'){const st=D.students.find(x=>fold(x.name)===fold(c[0]));if(st){if(c[1]&&!st.birthDate)st.birthDate=c[1];if(c[2]&&!st.gender)st.gender=c[2];n++}else if(D.students.length<50){D.students.push({id:uid(),studentCode:'HS'+String(D.students.length+1).padStart(2,'0'),name:c[0],birthDate:c[1]||'',gender:c[2]||'',status:'active',parentName:'',phone:'',address:'',note:''});n++}}else{const st=D.students.find(x=>x.id===c[0])||D.students.find(x=>fold(x.name)===fold(c[0]));if(st){const rec={id:uid(),studentId:st.id,subject:'',item:'',category:'MON_HOC',result:'',date:today(),source:f.name};if(c.length>=4){rec.category=c[1]||'MON_HOC';rec.item=c[2]||'';rec.subject=rec.item;rec.result=c[3]||''}else{rec.subject=c[1]||'';rec.item=rec.subject;rec.result=c[2]||''}D.learning[stage].push(rec);n++}}}write(D);closeModal();navigate(kind==='students'?'students':'comments',{stage});toast('Đã nhập '+n+' dòng')})}
function saveAttendance(all){const date=$('attDate').value||today();D.attendance=D.attendance.filter(r=>r.date!==date);const batch=[];if(all){D.students.forEach(s=>{const r={id:'ATT_'+date+'_'+s.id,studentId:s.id,date,status:'present',note:''};D.attendance.push(r);batch.push(r)})}else{document.querySelectorAll('[data-att]').forEach(el=>{const r={id:'ATT_'+date+'_'+el.dataset.att,studentId:el.dataset.att,date,status:el.value,note:document.querySelector(`[data-note="${CSS.escape(el.dataset.att)}"]`)?.value||''};D.attendance.push(r);batch.push(r)})}write(D);render();toast('Đã lưu điểm danh · đang đồng bộ Google Sheets...');__lhSyncNotice('DIEM_DANH',batch,'Điểm danh đã đồng bộ Google Sheets')}
function toast(t){const x=document.createElement('div');x.textContent=t;x.style.cssText='position:fixed;right:16px;bottom:16px;background:#111827;color:#fff;padding:10px 12px;border-radius:10px;z-index:200;max-width:min(460px,calc(100vw - 32px))';document.body.appendChild(x);setTimeout(()=>x.remove(),3200)}
function openModal(title,body){$('modalBg').innerHTML=`<div class="modal"><div class="head"><h1>${esc(title)}</h1><button class="mini" data-action="close">✕</button></div>${body}</div>`;$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show');$('modalBg').innerHTML=''}
function handleAction(a){const x=a.dataset.action;if(x==='close'){closeModal();return}if(x==='add-student'||x==='edit-student'){studentForm(a.dataset.student||'');return}if(x==='add-violation'){eventForm('violation',a.dataset.student||'');return}if(x==='add-reward'){eventForm('reward',a.dataset.student||'');return}if(x==='profile'){navigate('profile',{student:a.dataset.student});return}if(x==='migrate-profiles'){const r=migrateLegacyProfiles(true);render();toast(`Đã đối chiếu ${r.matched}/${D.students.length} học sinh · bổ sung ${r.changed} hồ sơ`);return}if(x==='attendance-all'){saveAttendance(true);return}if(x==='attendance-save'){saveAttendance(false);return}if(x==='add-progress'){simpleForm('Ghi tiến bộ','progress','Nội dung');return}if(x==='add-comment'){simpleForm('Thêm nhận xét','comments','Nội dung nhận xét');return}if(x==='generate-auto-comment'){const sid=a.dataset.student||$('autoCommentStudent')?.value,stage=a.dataset.stage||params.stage||'GK1';if(!sid)return toast('Chọn học sinh');D.comments=D.comments.filter(c=>!(c.studentId===sid&&c.stage===stage&&c.source==='AUTO_TT27'));const built=autoBuildComment(sid,stage);D.comments.push(...built);write(D);render();toast('Đã tạo '+built.length+' nhận xét tự động cho '+(student(sid)?.name||'học sinh')+' · '+stage);if(built.length)__lhSyncNotice('NHAN_XET',built,'Đã đồng bộ nhận xét tự động lên Google Sheets');return}if(x==='generate-auto-class-comments'){const stage=a.dataset.stage||params.stage||'GK1';let all=[];for(const st of D.students){D.comments=D.comments.filter(c=>!(c.studentId===st.id&&c.stage===stage&&c.source==='AUTO_TT27'));const built=autoBuildComment(st.id,stage);D.comments.push(...built);all.push(...built)}write(D);render();toast('Đã tạo '+all.length+' nhận xét tự động cho cả lớp · '+stage);if(all.length)__lhSyncNotice('NHAN_XET',all,'Đã đồng bộ nhận xét tự động lên Google Sheets');return}if(x==='delete-auto-comments'){const sid=a.dataset.student||params.student,stage=a.dataset.stage||params.stage||'GK1';const before=D.comments.length;D.comments=D.comments.filter(c=>!(c.studentId===sid&&c.stage===stage&&c.source==='AUTO_TT27'));write(D);render();toast('Đã xóa '+(before-D.comments.length)+' nhận xét tự động');return}if(x==='add-link'){simpleForm('Thêm link','links','Link');return}if(x==='generate-links'){generateLinks();return}if(x==='copy-link'){const url=a.dataset.url;navigator.clipboard?.writeText(url).then(()=>toast('Đã sao chép link cá nhân')).catch(()=>{const ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Đã sao chép link cá nhân')}catch{toast('Không sao chép được link')}ta.remove()});return}if(x==='import-students'){importBox('students');return}if(x==='import-learning'){importBox('learning');return}if(x==='do-import'){importData(a.dataset.kind);return}if(x==='save-student'){const name=$('mName').value.trim();if(!name)return toast('Nhập họ tên');const id=a.dataset.id;if(id){const s=student(id);if(s){s.name=name;s.studentCode=$('mCode').value.trim()||s.studentCode;s.birthDate=$('mBirth').value.trim();s.gender=$('mGender').value;s.parentName=$('mParent').value.trim();s.phone=$('mPhone').value.trim();s.address=$('mAddress').value.trim();s.status=$('mStatus').value;s.note=$('mStudentNote').value.trim()}}else D.students.push({id:uid(),studentCode:$('mCode').value.trim()||`HS${String(D.students.length+1).padStart(2,'0')}`,name,birthDate:$('mBirth').value.trim(),gender:$('mGender').value,parentName:$('mParent').value.trim(),phone:$('mPhone').value.trim(),address:$('mAddress').value.trim(),status:$('mStatus').value,note:$('mStudentNote').value.trim()});write(D);closeModal();render();toast('Đã lưu hồ sơ học sinh');return}if(x==='save-event'){if(a.dataset.saving==='1')return;a.dataset.saving='1';a.disabled=true;const isV=a.dataset.kind==='violation',rec={id:uid(),studentId:$('mStudent').value,type:$('mType').value,note:$('mNote').value.trim(),date:$('mDate')?.value||today()};if(isV)rec.level=$('mLevel')?.value||'Trung bình';const target=isV?D.violations:D.rewards;if(isV){const duplicate=target.some(v=>clean(v?.date)===clean(rec.date)&&clean(v?.studentId)===clean(rec.studentId)&&clean(v?.type)===clean(rec.type)&&clean(v?.level)===clean(rec.level)&&clean(v?.note)===clean(rec.note));if(duplicate){a.disabled=false;a.dataset.saving='0';toast('Bản ghi vi phạm này đã tồn tại, không lưu trùng.');return}}target.push(rec);write(D);closeModal();render();toast((isV?'Đã lưu vi phạm':'Đã lưu khen thưởng')+' · đang đồng bộ Google Sheets...');__lhSyncNotice(isV?'VI_PHAM':'KHEN_THUONG',[rec],isV?'Vi phạm đã đồng bộ Google Sheets':'Khen thưởng đã đồng bộ Google Sheets');return}if(x==='save-simple'){const t=$('mText').value.trim();if(!t)return toast('Nhập nội dung');const sheet=a.dataset.type==='progress'?'TIEN_BO':'NHAN_XET',rec={id:uid(),studentId:$('mStudent').value,content:t,date:$('mSimpleDate')?.value||today()};D[a.dataset.type].push(rec);write(D);closeModal();render();toast('Đã lưu · đang đồng bộ Google Sheets...');__lhSyncNotice(sheet,[rec],'Bản ghi đã đồng bộ Google Sheets');return}if(x==='copy-prompt'){navigator.clipboard?.writeText('Phân tích dữ liệu lớp 5A3 dựa trên dữ liệu hiện có; không tự tạo số liệu; nêu bằng chứng và đề xuất biện pháp giáo dục.').then(()=>toast('Đã sao chép')).catch(()=>toast('Không sao chép được'));return}if(x==='ai-preview'){const t=$('aiText').value.trim();$('aiOut').innerHTML=`<div class="notice"><b>Gợi ý:</b><br>${esc(t||'Hãy nhập yêu cầu cụ thể.')}</div>`;return}if(x==='ai-clear'){$('aiText').value='';$('aiOut').innerHTML='';return}if(x==='play'){location.href='/game/';return}if(x==='export'){const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a2=document.createElement('a');a2.href=u;a2.download='QL_LOP_HOC_5A3_2026-2027.json';a2.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}}
