const __LH_REMOTE_SYNC={students:null,at:0};
async function __lhRemoteStudents(){
  if(__LH_REMOTE_SYNC.students&&Date.now()-__LH_REMOTE_SYNC.at<60000)return __LH_REMOTE_SYNC.students;
  const u='/api/google?action=get_students&_='+Date.now();
  const r=await fetch(u,{cache:'no-store',credentials:'same-origin'});
  const d=await r.json().catch(()=>null);
  if(!r.ok||!d?.ok||!Array.isArray(d.students))throw Error(d?.error||'Không lấy được danh sách học sinh Google Sheets.');
  __LH_REMOTE_SYNC.students=d.students;__LH_REMOTE_SYNC.at=Date.now();return d.students;
}
async function __lhSyncOne(sheet,rec){
  const local=student(rec?.studentId);
  if(!local)throw Error('Không tìm thấy học sinh cục bộ để đồng bộ.');
  const rems=await __lhRemoteStudents();
  const remote=rems.find(x=>fold(x?.name)===fold(local.name));
  if(!remote?.id)throw Error('Không ghép được học sinh với Google Sheets: '+local.name);
  const record={...rec,studentId:String(remote.id),studentName:String(remote.name||local.name)};
  const qs=new URLSearchParams({action:'save_event',payload:JSON.stringify({sheet,record}),tab:sheet,sheet,record:JSON.stringify(record),_:String(Date.now())});
  const r=await fetch('/api/google?'+qs.toString(),{cache:'no-store',credentials:'same-origin'});
  const d=await r.json().catch(()=>null);
  if(!r.ok||!d?.ok||!(d.saved===true||d.stored===true||d.success===true))throw Error(d?.error||d?.message||('Google Sheets không xác nhận lưu '+sheet));
  return d;

function tokenFromStoredLink(url){

}catch{}

}

async function generateLinks(){toast('Đang tạo/đồng bộ link cá nhân...');try{const rr=await fetch('/api/google?action=get_students&_='+Date.now(),{cache:'no-store',credentials:'same-origin'});const resp=await rr.json().catch(()=>null);if(!rr.ok||!resp?.ok||!Array.isArray(resp.students))throw Error(resp?.error||'Không lấy được danh sách học sinh từ hệ thống hồ sơ.');const rem=new Map(resp.students.filter(s=>clean(s?.id)&&clean(s?.name)).map(s=>[norm(s.name),s]));let made=0,miss=[];for(const s of D.students){const rs=rem.get(norm(s.name))||resp.students.find(x=>fold(x?.name)===fold(s.name));if(!rs){miss.push(s.name);continue}const hash=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(PREFIX+clean(rs.id)));const token=[...new Uint8Array(hash)].map(b=>b.toString(16).padStart(2,'0')).join('');const url=canonicalStudentProfileUrl(token);let r=D.links.find(x=>x.studentId===s.id);if(r){r.url=url;r.date=today()}else D.links.push({id:uid(),studentId:s.id,url,date:today()});made++}write(D);render();toast(made?`Đã có ${made} link tổng hợp${miss.length?' · Chưa ghép '+miss.length+' em':''}`:'Chưa tạo được link')}catch(e){toast(e?.message||'Không tạo được link cá nhân')}}

function openModal(title,body){$('modalBg').innerHTML=`<div class="modal"><div class="head"><h1>${esc(title)}</h1><button class="mini" data-action="close">✕</button></div>${body}</div>`;$('modalBg').classList.add('show')}
function closeModal(){$('modalBg').classList.remove('show');$('modalBg').innerHTML=''}
function handleAction(a){const x=a.dataset.action;if(x==='close'){closeModal();return}if(x==='add-student'||x==='edit-student'){studentForm(a.dataset.student||'');return}if(x==='add-violation'){eventForm('violation',a.dataset.student||'');return}if(x==='add-reward'){eventForm('reward',a.dataset.student||'');return}if(x==='profile'){navigate('profile',{student:a.dataset.student});return}if(x==='migrate-profiles'){const r=migrateLegacyProfiles(true);render();toast(`Đã đối chiếu ${r.matched}/${D.students.length} học sinh · bổ sung ${r.changed} hồ sơ`);return}if(x==='attendance-all'){saveAttendance(true);return}if(x==='attendance-save'){saveAttendance(false);return}if(x==='add-progress'){simpleForm('Ghi tiến bộ','progress','Nội dung');return}if(x==='add-comment'){simpleForm('Thêm nhận xét','comments','Nội dung nhận xét');return}if(x==='add-link'){simpleForm('Thêm link','links','Link');return}if(x==='generate-links'){generateLinks();return}if(x==='copy-link'){const url=a.dataset.url;navigator.clipboard?.writeText(url).then(()=>toast('Đã sao chép link cá nhân')).catch(()=>{const ta=document.createElement('textarea');ta.value=url;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast('Đã sao chép link cá nhân')}catch{toast('Không sao chép được link')}ta.remove()});return}if(x==='import-students'){importBox('students');return}if(x==='import-learning'){importBox('learning');return}if(x==='do-import'){importData(a.dataset.kind);return}if(x==='save-student'){const name=$('mName').value.trim();if(!name)return toast('Nhập họ tên');const id=a.dataset.id;if(id){const s=student(id);if(s){s.name=name;s.studentCode=$('mCode').value.trim()||s.studentCode;s.birthDate=$('mBirth').value.trim();s.gender=$('mGender').value;s.parentName=$('mParent').value.trim();s.phone=$('mPhone').value.trim();s.address=$('mAddress').value.trim();s.status=$('mStatus').value;s.note=$('mStudentNote').value.trim()}}else D.students.push({id:uid(),studentCode:$('mCode').value.trim()||`HS${String(D.students.length+1).padStart(2,'0')}`,name,birthDate:$('mBirth').value.trim(),gender:$('mGender').value,parentName:$('mParent').value.trim(),phone:$('mPhone').value.trim(),address:$('mAddress').value.trim(),status:$('mStatus').value,note:$('mStudentNote').value.trim()});write(D);closeModal();render();toast('Đã lưu hồ sơ học sinh');return}if(x==='save-event'){if(a.dataset.saving==='1')return;a.dataset.saving='1';a.disabled=true;const isV=a.dataset.kind==='violation',rec={id:uid(),studentId:$('mStudent').value,type:$('mType').value,note:$('mNote').value.trim(),date:$('mDate')?.value||today()};if(isV)rec.level=$('mLevel')?.value||'Trung bình';const target=isV?D.violations:D.rewards;if(isV){const duplicate=target.some(v=>clean(v?.date)===clean(rec.date)&&clean(v?.studentId)===clean(rec.studentId)&&clean(v?.type)===clean(rec.type)&&clean(v?.level)===clean(rec.level)&&clean(v?.note)===clean(rec.note));if(duplicate){a.disabled=false;a.dataset.saving='0';toast('Bản ghi vi phạm này đã tồn tại, không lưu trùng.');return}}target.push(rec);write(D);closeModal();render();toast((isV?'Đã lưu vi phạm':'Đã lưu khen thưởng')+' · đang đồng bộ Google Sheets...');__lhSyncNotice(isV?'VI_PHAM':'KHEN_THUONG',[rec],isV?'Vi phạm đã đồng bộ Google Sheets':'Khen thưởng đã đồng bộ Google Sheets');return}if(x==='save-simple'){const t=$('mText').value.trim();if(!t)return toast('Nhập nội dung');const sheet=a.dataset.type==='progress'?'TIEN_BO':'NHAN_XET',rec={id:uid(),studentId:$('mStudent').value,content:t,date:$('mSimpleDate')?.value||today()};D[a.dataset.type].push(rec);write(D);closeModal();render();toast('Đã lưu · đang đồng bộ Google Sheets...');__lhSyncNotice(sheet,[rec],'Bản ghi đã đồng bộ Google Sheets');return}if(x==='copy-prompt'){navigator.clipboard?.writeText('Phân tích dữ liệu lớp 5A3 dựa trên dữ liệu hiện có; không tự tạo số liệu; nêu bằng chứng và đề xuất biện pháp giáo dục.').then(()=>toast('Đã sao chép')).catch(()=>toast('Không sao chép được'));return}if(x==='ai-preview'){const t=$('aiText').value.trim();$('aiOut').innerHTML=`<div class="notice"><b>Gợi ý:</b><br>${esc(t||'Hãy nhập yêu cầu cụ thể.')}</div>`;return}if(x==='ai-clear'){$('aiText').value='';$('aiOut').innerHTML='';return}if(x==='play'){location.href='/game/';return}if(x==='export'){const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a2=document.createElement('a');a2.href=u;a2.download='QL_LOP_HOC_5A3_2026-2027.json';a2.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}}
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]');if(a){e.preventDefault();handleAction(a)}});
document.addEventListener('input',e=>{if(e.target.id==='studentFilter')fillStudents();if(e.target.id==='profileFilter'||e.target.id==='profileGender')fillProfiles();if(e.target.id==='globalSearch'){const q=e.target.value;if(route==='students'&&$('studentFilter')){$('studentFilter').value=q;fillStudents()}if(route==='profiles'&&$('profileFilter')){$('profileFilter').value=q;fillProfiles()}}});
document.addEventListener('change',e=>{if(e.target.id==='attDate')fillAttendance();if(e.target.id==='profileGender')fillProfiles()});
window.addEventListener('hashchange',()=>{parseHash();render();closeMobile()});
$('hamb').addEventListener('click',()=>{$('sidebar').classList.toggle('open');$('overlay').classList.toggle('show')});
$('overlay').addEventListener('click',closeMobile);
parseHash();render();
})();
</script>
