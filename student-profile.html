<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Hồ sơ học sinh | Thầy Lê Hoàng</title><style>:root{--p:#2563eb;--s:#16a34a;--w:#d97706;--d:#dc2626;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--bg:#f8fafc}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#eff6ff,#f8fafc 50%,#ecfdf5);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink)}.wrap{max-width:1100px;margin:auto;padding:18px}.top{font-weight:800;margin-bottom:16px}.top small{display:block;color:var(--muted);font-weight:500;margin-top:4px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 28px rgba(15,23,42,.07);padding:18px;margin-bottom:14px}.loading{text-align:center;color:var(--muted);padding:46px}.error{text-align:center}.hero{display:flex;align-items:center;gap:15px}.avatar{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;background:var(--p);color:#fff;font-weight:900;font-size:21px}.eyebrow{font-size:12px;font-weight:800;color:var(--p);text-transform:uppercase}.hero h1{margin:5px 0;font-size:27px}.hero p{margin:0;color:var(--muted)}.stats{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.stat{background:var(--bg);border:1px solid var(--line);border-radius:11px;padding:12px;text-align:center}.stat b{display:block;font-size:21px}.stat span{font-size:12px;color:var(--muted)}.sections{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.section h2{font-size:16px;margin:0 0 9px}.list{display:grid;gap:7px}.item{padding:9px 10px;border-radius:9px;background:var(--bg);border-left:3px solid var(--p);line-height:1.45}.positive{border-left-color:var(--s);background:#f0fdf4}.negative{border-left-color:var(--d);background:#fef2f2}.reminder{border-left-color:var(--w);background:#fffbeb}.empty{color:var(--muted);margin:0}.note{font-size:12px;color:var(--muted);margin-top:12px}@media(max-width:800px){.wrap{padding:12px}.stats{grid-template-columns:repeat(3,1fr)}.sections{grid-template-columns:1fr}.hero h1{font-size:22px}}</style></head><body><main class="wrap"><div class="top">📚 QUẢN LÝ LỚP HỌC THẦY LÊ HOÀNG<small>Năm học 2026–2027 · Lớp 5A3</small></div><section id="loading" class="card loading">Đang kết nối dữ liệu lớp học…</section><section id="error" class="card error" hidden></section><div id="profile" hidden></div><p class="note">Trang chỉ hiển thị thông tin được phép chia sẻ với học sinh/phụ huynh; không hiển thị số điện thoại, địa chỉ hoặc dữ liệu gia đình.</p></main><script>'use strict';const TOKEN_PREFIX='LH_STUDENT_PROFILE_V3|2026-2027|5A3|',BRIDGE='./google-api-bridge.js?v=MASTER-9.4-profile-20260829-2',esc=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'),clean=v=>String(v??'').trim().replace(/\s+/g,' '),$=id=>document.getElementById(id);function setError(msg){$('loading').hidden=true;$('error').hidden=false;$('error').innerHTML='<div style="font-size:40px">🔒</div><h2>Không mở được hồ sơ</h2><p>'+esc(msg)+'</p><p>Hãy dùng đúng link cá nhân do giáo viên cung cấp.</p>'}async function tokenForStudent(id){const raw=TOKEN_PREFIX+clean(id);if(window.crypto?.subtle){const d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw));return[...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,'0')).join('')}let h1=2166136261,h2=2166136261;for(let i=0;i<raw.length;i++){const c=raw.charCodeAt(i);h1^=c;h1=Math.imul(h1,16777619);h2^=c+i;h2=Math.imul(h2,16777619)}return(h1>>>0).toString(16).padStart(8,'0')+(h2>>>0).toString(16).padStart(8,'0')+clean(id).length.toString(16).padStart(4,'0')}function loadBridge(){return new Promise((resolve,reject)=>{if(typeof window.loadGoogleSheetsMenuData==='function')return resolve();const s=document.createElement('script');let done=false,t=setTimeout(()=>{if(done)return;done=true;s.remove();reject(new Error('Không tải được cầu nối dữ liệu Google.'))},15000);s.src=BRIDGE;s.async=false;s.onload=()=>{if(done)return;done=true;clearTimeout(t);resolve()};s.onerror=()=>{if(done)return;done=true;clearTimeout(t);s.remove();reject(new Error('Không tải được cầu nối dữ liệu Google.'))};document.head.appendChild(s)})}function waitForData(){if(window.GOOGLE_SHEET_DATA?.ok)return Promise.resolve(window.GOOGLE_SHEET_DATA);return new Promise((resolve,reject)=>{let done=false,timer;const cleanup=()=>{clearTimeout(timer);window.removeEventListener('google-sheets-data-ready',on)};const finish=(fn,v)=>{if(done)return;done=true;cleanup();fn(v)};const on=e=>{if(e.detail?.ok)finish(resolve,e.detail)};window.addEventListener('google-sheets-data-ready',on);timer=setTimeout(()=>finish(reject,new Error('Không tải được dữ liệu lớp từ hệ thống.')),30000);if(typeof window.loadGoogleSheetsMenuData==='function'){Promise.resolve(window.loadGoogleSheetsMenuData()).then(d=>{if(d?.ok)finish(resolve,d)}).catch(()=>{})}})}function fmtDate(v){const s=clean(v),m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);return m?m[3]+'/'+m[2]+'/'+m[1]:s}function status(v){const x=clean(v).toLocaleLowerCase('vi');if(['present','co mat','có mặt','đi học'].includes(x))return'Có mặt';if(['excused','co phep','có phép'].includes(x))return'Có phép';if(['absent','vang','vắng','không phép'].includes(x))return'Không phép';return clean(v)}function items(a,fn,cls=''){if(!a.length)return'<p class="empty">Chưa có dữ liệu.</p>';return'<div class="list">'+a.slice().sort((x,y)=>String(y.date||'').localeCompare(String(x.date||''))).slice(0,8).map(x=>'<div class="item '+cls+'">'+fn(x)+'</div>').join('')+'</div>'}function render(data,student){const sid=clean(student.id),att=(data.DIEM_DANH||[]).filter(x=>clean(x?.studentId)===sid),vio=(data.VI_PHAM||[]).filter(x=>clean(x?.studentId)===sid),rew=(data.KHEN_THUONG||[]).filter(x=>clean(x?.studentId)===sid),learn=(data.HOC_TAP||[]).filter(x=>clean(x?.studentId)===sid),prog=(data.TIEN_BO||[]).filter(x=>clean(x?.studentId)===sid),comments=(data.NHAN_XET||[]).filter(x=>clean(x?.studentId)===sid&&x?.visibleToStudent!==false),present=att.filter(x=>['present','co mat','có mặt','đi học'].includes(clean(x?.status).toLocaleLowerCase('vi'))).length,excused=att.filter(x=>['excused','co phep','có phép'].includes(clean(x?.status).toLocaleLowerCase('vi'))).length,absent=att.filter(x=>['absent','vang','vắng','không phép'].includes(clean(x?.status).toLocaleLowerCase('vi'))).length,reminders=[...new Set(vio.filter(x=>clean(x?.status).toLocaleLowerCase('vi')!=='resolved').map(x=>clean(x?.action)||clean(x?.note)).filter(Boolean))],groups={};learn.forEach(x=>{const subject=clean(x?.subject)||'Khác';(groups[subject]??=[]).push(x)});const subjectHtml=Object.entries(groups).map(([subject,a])=>{const r=a.slice().sort((x,y)=>String(y.date||'').localeCompare(String(x.date||'')))[0];return'<div class="item"><b>'+esc(subject)+'</b><br>'+esc(clean(r?.result)||clean(r?.level)||clean(r?.note)||'Đã có ghi nhận')+'</div>'}).join('')||'<p class="empty">Chưa có dữ liệu.</p>',initials=clean(student.name).split(/\s+/).slice(-2).map(x=>x[0]).join('').toUpperCase();$('loading').hidden=true;$('profile').hidden=false;$('profile').innerHTML='<section class="card"><div class="hero"><div class="avatar">'+esc(initials||'HS')+'</div><div><span class="eyebrow">HỒ SƠ HỌC SINH</span><h1>'+esc(student.name)+'</h1><p>'+esc(student.gender||'')+(student.birthDate?' · '+esc(fmtDate(student.birthDate)):'')+'</p></div></div></section><section class="card"><div class="stats"><div class="stat"><b>'+att.length+'</b><span>Lần điểm danh</span></div><div class="stat"><b>'+present+'</b><span>Có mặt</span></div><div class="stat"><b>'+excused+'</b><span>Có phép</span></div><div class="stat"><b>'+absent+'</b><span>Không phép</span></div><div class="stat"><b>'+vio.length+'</b><span>Vi phạm</span></div><div class="stat"><b>'+rew.length+'</b><span>Khen thưởng</span></div></div></section><section class="sections"><article class="section"><h2>📅 Chuyên cần</h2>'+items(att,x=>'<b>'+esc(fmtDate(x.date))+'</b> — '+esc(status(x.status))+(x.note?' — '+esc(x.note):''))+'</article><article class="section"><h2>⚠️ Vi phạm</h2>'+items(vio,x=>'<b>'+esc(fmtDate(x.date))+'</b> — '+esc(x.type||'Ghi nhận')+(x.note?' — '+esc(x.note):''),'negative')+'</article><article class="section"><h2>🏆 Khen thưởng</h2>'+items(rew,x=>'<b>'+esc(fmtDate(x.date))+'</b> — '+esc(x.type||'Ghi nhận')+(x.note?' — '+esc(x.note):''),'positive')+'</article><article class="section"><h2>📚 Kết quả học tập</h2><div class="list">'+subjectHtml+'</div></article><article class="section"><h2>📈 Tiến bộ</h2>'+items(prog,x=>'<b>'+esc(fmtDate(x.date))+'</b> — '+esc(x.result||x.level||x.note||x.category||'Có ghi nhận'),'positive')+'</article><article class="section"><h2>📝 Nhận xét của giáo viên</h2>'+items(comments,x=>'<b>'+esc(fmtDate(x.date))+'</b> — '+esc(x.content||''))+'</article><article class="section"><h2>🔔 Những điều cần nhắc nhở</h2>'+(reminders.length?'<div class="list">'+reminders.slice(0,8).map(x=>'<div class="item reminder">'+esc(x)+'</div>').join('')+'</div>':'<p class="empty">Hiện chưa có nội dung cần nhắc nhở được giáo viên ghi nhận.</p>')+'</article></section>'}async function main(){try{const token=clean(new URLSearchParams(location.search).get('t'));if(!token)return setError('Liên kết không có mã truy cập cá nhân.');await loadBridge();const data=await waitForData();const students=Array.isArray(data.HOC_SINH)?data.HOC_SINH:[];let student=null;for(const x of students){if(clean(x?.id)&&await tokenForStudent(x.id)===token){student=x;break}}if(!student)return setError('Mã truy cập không hợp lệ hoặc liên kết đã được thay đổi.');if(student.shareEnabled===false)return setError('Liên kết hồ sơ hiện đang được khóa.');render(data,student)}catch(e){setError(e?.message||'Không tải được dữ liệu hồ sơ.')}}main();</script></body></html>
