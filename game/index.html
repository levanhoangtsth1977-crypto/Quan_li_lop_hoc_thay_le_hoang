<!DOCTYPE html><html lang="vi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>Triệu Phú Học Đường — Thầy Lê Hoàng</title><link rel="stylesheet" href="game.css?v=7.0.0"></head><body><main class="app"><header class="hero"><a class="back" href="../index.html">← Quản lý lớp học</a><h1>🎮 TRIỆU PHÚ HỌC ĐƯỜNG</h1><p>Ôn luyện lớp 5 • Toán • Tiếng Việt • Khoa học • Lịch sử &amp; Địa lí</p><div id="audioControls" style="display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;margin-top:12px"><button id="audioToggle" type="button" aria-pressed="true">🔊 Âm thanh: BẬT</button><label style="display:inline-flex;align-items:center;gap:6px;background:#ffffff22;padding:7px 10px;border-radius:10px;color:#fff">Âm lượng <input id="audioVolume" type="range" min="0" max="100" value="92" style="width:110px"></label></div><div id="questionBankStatus" data-state="loading" style="margin:10px auto 0;max-width:620px;padding:7px 12px;border-radius:999px;background:#ffffff18;color:#fff;font-size:13px;text-align:center">☁️ Đang kết nối ngân hàng câu hỏi…</div></header><section class="panel" id="home"><h2>🏠 Trang chủ Game</h2><div class="grid"><button data-action="start" type="button">🎯 Bắt đầu chơi</button><button data-action="leaderboard" type="button">🏆 Bảng xếp hạng</button><button data-action="results" type="button">📈 Kết quả học tập</button><button data-action="bank" type="button">🗂️ Ngân hàng câu hỏi</button><button data-action="admin" type="button">⚙️ Quản trị giáo viên</button></div><div class="config"><label>Chế độ<select id="gameMode"><option value="bySubject">📚 Theo môn &amp; chương</option><option value="mixed">🌐 Câu hỏi tổng hợp 4 môn</option></select></label><label>Môn<select id="subject"><option value="math">➗ Toán</option><option value="vietnamese">📖 Tiếng Việt</option><option value="science">🔬 Khoa học</option><option value="history">🌏 Lịch sử &amp; Địa lí</option></select></label><label>Chương<select id="chapter" disabled><option value="">⏳ Đang tải chương...</option></select></label><label>Học sinh<select id="student"></select></label><button type="button" id="nextPlayerButton" style="margin-top:24px">🎲 NGƯỜI CHƠI TIẾP THEO</button><label>Mức độ<select id="level"><option value="ALL">🎯 Tất cả mức độ</option><option value="M1">🟢 M1 — Nhận biết</option><option value="M2">🔵 M2 — Thông hiểu</option><option value="M3">🟠 M3 — Vận dụng</option><option value="M4">🔴 M4 — Vận dụng cao</option></select></label></div><p id="nextPlayerDisplay" style="margin:12px 0 0;font-weight:700;text-align:center;min-height:24px"></p></section><section class="panel hidden" id="play"><div class="bar"><span id="counter">Câu 1/15</span><strong id="score">0 điểm</strong></div><h2 id="question">Đang tải câu hỏi…</h2><div class="answers" id="answers"></div><div class="help"><button type="button" data-help="5050">50:50</button><button type="button" data-help="poll">👥 Hỏi cả lớp</button><button type="button" data-help="change">🔄 Đổi câu</button></div><p id="explanation"></p></section><section class="panel hidden" id="result"><h2>🏆 Tổng kết</h2><div id="resultText"></div><button type="button" data-action="home">Chơi lại</button></section></main><script src="data.js?v=7.0.0"></script><script src="questions.js?v=7.0.0"></script><script src="question-bank.js?v=7.0.0"></script><script src="audio-theme.js?v=7.0.0"></script><script src="game.js?v=7.0.0"></script><script src="boot-fix.js?v=7.0.0"></script></body></html>
