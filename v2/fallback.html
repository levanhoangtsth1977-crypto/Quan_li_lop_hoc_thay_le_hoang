<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#1d4ed8"><title>QUẢN LÝ LỚP HỌC THẦY LÊ HOÀNG · V2</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f5f7fb;color:#172033}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.side{width:285px;background:#fff;border-right:1px solid #e2e7ef;padding:16px;position:fixed;inset:0 auto 0 0;overflow:auto}.brand{display:flex;gap:10px;align-items:center;padding:8px 4px 16px;border-bottom:1px solid #edf0f4}.logo{width:44px;height:44px;border-radius:12px;background:#1d4ed8;color:#fff;display:grid;place-items:center;font-weight:800}.brand b,.brand small{display:block}.brand small{color:#64748b;margin-top:3px}.ctx{background:#f8fafc;border:1px solid #e5eaf1;border-radius:12px;padding:12px;margin:14px 0}.ctx label{display:block;font-size:11px;color:#64748b;margin:6px 0}.ctx select{width:100%;padding:9px;border:1px solid #d7dee8;border-radius:9px;background:#fff}.menu{display:grid;gap:4px}.menu button{border:0;background:#fff;border-radius:10px;padding:11px 12px;text-align:left;color:#334155;display:flex;align-items:center;gap:10px}.menu button b{margin-left:auto;font-size:11px}.menu button.active{background:#eaf1ff;color:#1d4ed8;font-weight:700}.teacher{margin-top:16px;border:1px solid #e8edf3;border-radius:12px;padding:11px;display:flex;gap:10px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#0f172a;color:#fff;font-weight:700}.main{margin-left:285px;flex:1}.top{height:68px;background:#fff;border-bottom:1px solid #e6ebf1;display:flex;justify-content:space-between;align-items:center;padding:0 22px;position:sticky;top:0;z-index:5}.crumb{font-size:13px;color:#64748b}.crumb strong{color:#111827}.search{width:320px;padding:9px 11px;border:1px solid #dbe2ec;border-radius:10px}.search input{border:0;outline:0;width:100%;background:transparent}.content{padding:22px}.hero{background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;border-radius:18px;padding:25px;display:flex;justify-content:space-between}.hero h1{margin:8px 0;font-size:28px}.hero p{opacity:.9}.grid{display:grid;gap:14px}.grid4{grid-template-columns:repeat(4,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.card{background:#fff;border:1px solid #e5eaf1;border-radius:14px;padding:16px}.quick{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:15px;text-align:left}.quick strong,.quick small{display:block}.quick small{color:#64748b;margin-top:4px}.stat .n{font-size:30px;font-weight:800}.muted{color:#64748b}.head{display:flex;justify-content:space-between;align-items:center;margin:20px 0 12px}.btn{border:0;border-radius:9px;padding:9px 12px;font-weight:650}.primary{background:#1d4ed8;color:#fff}.secondary{background:#fff;border:1px solid #d7dee8;color:#334155}.danger{background:#fee2e2;color:#991b1b}.tablewrap{overflow:auto;background:#fff;border:1px solid #e5eaf1;border-radius:12px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:10px;border-bottom:1px solid #edf1f5;text-align:left}.table th{background:#f8fafc;color:#475569}.formrow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.formrow input,.formrow select,.formrow textarea{padding:9px 10px;border:1px solid #d7dee8;border-radius:9px;background:#fff}.tag{display:inline-block;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:700}.good{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.notice{background:#eff6ff;color:#1e40af;border-radius:10px;padding:11px}.mobile{display:none}@media(max-width:900px){.side{position:fixed;z-index:20;transform:translateX(-100%);transition:.2s}.side.open{transform:translateX(0)}.main{margin-left:0}.mobile{display:block}.top{padding-left:62px}.search{width:180px}.grid4,.grid3{grid-template-columns:1fr 1fr}}@media(max-width:560px){.grid4,.grid3{grid-template-columns:1fr}.top{gap:8px}.crumb{font-size:12px}.search{width:130px}.hero h1{font-size:22px}}
</style></head><body><div class="app"><aside class="side" id="side"><div class="brand"><div class="logo">LH</div><div><b>QUẢN LÝ LỚP HỌC</b><small>THẦY LÊ HOÀNG · V2</small></div></div><div class="ctx"><label>Năm học</label><select><option>2026–2027</option></select><label>Lớp</label><select><option>5A3</option></select></div><nav class="menu" id="menu"></nav><div class="teacher"><div class="avatar">LH</div><div><b>Lê Hoàng</b><small class="muted">Giáo viên chủ nhiệm</small></div></div></aside><main class="main"><header class="top"><button class="btn primary mobile" id="hamb">☰</button><div class="crumb">Quản lý lớp học › <strong id="title">Trang chủ</strong></div><div class="search"><input id="search" placeholder="Tìm học sinh..."></div></header><section class="content" id="content"></section></main></div><script>
const KEY='LH_V2_2026_2027';
const names=[['Nguyễn Bảo An','01/02/2016'],['Phạm Nguyễn Thiên Anh','22/01/2016'],['Nguyễn Ngọc Bích','13/9/2016'],['Lương Bảo Châu','31/01/2016'],['Trần Thị Ngọc Diệp','11/02/2016'],['Võ Thị Huyền Diệu','01/9/2016'],['Phạm Minh Đức','23/8/2016'],['Huỳnh Đặng Quốc Hoàng','19/11/2016'],['Nguyễn Gia Hưng','07/12/2016'],['Tạ Trí Khang','20/8/2016'],['Nguyễn Văn Đăng Khoa','28/3/2016'],['Phạm Đăng Khôi','29/9/2016'],['Ngô Sinh Khởi','01/10/2016'],['Phạm Anh Kiệt','17/7/2016'],['Trần Anh Kiệt','08/3/2016'],['Nguyễn Quỳnh Lam','18/01/2016'],['Trịnh Gia Linh','06/8/2016'],['Phạm Tấn Mạnh','30/5/2016'],['Bùi Nguyễn Hà My','24/01/2016'],['Lương Đỗ Thảo My','19/6/2016'],['Huỳnh Hữu Nam','13/11/2016'],['Bùi Huỳnh Khánh Ngọc','15/4/2016'],['Nguyễn Bùi Bảo Ngọc','07/7/2016'],['Nguyễn Thị Bảo Ngọc','09/01/2016'],['Trịnh Phước Nguyên','11/11/2016'],['Ngô Thiện Nhân','12/10/2016'],['Phạm Lê An Nhiên','21/12/2016'],['Lê Văn Phát','15/02/2016'],['Bùi Văn Phong','04/4/2016'],['Đinh Nguyễn Anh Phong','18/01/2016'],['Nguyễn Văn Phước','02/12/2016'],['Phạm Anh Quân','17/7/2016'],['Đoàn Văn Quý','10/6/2016'],['Lê Hữu Phú Quý','10/9/2016'],['Huỳnh Lê Nhã Quyên','29/10/2016'],['Lê Bá Thụ','14/12/2016'],['Huỳnh Bảo Trâm','10/8/2016'],['Nguyễn Đăng Trường','23/02/2016'],['Võ Tấn Trường','14/12/2016'],['Huỳnh Gia Tuệ','12/3/2016'],['Võ Thanh Vỹ','22/10/2016'],['Huỳnh Ngọc Bảo Yến','30/11/2016']];
const menu=[['home','🏠','Trang chủ'],['students','👥','Học sinh'],['profiles','🪪','Hồ sơ học sinh'],['attendance','📅','Điểm danh'],['violations','⚠️','Vi phạm'],['rewards','🏆','Khen thưởng'],['learning','📚','Học tập'],['progress','📈','Tiến bộ'],['comments','💬','Nhận xét'],['links','🔗','Link học sinh'],['millionaire','💰','Triệu Phú Học Đường'],['ai','🤖','AI giáo viên'],['settings','⚙️','Cấu hình']];
function id(){return 'ID_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
function data(){let d;try{d=JSON.parse(localStorage.getItem(KEY)||'null')}catch{};if(!d||!Array.isArray(d.students)){d={students:names.map((x,i)=>({id:id(),name:x[0],birthDate:x[1],status:'active'})),attendance:[],violations:[],rewards:[],progress:[],comments:[],links:{},learning:{}};save(d)}for(const k of ['attendance','violations','rewards','progress','comments'])if(!Array.isArray(d[k]))d[k]=[];if(!d.links)d.links={};return d}
function save(d){localStorage.setItem(KEY,JSON.stringify(d))}
let D=data(),R='home';
const $=id=>document.getElementById(id); const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function student(id){return D.students.find(s=>s.id===id)}
function renderMenu(){ $('menu').innerHTML=menu.map(m=>`<button data-r="${m[0]}" class="${m[0]===R?'active':''}"><span>${m[1]}</span><span>${m[2]}</span>${m[0]==='violations'?`<b>${D.violations.length}</b>`:''}${m[0]==='rewards'?`<b>${D.rewards.length}</b>`:''}</button>`).join('')}
function pageHead(t,s,a=''){return `<div class="head"><div><h2 style="margin:0">${esc(t)}</h2><div class="muted">${esc(s)}</div></div>${a}</div>`}
function renderHome(){return `<div class="hero"><div><div>👋 Chào mừng trở lại</div><h1>QUẢN LÝ LỚP HỌC<br>THẦY LÊ HOÀNG</h1><p>Trường Tiểu học Nghĩa Hành · Lớp 5A3 · Năm học 2026–2027</p></div><div style="font-size:76px;opacity:.18">🏫</div></div>${pageHead('Thao tác nhanh','Các thao tác đều dùng chung dữ liệu lớp.')}<div class="grid grid4"><button class="quick" data-act="addStudent"><strong>➕ Thêm học sinh</strong><small>Mở hồ sơ học sinh</small></button><button class="quick" data-r="attendance"><strong>📅 Điểm danh</strong><small>Ghi nhận hôm nay</small></button><button class="quick" data-act="addViolation"><strong>⚠️ Ghi vi phạm</strong><small>Chọn học sinh và nội dung</small></button><button class="quick" data-act="addReward"><strong>🏆 Khen thưởng</strong><small>Chọn học sinh và nội dung</small></button></div>${pageHead('Tổng quan lớp học','Dữ liệu hiện tại của lớp 5A3')}<div class="grid grid4"><div class="card stat"><div class="n">${D.students.length}</div><div class="muted">Học sinh</div></div><div class="card stat"><div class="n">${D.attendance.filter(x=>x.date===today()).filter(x=>x.status==='present').length}</div><div class="muted">Có mặt hôm nay</div></div><div class="card stat"><div class="n">${D.violations.length}</div><div class="muted">Lượt vi phạm</div></div><div class="card stat"><div class="n">${D.rewards.length}</div><div class="muted">Lượt khen thưởng</div></div></div>`}
function today(){return new Date().toISOString().slice(0,10)}
function renderStudents(){const q=($('search').value||'').toLowerCase();const rows=D.students.filter(s=>!q||s.name.toLowerCase().includes(q));return pageHead('Học sinh','Danh sách lớp 5A3',`<button class="btn primary" data-act="addStudent">+ Thêm học sinh</button>`)+`<div class="tablewrap"><table class="table"><thead><tr><th>STT</th><th>Họ tên</th><th>Ngày sinh</th><th>Trạng thái</th><th></th></tr></thead><tbody>${rows.map((s,i)=>`<tr><td>${i+1}</td><td><b>${esc(s.name)}</b><div class="muted">${esc(s.id)}</div></td><td>${esc(s.birthDate||'')}</td><td><span class="tag good">Đang học</span></td><td><button class="btn secondary" data-prof="${s.id}">Hồ sơ</button></td></tr>`).join('')}</tbody></table></div>`}
function counts(s){return {a:D.attendance.filter(x=>x.studentId===s.id),v:D.violations.filter(x=>x.studentId===s.id),r:D.rewards.filter(x=>x.studentId===s.id),p:D.progress.filter(x=>x.studentId===s.id),c:D.comments.filter(x=>x.studentId===s.id)}}
function renderProfiles(){const q=($('search').value||'').toLowerCase();const rows=D.students.filter(s=>!q||s.name.toLowerCase().includes(q));return pageHead('Hồ sơ học sinh','Mở trang tổng hợp theo từng học sinh')+`<div class="grid grid3">${rows.map(s=>{const c=counts(s);return `<div class="card"><h3 style="margin-top:0">${esc(s.name)}</h3><div class="muted">${esc(s.birthDate||'')}</div><p>Điểm danh: ${c.a.length} · Vi phạm: ${c.v.length} · Khen: ${c.r.length} · Tiến bộ: ${c.p.length}</p><button class="btn primary" data-prof="${s.id}">Mở trang tổng hợp</button></div>`}).join('')}</div>`}
function renderProfile(sid){const s=student(sid);if(!s)return renderProfiles();const c=counts(s);return pageHead(s.name,'TRANG TỔNG HỢP · một học sinh - mọi dữ liệu')+`<div class="grid grid4"><div class="card"><b>${c.a.filter(x=>x.status==='present').length}</b><div class="muted">Có mặt</div></div><div class="card"><b>${c.a.filter(x=>x.status==='excused').length}</b><div class="muted">Có phép</div></div><div class="card"><b>${c.v.length}</b><div class="muted">Vi phạm</div></div><div class="card"><b>${c.r.length}</b><div class="muted">Khen thưởng</div></div></div><div class="card" style="margin-top:14px"><div class="notice">Học tập SMAS: khu vực tổng hợp chờ dữ liệu các kỳ GK1, CK1, GK2, CK2.</div><p>${c.c.length?c.c.map(x=>esc(x.content)).join('<br>'):'Chưa có nhận xét.'}</p></div>`}
function renderAttendance(){return pageHead('Điểm danh','Một bản ghi cho từng học sinh/ngày',`<button class="btn primary" data-act="saveAtt">Lưu</button>`)+`<div class="formrow"><input id="attDate" type="date" value="${today()}"></div><div class="tablewrap"><table class="table"><thead><tr><th>STT</th><th>Học sinh</th><th>Trạng thái</th><th>Ghi chú</th></tr></thead><tbody>${D.students.map((s,i)=>{const r=D.attendance.find(x=>x.studentId===s.id&&x.date===today())||{};return `<tr data-att="${s.id}"><td>${i+1}</td><td>${esc(s.name)}</td><td><select class="att"><option value="present" ${(r.status||'present')==='present'?'selected':''}>Có mặt</option><option value="excused" ${r.status==='excused'?'selected':''}>Có phép</option><option value="absent" ${r.status==='absent'?'selected':''}>Không phép</option></select></td><td><input class="attnote" value="${esc(r.note||'')}"></td></tr>`}).join('')}</tbody></table></div>`}
function renderRecords(kind){const isV=kind==='violations';const rows=D[kind];return pageHead(isV?'Vi phạm':'Khen thưởng',isV?'Ghi nhận hành vi cần theo dõi':'Ghi nhận việc làm tốt',`<button class="btn primary" data-act="${isV?'addViolation':'addReward'}">+ Ghi nhận</button>`)+`<div class="tablewrap"><table class="table"><thead><tr><th>Ngày</th><th>Học sinh</th><th>Nội dung</th><th></th></tr></thead><tbody>${rows.slice().reverse().map(r=>`<tr><td>${esc(r.date)}</td><td>${esc(student(r.studentId)?.name||'')}</td><td>${esc(r.type)}</td><td><button class="btn danger" data-del="${kind}|${r.id}">Xóa</button></td></tr>`).join('')||`<tr><td colspan="4" class="muted">Chưa có dữ liệu.</td></tr>`}</tbody></table></div>`}
function renderSimple(kind,title,desc,act,label){return pageHead(title,desc,`<button class="btn primary" data-act="${act}">+ Thêm</button>`)+`<div class="tablewrap"><table class="table"><thead><tr><th>Ngày</th><th>Học sinh</th><th>Nội dung</th></tr></thead><tbody>${D[kind].slice().reverse().map(r=>`<tr><td>${esc(r.date||'')}</td><td>${esc(student(r.studentId)?.name||'')}</td><td>${esc(r.note||r.content||'')}</td></tr>`).join('')||`<tr><td colspan="3" class="muted">Chưa có dữ liệu.</td></tr>`}</tbody></table></div>`}
function renderLearning(){return pageHead('Học tập','Bốn kỳ dữ liệu SMAS',`<button class="btn secondary" data-act="learningFile">Chọn tệp</button>`)+`<div class="notice">GK1 · CK1 · GK2 · CK2 / Cuối năm. Bản này giữ riêng giao diện V2 để menu hoạt động ổn định.</div><div class="grid grid4" style="margin-top:14px">${['GK1','CK1','GK2','CK2'].map(x=>`<div class="card"><h3>${x}</h3><div class="muted">${D.learning[x]?.file||'Chưa nhập'}</div></div>`).join('')}</div>`}
function renderLinks(){return pageHead('Link học sinh','Mỗi học sinh một token ổn định',`<button class="btn primary" data-act="genLinks">Tạo link còn thiếu</button>`)+`<div class="tablewrap"><table class="table"><thead><tr><th>Học sinh</th><th>Link</th><th></th></tr></thead><tbody>${D.students.map(s=>{const l=D.links[s.id];return `<tr><td>${esc(s.name)}</td><td>${l?esc(location.href.replace('fallback.html','index.html')+'#student='+l):'—'}</td><td>${l?`<button class="btn secondary" data-copy="${esc(location.href+'#student='+l)}">Copy</button>`:''}</td></tr>`}).join('')}</tbody></table></div>`}
function render(){renderMenu();$('title').textContent=menu.find(x=>x[0]===R)?.[2]||'Trang';const sid=window._sid;let html=R==='home'?renderHome():R==='students'?renderStudents():R==='profiles'?(sid?renderProfile(sid):renderProfiles()):R==='attendance'?renderAttendance():R==='violations'?renderRecords('violations'):R==='rewards'?renderRecords('rewards'):R==='learning'?renderLearning():R==='progress'?renderSimple('progress','Tiến bộ','Ghi nhận quá trình thay đổi','addProgress'):R==='comments'?renderSimple('comments','Nhận xét','Nhận xét theo học sinh','addComment'):R==='links'?renderLinks():R==='millionaire'?pageHead('Triệu Phú Học Đường','Module trò chơi độc lập')+`<div class="card"><h2>💰 Triệu Phú Học Đường</h2><p>Module độc lập với hệ thống quản lý lớp.</p><button class="btn primary" data-act="millionaire">Mở trò chơi</button></div>`:R==='ai'?pageHead('AI giáo viên','Khu vực AI riêng')+`<div class="card"><h2>🤖 AI giáo viên</h2><p>Chưa gửi dữ liệu học sinh tự động.</p></div>`:pageHead('Cấu hình','Sao lưu và kiểm tra dữ liệu')+`<div class="grid grid3"><div class="card"><b>Trường</b><p>Trường Tiểu học Nghĩa Hành</p><b>Lớp</b><p>5A3</p></div><div class="card"><button class="btn secondary" data-act="export">Xuất JSON</button></div><div class="card"><button class="btn danger" data-act="reset">Xóa dữ liệu V2 cục bộ</button></div></div>`;$('content').innerHTML=html}
function nav(r,sid=''){R=r;window._sid=sid||'';render();$('side').classList.remove('open');window.scrollTo(0,0)}
$('menu').addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(b)nav(b.dataset.r)});$('content').addEventListener('click',e=>{const r=e.target.closest('[data-r]');if(r)nav(r.dataset.r);const p=e.target.closest('[data-prof]');if(p)nav('profiles',p.dataset.prof);const a=e.target.closest('[data-act]');if(a)act(a.dataset.act);const d=e.target.closest('[data-del]');if(d){const [k,i]=d.dataset.del.split('|');D[k]=D[k].filter(x=>x.id!==i);save(D);render()}const cp=e.target.closest('[data-copy]');if(cp){navigator.clipboard?.writeText(cp.dataset.copy);alert('Đã sao chép link.')}});$('search').addEventListener('input',()=>{if(R==='students'||R==='profiles')render()});$('hamb').onclick=()=>{ $('side').classList.toggle('open') };
function pickStudent(label){const text=prompt(label+'\n\nNhập đúng họ tên học sinh:');return D.students.find(s=>s.name===text.trim())}
function act(a){if(a==='addStudent'){const name=prompt('Họ và tên học sinh:');if(!name)return;const birth=prompt('Ngày sinh:')||'';D.students.push({id:id(),name:name.trim(),birthDate:birth.trim(),status:'active'});save(D);renderStudentsView();return}if(a==='addViolation'||a==='addReward'){const s=pickStudent('Ghi nhận cho học sinh nào?');if(!s)return;const type=prompt(a==='addViolation'?'Nội dung vi phạm:':'Nội dung khen thưởng:');if(!type)return;const k=a==='addViolation'?'violations':'rewards';D[k].push({id:id(),studentId:s.id,date:today(),type:type.trim()});save(D);render();return}if(a==='addProgress'||a==='addComment'){const s=pickStudent('Nhập họ tên học sinh:');if(!s)return;const text=prompt(a==='addProgress'?'Nội dung tiến bộ:':'Nội dung nhận xét:');if(!text)return;D[a==='addProgress'?'progress':'comments'].push({id:id(),studentId:s.id,date:today(),note:a==='addProgress'?text:undefined,content:a==='addComment'?text:undefined});save(D);render();return}if(a==='saveAtt'){document.querySelectorAll('[data-att]').forEach(tr=>{const sid=tr.dataset.att,status=tr.querySelector('.att').value,note=tr.querySelector('.attnote').value;let r=D.attendance.find(x=>x.studentId===sid&&x.date===today());if(!r){r={id:id(),studentId:sid,date:today()};D.attendance.push(r)}r.status=status;r.note=note});save(D);alert('Đã lưu điểm danh.');render();return}if(a==='genLinks'){D.students.forEach(s=>{if(!D.links[s.id])D.links[s.id]=id().replace(/_/g,'')});save(D);render();return}if(a==='export'){const blob=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});const u=URL.createObjectURL(blob),x=document.createElement('a');x.href=u;x.download='QL_Lop_Hoc_5A3_V2.json';x.click();URL.revokeObjectURL(u);return}if(a==='reset'){if(confirm('Xóa dữ liệu V2 cục bộ?')){localStorage.removeItem(KEY);D=data();nav('home')}return}if(a==='millionaire'){location.href='./millionaire.html';return}if(a==='learningFile'){const i=document.createElement('input');i.type='file';i.accept='.pdf,.xls,.xlsx,.csv';i.onchange=()=>{if(i.files[0])alert('Đã chọn: '+i.files[0].name+'. Bước phân tích SMAS nâng cao sẽ dùng module V2 chính.');};i.click();}}
function renderStudentsView(){nav('students')}
render();
</script></body></html>
