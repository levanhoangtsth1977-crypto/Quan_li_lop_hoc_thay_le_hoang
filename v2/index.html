<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f6fb;color:#172033}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh}.side{width:280px;position:fixed;inset:0 auto 0 0;background:#fff;border-right:1px solid #e2e8f0;padding:14px;overflow:auto;z-index:30}.main{margin-left:280px;min-height:100vh}.brand{display:flex;gap:10px;align-items:center;padding:8px 4px 14px;border-bottom:1px solid #edf1f5}.logo{width:44px;height:44px;border-radius:12px;background:#1d4ed8;color:#fff;display:grid;place-items:center;font-weight:800}.brand b,.brand small,.teacher b,.teacher small{display:block}.brand small,.teacher small,.muted{color:#64748b}.ctx{background:#f8fafc;border:1px solid #e5eaf1;border-radius:12px;padding:10px;margin:12px 0}.ctx label{font-size:11px;color:#64748b;display:block;margin:4px 0}.ctx select{width:100%;padding:8px;border:1px solid #d7dee8;border-radius:9px;background:#fff}.menu{display:grid;gap:3px}.menu button{width:100%;border:0;background:#fff;border-radius:10px;padding:10px;text-align:left;display:flex;gap:10px;align-items:center;color:#334155}.menu button.active,.menu button:hover{background:#eaf1ff;color:#1d4ed8;font-weight:700}.count{margin-left:auto;font-size:11px}.teacher{margin-top:14px;border:1px solid #e8edf3;border-radius:12px;padding:10px;display:flex;gap:9px}.top{height:66px;background:#fff;border-bottom:1px solid #e6ebf1;display:flex;align-items:center;gap:10px;padding:0 18px;position:sticky;top:0;z-index:20}.crumb{flex:1;font-size:13px}.search{width:280px;border:1px solid #dbe2ec;border-radius:10px;padding:8px 10px}.search input{border:0;outline:0;width:100%;background:transparent}.content{padding:20px}.hero{background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;border-radius:18px;padding:24px;display:flex;justify-content:space-between}.hero h1{font-size:28px;line-height:1.15;margin:8px 0}.page-head,.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 12px}.page-head h1,.section-title h2,.section-title h3{margin:0}.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g2{grid-template-columns:repeat(2,1fr)}.card,.quick,.stat{background:#fff;border:1px solid #e4e9f0;border-radius:13px}.card{padding:14px}.quick{text-align:left;padding:15px}.quick strong,.quick small{display:block}.quick small{color:#64748b;margin-top:4px}.stat{padding:15px}.num{font-size:28px;font-weight:800;margin-top:6px}.btn,.mini{border:1px solid #d7dee8;background:#fff;color:#334155;border-radius:9px;padding:8px 11px}.btn.primary{background:#1d4ed8;color:#fff;border-color:#1d4ed8}.btn.danger{background:#fee2e2;color:#991b1b;border-color:#fecaca}.table-wrap{overflow:auto;background:#fff;border:1px solid #e4e9f0;border-radius:12px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:9px;border-bottom:1px solid #edf1f5;text-align:left}.table th{background:#f8fafc}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select,.form input,.form select,.form textarea{padding:8px 10px;border:1px solid #d7dee8;border-radius:9px;background:#fff}.grow{flex:1;min-width:180px}.form{display:grid;gap:10px}.form textarea{min-height:90px}.tag{display:inline-block;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:700}.good{background:#dcfce7;color:#166534}.bad{background:#fee2e2;color:#991b1b}.warn{background:#fef3c7;color:#92400e}.notice{background:#eff6ff;color:#1e40af;padding:11px;border-radius:10px}.empty{text-align:center;padding:22px;color:#64748b}.modal-bg{position:fixed;inset:0;background:#0f172a88;display:none;align-items:center;justify-content:center;padding:16px;z-index:100}.modal-bg.show{display:flex}.modal{width:min(600px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:16px}.toast-wrap{position:fixed;right:16px;bottom:16px;z-index:120}.toast{margin-top:8px;background:#111827;color:#fff;padding:10px 12px;border-radius:10px}.mobile{display:none}.overlay{display:none}
@media(max-width:900px){.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.side{transform:translateX(-100%);transition:.2s;box-shadow:8px 0 24px #0002}.side.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:#0f172a66;z-index:25}.main{margin-left:0}.mobile{display:inline-block}.top{padding:0 10px}.search{width:170px}.content{padding:14px}.g4,.g3,.g2{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}.hero h1{font-size:23px}}
</style></head>
<body>
<div class="app"><aside class="side" id="side"><div class="brand"><div class="logo">LH</div><div><b>QUẢN LÝ LỚP HỌC</b><small>THẦY LÊ HOÀNG</small></div></div><div class="ctx"><label>Năm học</label><select><option>2026–2027</option></select><label>Lớp</label><select><option>5A3</option></select></div><nav class="menu" id="menu"></nav><div class="teacher"><div><b>Lê Hoàng</b><small>GVCN · Trường Tiểu học Nghĩa Hành</small></div></div></aside><div class="overlay" id="overlay"></div><main class="main"><header class="top"><button class="btn primary mobile" id="hamb">☰</button><div class="crumb">Quản lý lớp học › <b id="pageTitle">Trang chủ</b></div><div class="search"><input id="globalSearch" placeholder="Tìm học sinh..."></div></header><section class="content" id="mainContent"></section></main></div>
<div class="modal-bg" id="modalBg"></div><div class="toast-wrap" id="toastWrap"></div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);const $$=sel=>[...document.querySelectorAll(sel)];
const KEY='LH_CANONICAL_2026_2027';
const MENU=[['home','🏠','Trang chủ'],['students','👥','Học sinh'],['profiles','🪪','Hồ sơ học sinh'],['attendance','📅','Điểm danh'],['violations','⚠️','Vi phạm'],['rewards','🏆','Khen thưởng'],['learning','📚','Học tập'],['progress','📈','Tiến bộ'],['comments','💬','Nhận xét'],['links','🔗','Link học sinh'],['millionaire','💰','Triệu Phú Học Đường'],['ai','🤖','AI giáo viên'],['settings','⚙️','Cấu hình']];
const seed=['Nguyễn Bảo An','Phạm Nguyễn Thiên Anh','Nguyễn Ngọc Bích','Lương Bảo Châu','Trần Thị Ngọc Diệp','Võ Thị Huyền Diệu','Phạm Minh Đức','Huỳnh Đặng Quốc Hoàng','Nguyễn Gia Hưng','Tạ Trí Khang','Nguyễn Văn Đăng Khoa','Phạm Đăng Khôi','Ngô Sinh Khởi','Phạm Anh Kiệt','Trần Anh Kiệt','Nguyễn Quỳnh Lam','Trịnh Gia Linh','Phạm Tấn Mạnh','Bùi Nguyễn Hà My','Lương Đỗ Thảo My','Huỳnh Hữu Nam','Bùi Huỳnh Khánh Ngọc','Nguyễn Bùi Bảo Ngọc','Nguyễn Thị Bảo Ngọc','Trịnh Phước Nguyên','Ngô Thiện Nhân','Phạm Lê An Nhiên','Lê Văn Phát','Bùi Văn Phong','Đinh Nguyễn Anh Phong','Nguyễn Văn Phước','Phạm Anh Quân','Đoàn Văn Quý','Lê Hữu Phú Quý','Huỳnh Lê Nhã Quyên','Lê Bá Thụ','Huỳnh Bảo Trâm','Nguyễn Đăng Trường','Võ Tấn Trường','Huỳnh Gia Tuệ','Võ Thanh Vỹ','Huỳnh Ngọc Bảo Yến'];
const VIOLATIONS=['Không tập trung trong giờ học','Nói chuyện riêng trong giờ học','Quên đồ dùng học tập','Không hoàn thành nhiệm vụ học tập','Làm việc riêng trong giờ học','Mất trật tự trong lớp','Không thực hiện nhiệm vụ được giao','Chưa chuẩn bị bài ở nhà','Không giữ gìn vệ sinh lớp học','Xả rác không đúng nơi quy định','Tự ý rời vị trí khi chưa được phép','Sử dụng điện thoại/thiết bị không đúng quy định','Trêu chọc bạn','Tranh giành đồ dùng với bạn','Đùa nghịch gây ảnh hưởng bạn khác','Chưa chấp hành hướng dẫn của giáo viên','Đi học muộn','Thiếu đồ dùng cá nhân cần thiết','Viết/vẽ không đúng nơi quy định','Hành vi khác cần ghi rõ'];
const REWARDS=['Hoàn thành tốt nhiệm vụ học tập','Có tiến bộ rõ rệt','Chủ động giúp đỡ bạn','Tích cực phát biểu xây dựng bài','Thực hiện tốt nội quy lớp','Giữ gìn vệ sinh lớp học','Có ý thức bảo quản đồ dùng chung','Tinh thần hợp tác tốt','Tự giác hoàn thành nhiệm vụ','Có sáng kiến trong hoạt động','Tham gia tích cực hoạt động tập thể','Gương mẫu trong công việc được giao','Biết nhận lỗi và sửa lỗi','Có ý thức giữ gìn môi trường','Thực hiện tốt an toàn giao thông','Nhặt được của rơi trả người mất','Có hành động đẹp giúp đỡ người khác','Đạt kết quả nổi bật trong học tập','Tiến bộ trong rèn luyện','Thành tích/việc tốt khác'];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>`ID_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,7)}`;const today=()=>new Date().toISOString().slice(0,10);
function base(){return {version:1,school:'Trường Tiểu học Nghĩa Hành',className:'5A3',schoolYear:'2026–2027',teacher:'Lê Hoàng',students:seed.map((name,i)=>({id:uid(),name,birthDate:'',status:'active'})),attendance:[],violations:[],rewards:[],progress:[],comments:[],links:[],learning:{GK1:[],CK1:[],GK2:[],CK2:[]},millionaire:[]}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&Array.isArray(d.students))return Object.assign(base(),d)}catch(e){}const d=base();localStorage.setItem(KEY,JSON.stringify(d));return d}
let D=load(),route='home',param={};function save(){localStorage.setItem(KEY,JSON.stringify(D))}function st(id){return D.students.find(s=>s.id===id)}
function toast(t){const x=document.createElement('div');x.className='toast';x.textContent=t;$('toastWrap').appendChild(x);setTimeout(()=>x.remove(),2400)}
function go(r,p={}){route=r;param=p;render();$('side').classList.remove('open');$('overlay').classList.remove('show')}
function menu(){ $('menu').innerHTML=MENU.map(m=>`<button data-route="${m[0]}" class="${route===m[0]?'active':''}"><span>${m[1]}</span><span>${m[2]}</span>${m[0]==='violations'?`<span class="count">${D.violations.length}</span>`:''}${m[0]==='rewards'?`<span class="count">${D.rewards.length}</span>`:''}</button>`).join('') }
function head(t,s,a=''){return `<div class="page-head"><div><h1>${esc(t)}</h1><div class="muted">${esc(s)}</div></div><div class="actions">${a}</div></div>`}
function home(){return `<div class="hero"><div>👋 Chào mừng trở lại<h1>QUẢN LÝ LỚP HỌC<br>THẦY LÊ HOÀNG</h1><div>Trường Tiểu học Nghĩa Hành · Lớp 5A3 · 2026–2027</div></div><div style="font-size:70px;opacity:.18">🏫</div></div>${head('Thao tác nhanh','Một luồng sự kiện duy nhất.') }<div class="grid g4"><button class="quick" data-action="add-student"><strong>➕ Thêm học sinh</strong><small>Mở hồ sơ</small></button><button class="quick" data-route="attendance"><strong>📅 Điểm danh</strong><small>Ghi nhận hôm nay</small></button><button class="quick" data-action="add-violation"><strong>⚠️ Ghi vi phạm</strong><small>20 lựa chọn</small></button><button class="quick" data-action="add-reward"><strong>🏆 Khen thưởng</strong><small>20 lựa chọn</small></button></div>${head('Tổng quan','Dữ liệu lớp hiện tại')}<div class="grid g4"><div class="stat">Học sinh<div class="num">${D.students.length}</div></div><div class="stat">Có mặt hôm nay<div class="num">${D.attendance.filter(x=>x.date===today()&&x.status==='present').length}</div></div><div class="stat">Vi phạm<div class="num">${D.violations.length}</div></div><div class="stat">Khen thưởng<div class="num">${D.rewards.length}</div></div></div>`}
function students(){return head('Học sinh','Danh sách nguồn của toàn hệ thống',`<button class="btn secondary" data-action="import-students">Nhập danh sách</button><button class="btn primary" data-action="add-student">+ Thêm học sinh</button>`)+`<div class="toolbar"><input class="grow" id="studentFilter" placeholder="Tìm họ tên..."><select id="studentStatus"><option value="all">Tất cả</option><option value="active">Đang học</option><option value="inactive">Không còn học</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>STT</th><th>Họ tên</th><th>Ngày sinh</th><th>Trạng thái</th><th></th></tr></thead><tbody id="studentRows"></tbody></table></div>`}
function fillStudents(){const q=($('studentFilter')?.value||'').toLocaleLowerCase('vi'),s=$('studentStatus')?.value||'all';const rows=D.students.filter(x=>(s==='all'||x.status===s)&&(!q||x.name.toLocaleLowerCase('vi').includes(q)));$('studentRows').innerHTML=rows.map((x,i)=>`<tr><td>${i+1}</td><td><b>${esc(x.name)}</b><div class="muted">${esc(x.id)}</div></td><td>${esc(x.birthDate||'')}</td><td>${x.status==='active'?'<span class="tag good">Đang học</span>':'<span class="tag warn">Không còn học</span>'}</td><td><button class="mini" data-action="profile" data-student="${x.id}">Hồ sơ</button> <button class="mini" data-action="edit-student" data-student="${x.id}">Sửa</button></td></tr>`).join('')||'<tr><td colspan="5"><div class="empty">Không tìm thấy.</div></td></tr>'}
function profiles(){return head('Hồ sơ học sinh','Mở trang tổng hợp cho từng học sinh')+`<div class="toolbar"><input class="grow" id="profileFilter" placeholder="Tìm học sinh..."></div><div class="grid g3" id="profileCards"></div>`}
function fillProfiles(){const q=($('profileFilter')?.value||'').toLocaleLowerCase('vi');$('profileCards').innerHTML=D.students.filter(s=>!q||s.name.toLocaleLowerCase('vi').includes(q)).map(s=>`<div class="card"><h3 style="margin:0 0 4px">${esc(s.name)}</h3><div class="muted">${esc(s.birthDate||'')}</div><p>Điểm danh: ${D.attendance.filter(x=>x.studentId===s.id).length} · Vi phạm: ${D.violations.filter(x=>x.studentId===s.id).length} · Khen: ${D.rewards.filter(x=>x.studentId===s.id).length}</p><button class="btn primary" style="width:100%" data-action="profile" data-student="${s.id}">Mở tổng hợp</button></div>`).join('')}
function profile(id){const s=st(id);if(!s)return `<div class="empty">Không tìm thấy học sinh.</div>`;return head(s.name,'TRANG TỔNG HỢP',`<button class="btn secondary" data-route="profiles">← Hồ sơ</button><button class="btn primary" data-action="edit-student" data-student="${id}">Sửa</button>`)+`<div class="grid g2"><div class="card"><h3>Thông tin</h3><p>Ngày sinh: <b>${esc(s.birthDate||'Chưa nhập')}</b></p><p>Trạng thái: ${s.status==='active'?'<span class="tag good">Đang học</span>':'<span class="tag warn">Không còn học</span>'}</p><div class="actions">${['attendance','violations','rewards','learning','progress','comments','links'].map(r=>`<button class="mini" data-route="${r}" data-student="${id}">${MENU.find(x=>x[0]===r)[2]}</button>`).join('')}</div></div><div class="card"><h3>Học tập SMAS</h3>${['GK1','CK1','GK2','CK2'].map(k=>`<div style="padding:7px 0;border-bottom:1px solid #edf1f5"><b>${k}</b><span style="float:right">${(D.learning[k]||[]).filter(x=>x.studentId===id).length} bản ghi</span></div>`).join('')}</div></div>`}
function attendance(){return head('Điểm danh','Một bản ghi cho mỗi học sinh/ngày',`<button class="btn secondary" data-action="attendance-all">Tất cả có mặt</button><button class="btn primary" data-action="attendance-save">Lưu</button>`)+`<div class="toolbar"><label>Ngày <input type="date" id="attDate" value="${today()}"></label></div><div class="table-wrap"><table class="table"><thead><tr><th>STT</th><th>Học sinh</th><th>Trạng thái</th><th>Ghi chú</th></tr></thead><tbody id="attRows"></tbody></table></div>`}
function fillAttendance(){const date=$('attDate').value,map=new Map(D.attendance.filter(x=>x.date===date).map(x=>[x.studentId,x]));$('attRows').innerHTML=D.students.map((s,i)=>{const r=map.get(s.id)||{};return `<tr><td>${i+1}</td><td>${esc(s.name)}</td><td><select data-att="${s.id}"><option value="present" ${!r.status||r.status==='present'?'selected':''}>Có mặt</option><option value="excused" ${r.status==='excused'?'selected':''}>Có phép</option><option value="absent" ${r.status==='absent'?'selected':''}>Không phép</option></select></td><td><input data-note="${s.id}" value="${esc(r.note||'')}" placeholder="Ghi chú"></td></tr>`}).join('')}
function list(type,title){const isV=type==='violations',rows=D[type].slice().reverse();return head(title,`Tổng: ${rows.length}`,`<button class="btn primary" data-action="add-${isV?'violation':'reward'}">+ Ghi mới</button>`)+`<div class="table-wrap"><table class="table"><thead><tr><th>Ngày</th><th>Học sinh</th><th>Nội dung</th><th>Ghi chú</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(st(x.studentId)?.name||x.studentId)}</td><td><span class="tag ${isV?'bad':'good'}">${esc(x.type)}</span></td><td>${esc(x.note||'')}</td></tr>`).join('')||'<tr><td colspan="4"><div class="empty">Chưa có dữ liệu.</div></td></tr>'}</tbody></table></div>`}
function learning(){const k=param.stage||'GK1',rows=D.learning[k]||[];return head('Học tập','SMAS theo 4 đợt GK1 · CK1 · GK2 · CK2',`<button class="btn primary" data-action="import-learning">Nhập SMAS</button>`)+`<div class="actions" style="margin-bottom:12px">${['GK1','CK1','GK2','CK2'].map(x=>`<button class="btn ${x===k?'primary':''}" data-action="stage" data-stage="${x}">${x}</button>`).join('')}</div><div class="notice">Ghép dữ liệu theo Student ID; file CSV/TSV được hỗ trợ trong phiên bản này.</div><div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>Học sinh</th><th>Môn</th><th>Kết quả</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(st(x.studentId)?.name||x.studentId)}</td><td>${esc(x.subject||'')}</td><td>${esc(x.result||'')}</td></tr>`).join('')||'<tr><td colspan="3"><div class="empty">Chưa có dữ liệu.</div></td></tr>'}</tbody></table></div>`}
function simple(type,title,label,addAction){const rows=D[type].slice().reverse();return head(title,`Tổng: ${rows.length}`,`<button class="btn primary" data-action="${addAction}">+ Thêm</button>`)+`<div class="table-wrap"><table class="table"><thead><tr><th>Ngày</th><th>Học sinh</th><th>${label}</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(st(x.studentId)?.name||x.studentId)}</td><td>${esc(x.content||x.url||'')}</td></tr>`).join('')||'<tr><td colspan="3"><div class="empty">Chưa có dữ liệu.</div></td></tr>'}</tbody></table></div>`}
function progress(){return simple('progress','Tiến bộ','Nội dung','add-progress')};function comments(){return simple('comments','Nhận xét','Nhận xét','add-comment')};function links(){return simple('links','Link học sinh','Link','add-link')}
function millionaire(){return head('Triệu Phú Học Đường','Ngân hàng câu hỏi và trò chơi',`<button class="btn primary" data-action="play">Mở trò chơi</button>`)+`<div class="grid g3"><div class="card"><h3>Ngân hàng</h3><div class="num">${D.millionaire.length}</div><div class="muted">câu hỏi</div></div><div class="card"><h3>Cấu trúc</h3><div>M1/M2/M3 = 50/30/20</div><div>Điểm = 1/2/3</div><div>Thời gian = 30/45/60</div></div><div class="card"><h3>Bộ sách</h3><div>Kết nối tri thức với cuộc sống</div></div></div>`}
function ai(){return head('AI giáo viên','Khu vực hỗ trợ công việc',`<button class="btn primary" data-action="copy-prompt">Sao chép mẫu</button>`)+`<div class="card"><textarea id="aiText" style="width:100%;min-height:150px" placeholder="Nhập yêu cầu..."></textarea><div class="actions" style="margin-top:10px"><button class="btn primary" data-action="ai-preview">Xem gợi ý</button><button class="btn secondary" data-action="ai-clear">Xóa</button></div><div id="aiOut" style="margin-top:12px"></div></div>`}
function settings(){return head('Cấu hình','Thông tin lớp và dữ liệu',`<button class="btn primary" data-action="export">Xuất dữ liệu</button><button class="btn danger" data-action="reset">Đặt lại</button>`)+`<div class="grid g2"><div class="card"><h3>Thông tin</h3><p>Trường: <b>Trường Tiểu học Nghĩa Hành</b></p><p>Lớp: <b>5A3</b></p><p>Năm học: <b>2026–2027</b></p><p>GVCN: <b>Lê Hoàng</b></p></div><div class="card"><h3>Thống kê</h3><p>Học sinh: ${D.students.length}</p><p>Điểm danh: ${D.attendance.length}</p><p>Vi phạm: ${D.violations.length}</p><p>Khen thưởng: ${D.rewards.length}</p></div></div>`}
function page(){switch(route){case'home':return home();case'students':return students();case'profiles':return profiles();case'profile':return profile(param.student);case'attendance':return attendance();case'violations':return list('violations','Vi phạm');case'rewards':return list('rewards','Khen thưởng');case'learning':return learning();case'progress':return progress();case'comments':return comments();case'links':return links();case'millionaire':return millionaire();case'ai':return ai();case'settings':return settings();default:route='home';return home()}}
function render(){menu();$('pageTitle').textContent=MENU.find(x=>x[0]===route)?.[2]||'Trang chủ';$('mainContent').innerHTML=page();if(route==='students')fillStudents();if(route==='profiles')fillProfiles();if(route==='attendance')fillAttendance()}
function modal(title,body){$('modalBg').innerHTML=`<div class="modal"><div class="section-title"><h2>${esc(title)}</h2><button class="mini" data-action="close">✕</button></div>${body}</div>`;$('modalBg').classList.add('show')};function close(){ $('modalBg').classList.remove('show');$('modalBg').innerHTML=''}
function selectStudent(selected=''){return `<select id="mStudent">${D.students.map(s=>`<option value="${s.id}" ${s.id===selected?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`}
function studentForm(id=''){const s=id?st(id):null;modal(id?'Sửa học sinh':'Thêm học sinh',`<div class="form"><label>Họ tên</label><input id="mName" value="${esc(s?.name||'')}"><label>Ngày sinh</label><input id="mBirth" value="${esc(s?.birthDate||'')}"><label>Trạng thái</label><select id="mStatus"><option value="active" ${(s?.status||'active')==='active'?'selected':''}>Đang học</option><option value="inactive" ${s?.status==='inactive'?'selected':''}>Không còn học</option></select><div class="actions"><button class="btn" data-action="close">Hủy</button><button class="btn primary" data-action="save-student" data-id="${id}">Lưu</button></div></div>`)}
function eventForm(kind){const arr=kind==='violation'?VIOLATIONS:REWARDS;modal(kind==='violation'?'Ghi vi phạm':'Ghi khen thưởng',`<div class="form"><label>Học sinh</label>${selectStudent()}<label>Nội dung</label><select id="mType">${arr.map(x=>`<option>${esc(x)}</option>`).join('')}</select><label>Ghi chú</label><textarea id="mNote"></textarea><div class="actions"><button class="btn" data-action="close">Hủy</button><button class="btn primary" data-action="save-event" data-kind="${kind}">Lưu</button></div></div>`)}
function simpleForm(title,type,field){modal(title,`<div class="form"><label>Học sinh</label>${selectStudent()}<label>${field}</label><textarea id="mText"></textarea><div class="actions"><button class="btn" data-action="close">Hủy</button><button class="btn primary" data-action="save-simple" data-type="${type}">Lưu</button></div></div>`)}
function importBox(kind){modal(kind==='students'?'Nhập danh sách học sinh':'Nhập kết quả SMAS',`<div class="form"><div class="notice">${kind==='students'?'CSV/TSV: Họ tên [tab] Ngày sinh.':'CSV/TSV: Họ tên hoặc Student ID [tab] Môn [tab] Kết quả.'}</div><select id="mStage" ${kind==='students'?'style="display:none"':''}><option>GK1</option><option>CK1</option><option>GK2</option><option>CK2</option></select><input type="file" id="mFile" accept=".csv,.tsv,.txt"><div class="actions"><button class="btn" data-action="close">Hủy</button><button class="btn primary" data-action="do-import" data-kind="${kind}">Nhập</button></div></div>`)}
function textFile(file,cb){const r=new FileReader();r.onload=()=>cb(String(r.result||''));r.onerror=()=>toast('Không đọc được file');r.readAsText(file,'utf-8')}
function cells(line){return line.includes('\t')?line.split('\t').map(x=>x.trim()):line.split(',').map(x=>x.trim())}
function onClick(e){const rb=e.target.closest('[data-route]');if(rb){go(rb.dataset.route,{student:rb.dataset.student||'',stage:rb.dataset.stage||''});return}const a=e.target.closest('[data-action]');if(!a)return;const x=a.dataset.action;
if(x==='close'){close();return}if(x==='add-student'||x==='edit-student'){studentForm(a.dataset.student||a.dataset.id||'');return}if(x==='add-violation'){eventForm('violation');return}if(x==='add-reward'){eventForm('reward');return}if(x==='profile'){go('profile',{student:a.dataset.student});return}if(x==='import-students'){importBox('students');return}if(x==='import-learning'){importBox('learning');return}if(x==='stage'){go('learning',{stage:a.dataset.stage});return}if(x==='save-student'){const id=a.dataset.id,name=$('mName').value.trim();if(!name)return toast('Nhập họ tên');if(id){const s=st(id);s.name=name;s.birthDate=$('mBirth').value.trim();s.status=$('mStatus').value}else D.students.push({id:uid(),name,birthDate:$('mBirth').value.trim(),status:$('mStatus').value});save();close();render();toast('Đã lưu học sinh');return}if(x==='save-event'){const rec={id:uid(),studentId:$('mStudent').value,type:$('mType').value,note:$('mNote').value.trim(),date:today(),createdAt:new Date().toISOString()};(a.dataset.kind==='violation'?D.violations:D.rewards).push(rec);save();close();render();toast('Đã lưu');return}if(x==='save-simple'){const t=$('mText').value.trim();if(!t)return toast('Nhập nội dung');D[a.dataset.type].push({id:uid(),studentId:$('mStudent').value,content:t,date:today()});save();close();render();toast('Đã lưu');return}if(x==='attendance-all'){saveAttendance(true);return}if(x==='attendance-save'){saveAttendance(false);return}if(x==='add-progress'){simpleForm('Ghi tiến bộ','progress','Nội dung');return}if(x==='add-comment'){simpleForm('Thêm nhận xét','comments','Nhận xét');return}if(x==='add-link'){simpleForm('Thêm link','links','Link');return}if(x==='do-import'){doImport(a.dataset.kind);return}if(x==='copy-prompt'){navigator.clipboard?.writeText('Phân tích dữ liệu lớp 5A3 dựa trên dữ liệu hiện có; không tự tạo số liệu; nêu bằng chứng và đề xuất biện pháp giáo dục.').then(()=>toast('Đã sao chép')).catch(()=>toast('Không sao chép được'));return}if(x==='ai-preview'){const t=$('aiText').value.trim();$('aiOut').innerHTML=`<div class="notice"><b>Gợi ý:</b><br>${esc(t||'Hãy nhập yêu cầu cụ thể.')}</div>`;return}if(x==='ai-clear'){$('aiText').value='';$('aiOut').innerHTML='';return}if(x==='play'){toast('Khu trò chơi đã sẵn sàng.');return}if(x==='export'){const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='quan-ly-lop-5A3-2026-2027.json';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);return}if(x==='reset'){if(confirm('Đặt lại toàn bộ dữ liệu ban đầu?')){D=base();save();go('home');toast('Đã đặt lại dữ liệu')}}}
function saveAttendance(all){const date=$('attDate').value||today();D.attendance=D.attendance.filter(r=>r.date!==date);if(all){D.students.forEach(s=>D.attendance.push({id:uid(),studentId:s.id,date,status:'present',note:''}))}else{$$('[data-att]').forEach(el=>D.attendance.push({id:uid(),studentId:el.dataset.att,date,status:el.value,note:document.querySelector(`[data-note="${CSS.escape(el.dataset.att)}"]`)?.value||''}))}save();render();toast('Đã lưu điểm danh')}
function doImport(kind){const f=$('mFile')?.files?.[0];if(!f)return toast('Chọn file trước');textFile(f,text=>{const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let n=0;for(let i=0;i<lines.length;i++){const c=cells(lines[i]);if(i===0&&/họ|student|môn|mon/i.test(c.join(' ')))continue;if(kind==='students'){if(c[0]&&!D.students.some(s=>s.name.toLocaleLowerCase('vi')===c[0].toLocaleLowerCase('vi'))) {D.students.push({id:uid(),name:c[0],birthDate:c[1]||'',status:'active'});n++}}else{const q=c[0]||'',s=st(q)||D.students.find(z=>z.name.toLocaleLowerCase('vi')===q.toLocaleLowerCase('vi'));if(s){const k=$('mStage').value;D.learning[k].push({id:uid(),studentId:s.id,subject:c[1]||'',result:c[2]||'',date:today(),source:f.name});n++}}}save();close();route==='learning'?render():go(kind==='students'?'students':'learning',{stage:kind==='students'?'':$('mStage')?.value});toast(`Đã nhập ${n} bản ghi`)})}
$('hamb').addEventListener('click',()=>{$('side').classList.toggle('open');$('overlay').classList.toggle('show')});$('overlay').addEventListener('click',()=>{$('side').classList.remove('open');$('overlay').classList.remove('show')});$('modalBg').addEventListener('click',e=>{if(e.target.id==='modalBg')close()});document.addEventListener('click',onClick);document.addEventListener('input',e=>{if(e.target.id==='studentFilter')fillStudents();if(e.target.id==='profileFilter')fillProfiles();if(e.target.id==='globalSearch'){const q=e.target.value;if(route==='students'&&$('studentFilter')){$('studentFilter').value=q;fillStudents()}if(route==='profiles'&&$('profileFilter')){$('profileFilter').value=q;fillProfiles()}}});document.addEventListener('change',e=>{if(e.target.id==='attDate')fillAttendance()});render();
})();
</script></body></html>
