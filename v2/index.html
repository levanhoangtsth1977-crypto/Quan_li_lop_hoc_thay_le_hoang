<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#1d4ed8"><meta name="description" content="QUẢN LÝ LỚP HỌC THẦY LÊ HOÀNG - V2"><title>QUẢN LÝ LỚP HỌC THẦY LÊ HOÀNG · V2</title><link rel="preconnect" href="https://cdnjs.cloudflare.com"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer"><link rel="stylesheet" href="./styles.css"></head><body><div id="app"><aside class="sidebar" id="sidebar" aria-label="Menu chính"><div class="brand"><div class="brand-mark"><i class="fa-solid fa-school"></i></div><div><strong>QUẢN LÝ LỚP HỌC</strong><small>THẦY LÊ HOÀNG · V2</small></div><button class="icon-btn mobile-only" data-action="close-menu" aria-label="Đóng menu"><i class="fa-solid fa-xmark"></i></button></div><div class="context-card"><label>Năm học</label><select id="schoolYearSelect"><option>2026–2027</option><option>2027–2028</option><option>2028–2029</option></select><label>Lớp</label><select id="classSelect"><option value="5A3">Lớp 5A3</option></select></div><nav id="mainMenu"><button class="menu-item active" data-route="home"><i class="fa-solid fa-house"></i><span>Trang chủ</span></button><button class="menu-item" data-route="students"><i class="fa-solid fa-users"></i><span>Học sinh</span></button><button class="menu-item" data-route="profiles"><i class="fa-solid fa-id-card"></i><span>Hồ sơ học sinh</span></button><button class="menu-item" data-route="attendance"><i class="fa-solid fa-calendar-check"></i><span>Điểm danh</span></button><button class="menu-item" data-route="violations"><i class="fa-solid fa-triangle-exclamation"></i><span>Vi phạm</span><b id="violationBadge">0</b></button><button class="menu-item" data-route="rewards"><i class="fa-solid fa-trophy"></i><span>Khen thưởng</span><b id="rewardBadge">0</b></button><button class="menu-item" data-route="learning"><i class="fa-solid fa-book-open"></i><span>Học tập</span></button><button class="menu-item" data-route="progress"><i class="fa-solid fa-chart-line"></i><span>Tiến bộ</span></button><button class="menu-item" data-route="comments"><i class="fa-solid fa-comment-dots"></i><span>Nhận xét</span></button><button class="menu-item" data-route="links"><i class="fa-solid fa-link"></i><span>Link học sinh</span></button><button class="menu-item" data-route="millionaire"><i class="fa-solid fa-sack-dollar"></i><span>Triệu Phú Học Đường</span><button class="menu-item" data-route="ai"><i class="fa-solid fa-robot"></i><span>AI giáo viên</span><em>Mới</em></button><button class="menu-item" data-route="settings"><i class="fa-solid fa-gear"></i><span>Cấu hình</span></button></nav><div class="teacher-card"><div class="teacher-avatar">LH</div><div><strong>Lê Hoàng</strong><small>Giáo viên chủ nhiệm</small></div></div></aside><div class="overlay" id="overlay"></div><div class="main"><header class="topbar"><div class="topbar-left"><button class="icon-btn mobile-only" data-action="open-menu" aria-label="Mở menu"><i class="fa-solid fa-bars"></i></button><div class="crumb"><span>Quản lý lớp học</span><i class="fa-solid fa-chevron-right"></i><strong id="pageTitle">Trang chủ</strong></div></div><div class="topbar-right"><div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input id="globalSearch" placeholder="Tìm học sinh..." autocomplete="off"><kbd>Ctrl K</kbd></div><button class="icon-btn" data-action="notifications" aria-label="Thông báo"><i class="fa-regular fa-bell"></i><span class="dot" id="notificationDot"></span></button><div class="profile-chip"><span>LH</span><strong>Lê Hoàng</strong></div></div></header><main id="mainContent"></main></div></div><div id="modalRoot"></div><div class="toast-stack" id="toastStack"></div><script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script><script>
(function(){"use strict";
const KEY="LH_V2_2026_2027";
const esc=v=>String(v??"").replace(/[&<>\"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;", "'":"&#39;"}[c]));
const norm=v=>String(v??"").replace(/\s+/g," ").trim();
const canon=v=>norm(v).toLocaleLowerCase("vi").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/đ/g,"d").replace(/[^a-z0-9]+/g,"");
const rosterKey=s=>canon(s.studentCode||"");
function readData(){try{const x=JSON.parse(localStorage.getItem(KEY)||"null");return x&&Array.isArray(x.students)?x:null}catch(_){return null}}
function writeData(d){localStorage.setItem(KEY,JSON.stringify(d))}
function toast(msg){let box=document.getElementById("toastStack");if(!box)return;const e=document.createElement("div");e.className="toast";e.textContent=msg;box.appendChild(e);setTimeout(()=>e.remove(),3200)}
function makeId(){return `STU_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,10)}`}
function findHeader(rows){let best=-1,bestScore=0;const keys=["hovaten","hoten","hocsinh","mahocsinh","mahs","studentid","ngaysinh","gioitinh"];rows.slice(0,30).forEach((r,i)=>{const t=canon((r||[]).join(" | "));let s=0;for(const k of keys)if(t.includes(k))s++;if(s>bestScore){bestScore=s;best=i}});return bestScore>=1?best:-1}
function colIndex(headers,keys){const hs=headers.map(canon);return hs.findIndex(h=>keys.includes(h)||keys.some(k=>h.includes(k)))}
function parseRows(rows,sourceName){const h=findHeader(rows);const headers=h>=0?rows[h].map(norm):[];const nameCol=h>=0?colIndex(headers,["hovaten","hoten","hocsinh"]):-1;const codeCol=h>=0?colIndex(headers,["mahocsinh","mahs","studentid","id"]):-1;const birthCol=h>=0?colIndex(headers,["ngaysinh","sinh"]):-1;const genderCol=h>=0?colIndex(headers,["gioitinh"]):-1;const out=[];for(let i=Math.max(h+1,0);i<rows.length;i++){const row=Array.isArray(rows[i])?rows[i].map(norm):[];if(!row.length)continue;let name=nameCol>=0?row[nameCol]:row.find(x=>x.split(/\s+/).length>=2&&/[A-Za-zÀ-ỹĐđ]/.test(x))||"";name=norm(name);if(!name||name.length<3)continue;const code=codeCol>=0?norm(row[codeCol]):"";const birth=birthCol>=0?norm(row[birthCol]):"";const gender=genderCol>=0?norm(row[genderCol]):"";if(out.some(x=>canon(x.name)===canon(name)&&canon(x.birthDate)===canon(birth)))continue;out.push({name,birthDate:birth,gender,studentCode:code,_row:i+1})}return{rows:out,headerRow:h+1,source:sourceName}}
async function parseFile(file){const ext=(file.name.split(".").pop()||"").toLowerCase();if(ext!=="csv"&&ext!=="xls"&&ext!=="xlsx")throw new Error("Nhập danh sách học sinh dùng CSV/XLS/XLSX để bảo đảm đúng cột.");if(ext==="csv"){return parseRows(parseCSV(await file.text()),file.name)}if(!window.XLSX)throw new Error("Thư viện XLSX chưa sẵn sàng.");const wb=XLSX.read(await file.arrayBuffer(),{type:"array",raw:false});let combined=[];for(const n of wb.SheetNames){const rows=XLSX.utils.sheet_to_json(wb.Sheets[n],{header:1,defval:"",raw:false});const p=parseRows(rows,n);combined=combined.concat(p.rows)}const seen=new Set();combined=combined.filter(r=>{const k=canon(r.name)+"|"+canon(r.birthDate);if(seen.has(k))return false;seen.add(k);return true});return{rows:combined,headerRow:null,source:file.name}}
function parseCSV(text){const rows=[];let row=[],cur="",quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='\"'){if(quoted&&text[i+1]==='\"'){cur+='\"';i++;}else quoted=!quoted}else if(c===","&&!quoted){row.push(cur);cur=""}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);if(row.some(x=>norm(x)!==""))rows.push(row);row=[];cur=""}else cur+=c}if(cur!==""||row.length){row.push(cur);if(row.some(x=>norm(x)!==""))rows.push(row)}return rows}
async function importStudents(file){const parsed=await parseFile(file);if(!parsed.rows.length)throw new Error("Không tìm thấy dòng học sinh hợp lệ trong file.");const data=readData();if(!data)throw new Error("Chưa có dữ liệu V2 để cập nhật.");const now=new Date().toISOString();let added=0,updated=0;for(const r of parsed.rows){let s=null;const code=canon(r.studentCode);if(code)s=data.students.find(x=>rosterKey(x)===code)||null;if(!s){const n=canon(r.name);s=data.students.find(x=>canon(x.name)===n&&(!r.birthDate||canon(x.birthDate)===canon(r.birthDate)))||null}if(s){s.birthDate=r.birthDate||s.birthDate||"";s.gender=r.gender||s.gender||"";if(r.studentCode)s.studentCode=r.studentCode;s.status="active";s.updatedAt=now;updated++}else{data.students.push({id:makeId(),name:r.name,birthDate:r.birthDate||"",gender:r.gender||"",studentCode:r.studentCode||"",status:"active",shareEnabled:true,createdAt:now,updatedAt:now});added++}}writeData(data);return{added,updated,total:parsed.rows.length}}
async function chooseAndImport(){const input=document.createElement("input");input.type="file";input.accept=".csv,.xls,.xlsx,text/csv,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";input.style.display="none";document.body.appendChild(input);input.onchange=async()=>{try{const r=await importStudents(input.files[0]);toast(`Đã nhập ${r.total} học sinh · thêm ${r.added} · cập nhật ${r.updated}.`);setTimeout(()=>location.reload(),500)}catch(e){toast("Lỗi nhập danh sách: "+e.message)}finally{input.remove()}};input.click()}
function openHashStudent(){const m=location.hash.match(/^#student=([^&]+)$/);if(!m)return;const token=decodeURIComponent(m[1]);const data=readData();const hit=data&&data.links?Object.entries(data.links).find(([,v])=>v&&v.token===token):null;if(!hit)return;const studentId=hit[0];const once="LH_V2_HASH_OPENED_"+token;if(sessionStorage.getItem(once))return;sessionStorage.setItem(once,"1");setTimeout(()=>{const menu=document.querySelector('[data-route="profiles"]');if(menu)menu.click();let tries=0;const timer=setInterval(()=>{tries++;const btn=document.querySelector(`[data-action="profile"][data-student="${CSS.escape(studentId)}"]`);if(btn){btn.click();clearInterval(timer)}else if(tries>30)clearInterval(timer)},100)},250)}
document.addEventListener("click",function(e){const b=e.target.closest('[data-action="import-students"]');if(!b)return;e.preventDefault();e.stopImmediatePropagation();chooseAndImport()},{capture:true});window.addEventListener("hashchange",openHashStudent);document.addEventListener("DOMContentLoaded",openHashStudent,{once:true});
})();
</script><script type="module" src="./learning-module.js"></script><script src="./route-compat.js"></script><script type="module" src="./app.js"></script></body></html>
