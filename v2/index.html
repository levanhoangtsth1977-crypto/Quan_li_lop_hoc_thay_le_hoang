<head>

<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#f3f6fb;color:#172033}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:flex}.side{width:285px;background:#fff;border-right:1px solid #e2e8f0;padding:14px;position:fixed;inset:0 auto 0 0;overflow:auto;z-index:30}.brand{display:flex;gap:10px;align-items:center;padding:8px 4px 15px;border-bottom:1px solid #edf1f5}.logo,.avatar{display:grid;place-items:center;background:#1d4ed8;color:#fff;font-weight:800}.logo{width:44px;height:44px;border-radius:12px}.brand b,.brand small,.teacher b,.teacher small{display:block}.brand small,.teacher small,.muted{color:#64748b}.ctx{background:#f8fafc;border:1px solid #e5eaf1;border-radius:12px;padding:10px;margin:12px 0}.ctx label{display:block;font-size:11px;color:#64748b;margin:5px 0}.ctx select{width:100%;padding:8px;border:1px solid #d7dee8;border-radius:9px;background:#fff}.menu{display:grid;gap:3px}.menu button{border:0;background:#fff;border-radius:10px;padding:10px 11px;text-align:left;color:#334155;display:flex;align-items:center;gap:10px;width:100%}.menu button:hover,.menu button.active{background:#eaf1ff;color:#1d4ed8;font-weight:700}.menu .count{margin-left:auto;font-size:11px}.teacher{margin-top:14px;border:1px solid #e8edf3;border-radius:12px;padding:10px;display:flex;gap:9px;align-items:center}.avatar{width:38px;height:38px;border-radius:50%;background:#0f172a}.main{margin-left:285px;min-width:0;flex:1}.top{height:66px;background:#fff;border-bottom:1px solid #e6ebf1;display:flex;align-items:center;gap:10px;padding:0 20px;position:sticky;top:0;z-index:20}.crumb{font-size:13px;flex:1}.search{width:300px;padding:8px 10px;border:1px solid #dbe2ec;border-radius:10px;background:#fff}.search input{border:0;outline:0;width:100%;background:transparent}.content{padding:20px}.hero{background:linear-gradient(135deg,#1d4ed8,#2563eb);color:#fff;border-radius:18px;padding:24px;display:flex;justify-content:space-between;gap:18px}.hero h1{margin:8px 0;font-size:28px;line-height:1.15}.hero p{opacity:.92}.page-head,.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:18px 0 12px}.page-head h1,.page-head h2,.section-title h2,.section-title h3{margin:0}.page-actions,.actions{display:flex;gap:8px;flex-wrap:wrap}.grid{display:grid;gap:12px}.grid4{grid-template-columns:repeat(4,1fr)}.grid3{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}.card,.quick-card,.stat-card{background:#fff;border:1px solid #e4e9f0;border-radius:13px}.card{padding:14px}.quick-card{padding:15px;text-align:left;border:1px solid #e2e8f0}.quick-card:hover{transform:translateY(-1px);box-shadow:0 5px 18px #dbe3f0}.quick-card strong,.quick-card small{display:block}.quick-card small{color:#64748b;margin-top:4px}.stat-card{padding:15px}.stat-card .num{font-size:28px;font-weight:800;margin-top:6px}.btn,.mini-btn{border-radius:9px;padding:8px 11px;border:1px solid #d7dee8;background:#fff;color:#334155}.btn.primary{background:#1d4ed8;color:#fff;border-color:#1d4ed8}.btn.danger{background:#fee2e2;color:#991b1b;border-color:#fecaca}.mini-btn{padding:6px 9px;font-size:12px}.table-wrap{overflow:auto;background:#fff;border:1px solid #e4e9f0;border-radius:12px}.table{width:100%;border-collapse:collapse;font-size:13px}.table th,.table td{padding:9px;border-bottom:1px solid #edf1f5;text-align:left;white-space:nowrap}.table th{background:#f8fafc;color:#475569}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.toolbar input,.toolbar select,.form input,.form select,.form textarea{padding:8px 10px;border:1px solid #d7dee8;border-radius:9px;background:#fff}.toolbar .grow,.form .grow{flex:1;min-width:180px}.form{display:grid;gap:10px}.form label{font-size:12px;font-weight:650;color:#475569}.form textarea{min-height:90px;resize:vertical}.tag{display:inline-block;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:700}.good{background:#dcfce7;color:#166534}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.notice{padding:11px;border-radius:10px;background:#eff6ff;color:#1e40af}.empty{padding:24px;text-align:center;color:#64748b}.modal-root{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0f172a88;z-index:100;padding:16px}.modal-root.show{display:flex}.modal{width:min(620px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:18px}.toast-stack{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:120}.toast{background:#111827;color:#fff;border-radius:10px;padding:10px 12px;box-shadow:0 8px 25px #0003}.mobile{display:none}.overlay{display:none}.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}.tabs button.active{background:#1d4ed8;color:#fff;border-color:#1d4ed8}
@media(max-width:1000px){.grid4{grid-template-columns:repeat(2,1fr)}.grid3{grid-template-columns:repeat(2,1fr)}}
@media(max-width:760px){.side{transform:translateX(-100%);transition:transform .2s;box-shadow:8px 0 25px #0002}.side.open{transform:translateX(0)}.overlay.show{display:block;position:fixed;inset:0;background:#0f172a66;z-index:25}.main{margin-left:0}.mobile{display:inline-flex}.top{padding:0 12px}.search{width:190px}.content{padding:14px}.hero{padding:18px}.hero h1{font-size:23px}.grid4,.grid3,.grid2{grid-template-columns:1fr}.page-head{align-items:flex-start;flex-direction:column}.page-actions{width:100%}.page-actions .btn{flex:0 0 auto}}
@media(max-width:450px){.search{width:135px}.crumb{font-size:12px}.top .btn{padding:7px 9px}}
</style>

<body>
<div class="app">
<aside class="side" id="side">
<div class="brand"><div class="logo">LH</div><div><b>QUẢN LÝ LỚP HỌC</b><small>THẦY LÊ HOÀNG</small></div></div>
<div class="ctx"><label>Năm học</label><select id="schoolYear"><option>2026–2027</option></select><label>Lớp</label><select id="className"><option>5A3</option></select></div>
<nav class="menu" id="menu"></nav>
<div class="teacher"><div class="avatar">LH</div><div><b>Lê Hoàng</b><small>GVCN · Trường Tiểu học Nghĩa Hành</small></div></div>
</aside>
<div class="overlay" id="overlay"></div>
<main class="main">
<header class="top"><button class="btn primary mobile" id="hamb">☰</button><div class="crumb">Quản lý lớp học › <strong id="pageTitle">Trang chủ</strong></div><div class="search"><input id="globalSearch" placeholder="Tìm học sinh..."></div></header>
<section class="content" id="mainContent"></section>
</main></div>
<div class="modal-root" id="modalRoot"></div><div class="toast-stack" id="toastStack"></div>
<script>
(()=>{
'use strict';
const KEY='LH_CANONICAL_2026_2027';
const MENU=[
['home','🏠','Trang chủ'],['students','👥','Học sinh'],['profiles','🪪','Hồ sơ học sinh'],['attendance','📅','Điểm danh'],['violations','⚠️','Vi phạm'],['rewards','🏆','Khen thưởng'],['learning','📚','Học tập'],['progress','📈','Tiến bộ'],['comments','💬','Nhận xét'],['links','🔗','Link học sinh'],['millionaire','💰','Triệu Phú Học Đường'],['ai','🤖','AI giáo viên'],['settings','⚙️','Cấu hình']
];
const NAMES=[['Nguyễn Bảo An','01/02/2016'],['Phạm Nguyễn Thiên Anh','22/01/2016'],['Nguyễn Ngọc Bích','13/09/2016'],['Lương Bảo Châu','31/01/2016'],['Trần Thị Ngọc Diệp','11/02/2016'],['Võ Thị Huyền Diệu','01/09/2016'],['Phạm Minh Đức','23/08/2016'],['Huỳnh Đặng Quốc Hoàng','19/11/2016'],['Nguyễn Gia Hưng','07/12/2016'],['Tạ Trí Khang','20/08/2016'],['Nguyễn Văn Đăng Khoa','28/03/2016'],['Phạm Đăng Khôi','29/09/2016'],['Ngô Sinh Khởi','01/10/2016'],['Phạm Anh Kiệt','17/07/2016'],['Trần Anh Kiệt','08/03/2016'],['Nguyễn Quỳnh Lam','18/01/2016'],['Trịnh Gia Linh','06/08/2016'],['Phạm Tấn Mạnh','30/05/2016'],['Bùi Nguyễn Hà My','24/01/2016'],['Lương Đỗ Thảo My','19/06/2016'],['Huỳnh Hữu Nam','13/11/2016'],['Bùi Huỳnh Khánh Ngọc','15/04/2016'],['Nguyễn Bùi Bảo Ngọc','07/07/2016'],['Nguyễn Thị Bảo Ngọc','09/01/2016'],['Trịnh Phước Nguyên','11/11/2016'],['Ngô Thiện Nhân','12/10/2016'],['Phạm Lê An Nhiên','21/12/2016'],['Lê Văn Phát','15/02/2016'],['Bùi Văn Phong','04/04/2016'],['Đinh Nguyễn Anh Phong','18/01/2016'],['Nguyễn Văn Phước','02/12/2016'],['Phạm Anh Quân','17/07/2016'],['Đoàn Văn Quý','10/06/2016'],['Lê Hữu Phú Quý','10/09/2016'],['Huỳnh Lê Nhã Quyên','29/10/2016'],['Lê Bá Thụ','14/12/2016'],['Huỳnh Bảo Trâm','10/08/2016'],['Nguyễn Đăng Trường','23/02/2016'],['Võ Tấn Trường','14/12/2016'],['Huỳnh Gia Tuệ','12/03/2016'],['Võ Thanh Vỹ','22/10/2016'],['Huỳnh Ngọc Bảo Yến','30/11/2016']];
const VIOLATIONS=['Không tập trung trong giờ học','Nói chuyện riêng trong giờ học','Quên đồ dùng học tập','Không hoàn thành nhiệm vụ học tập','Làm việc riêng trong giờ học','Mất trật tự trong lớp','Không thực hiện nhiệm vụ được giao','Chưa chuẩn bị bài ở nhà','Không giữ gìn vệ sinh lớp học','Xả rác không đúng nơi quy định','Tự ý rời vị trí khi chưa được phép','Sử dụng điện thoại/thiết bị không đúng quy định','Trêu chọc bạn','Tranh giành đồ dùng với bạn','Đùa nghịch gây ảnh hưởng bạn khác','Chưa chấp hành hướng dẫn của giáo viên','Đi học muộn','Thiếu đồ dùng cá nhân cần thiết','Viết/vẽ không đúng nơi quy định','Hành vi khác cần ghi rõ'];
const REWARDS=['Hoàn thành tốt nhiệm vụ học tập','Có tiến bộ rõ rệt','Chủ động giúp đỡ bạn','Tích cực phát biểu xây dựng bài','Thực hiện tốt nội quy lớp','Giữ gìn vệ sinh lớp học','Có ý thức bảo quản đồ dùng chung','Tinh thần hợp tác tốt','Tự giác hoàn thành nhiệm vụ','Có sáng kiến trong hoạt động','Tham gia tích cực hoạt động tập thể','Gương mẫu trong công việc được giao','Biết nhận lỗi và sửa lỗi','Có ý thức giữ gìn môi trường','Thực hiện tốt an toàn giao thông','Nhặt được của rơi trả người mất','Có hành động đẹp giúp đỡ người khác','Đạt kết quả nổi bật trong học tập','Tiến bộ trong rèn luyện','Thành tích/việc tốt khác'];
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>`HS_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;
const today=()=>new Date().toISOString().slice(0,10);
function blank(){return {version:1,students:NAMES.map(x=>({id:uid(),name:x[0],birthDate:x[1],gender:'',status:'active'})),attendance:[],violations:[],rewards:[],progress:[],comments:[],links:[],learning:{GK1:[],CK1:[],GK2:[],CK2:[]},millionaire:[]}}
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&Array.isArray(x.students))return Object.assign(blank(),x)}catch(e){}const x=blank();localStorage.setItem(KEY,JSON.stringify(x));return x}
let D=load(), route='home', routeParams={};
function save(){localStorage.setItem(KEY,JSON.stringify(D))}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;$('toastStack').appendChild(e);setTimeout(()=>e.remove(),2500)}
function student(id){return D.students.find(s=>s.id===id)||null}
function setMenu(){ $('menu').innerHTML=MENU.map(m=>`<button class="${route===m[0]?'active':''}" data-route="${m[0]}"><span>${m[1]}</span><span>${m[2]}</span>${m[0]==='violations'?`<span class="count">${D.violations.length}</span>`:''}${m[0]==='rewards'?`<span class="count">${D.rewards.length}</span>`:''}</button>`).join('') }
function nav(r,p={}){route=r;routeParams=p;render();$('side').classList.remove('open');$('overlay').classList.remove('show');window.scrollTo({top:0,behavior:'smooth'})}
function head(t,s,a=''){return `<div class="page-head"><div><h1>${esc(t)}</h1><div class="muted">${esc(s)}</div></div><div class="page-actions">${a}</div></div>`}
function stats(){return `<div class="grid grid4"><div class="stat-card"><div class="muted">Học sinh</div><div class="num">${D.students.length}</div></div><div class="stat-card"><div class="muted">Có mặt hôm nay</div><div class="num">${D.attendance.filter(x=>x.date===today()&&x.status==='present').length}</div></div><div class="stat-card"><div class="muted">Vi phạm</div><div class="num">${D.violations.length}</div></div><div class="stat-card"><div class="muted">Khen thưởng</div><div class="num">${D.rewards.length}</div></div></div>`}
function home(){return `<div class="hero"><div><div>👋 Chào mừng trở lại</div><h1>QUẢN LÝ LỚP HỌC<br>THẦY LÊ HOÀNG</h1><p>Trường Tiểu học Nghĩa Hành · Lớp 5A3 · Năm học 2026–2027</p></div><div style="font-size:70px;opacity:.18">🏫</div></div>${head('Thao tác nhanh','Mọi nút dùng chung một Router và một Store.') }<div class="grid grid4"><button class="quick-card" data-action="add-student"><strong>➕ Thêm học sinh</strong><small>Mở form hồ sơ</small></button><button class="quick-card" data-route="attendance"><strong>📅 Điểm danh</strong><small>Ghi nhận hôm nay</small></button><button class="quick-card" data-action="add-violation"><strong>⚠️ Ghi vi phạm</strong><small>20 lựa chọn nhanh</small></button><button class="quick-card" data-action="add-reward"><strong>🏆 Khen thưởng</strong><small>20 lựa chọn nhanh</small></button></div>${head('Tổng quan lớp học','Dữ liệu hiện tại')}${stats()}<div class="grid grid2" style="margin-top:14px"><div class="card"><div class="section-title"><h3>Học sinh cần quan tâm</h3><button class="mini-btn" data-route="profiles">Mở hồ sơ</button></div>${renderAttention()}</div><div class="card"><div class="section-title"><h3>Hoạt động gần đây</h3><button class="mini-btn" data-action="refresh">Làm mới</button></div>${renderRecent()}</div></div>`}
function renderAttention(){const m=new Map();D.violations.forEach(x=>m.set(x.studentId,(m.get(x.studentId)||0)+1));const arr=[...m.entries()].sort((a,b)=>b[1]-a[1]).slice(0,6);return arr.length?arr.map(([id,n])=>`<div style="padding:8px 0;border-bottom:1px solid #edf1f5"><strong>${esc(student(id)?.name||id)}</strong><span class="tag warn" style="float:right">${n} lượt</span></div>`).join(''):`<div class="empty">Chưa có dữ liệu vi phạm.</div>`}
function renderRecent(){const arr=[...D.violations.map(x=>({t:x.createdAt||x.date,l:'Vi phạm',n:student(x.studentId)?.name||x.studentId,c:'bad'})),...D.rewards.map(x=>({t:x.createdAt||x.date,l:'Khen thưởng',n:student(x.studentId)?.name||x.studentId,c:'good'})),...D.comments.map(x=>({t:x.createdAt||x.date,l:'Nhận xét',n:student(x.studentId)?.name||x.studentId,c:'good'}))].sort((a,b)=>String(b.t).localeCompare(String(a.t))).slice(0,8);return arr.length?arr.map(x=>`<div style="padding:8px 0;border-bottom:1px solid #edf1f5"><span class="tag ${x.c}">${x.l}</span> <strong>${esc(x.n)}</strong><small class="muted" style="float:right">${esc(x.t||'')}</small></div>`).join(''):`<div class="empty">Chưa có hoạt động.</div>`}
function students(){return head('Học sinh','Nguồn dữ liệu học sinh duy nhất của hệ thống',`<button class="btn secondary" data-action="import-students">Nhập danh sách</button><button class="btn primary" data-action="add-student">+ Thêm học sinh</button>`)+`<div class="toolbar"><input class="grow" id="studentFilter" placeholder="Tìm theo họ tên..."><select id="studentStatus"><option value="all">Tất cả</option><option value="active">Đang học</option><option value="inactive">Không còn học</option></select></div><div class="table-wrap"><table class="table"><thead><tr><th>STT</th><th>Họ tên</th><th>Ngày sinh</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="studentRows"></tbody></table></div>`}
function fillStudents(){const q=($('studentFilter')?.value||'').toLocaleLowerCase('vi'),st=$('studentStatus')?.value||'all';const rows=D.students.filter(s=>(st==='all'||s.status===st)&&(!q||s.name.toLocaleLowerCase('vi').includes(q)));$('studentRows').innerHTML=rows.map((s,i)=>`<tr><td>${i+1}</td><td><strong>${esc(s.name)}</strong><div class="muted">${esc(s.id)}</div></td><td>${esc(s.birthDate||'')}</td><td><span class="tag ${s.status==='active'?'good':'warn'}">${s.status==='active'?'Đang học':'Không còn học'}</span></td><td><div class="actions"><button class="mini-btn" data-action="profile" data-student="${s.id}">Hồ sơ</button><button class="mini-btn" data-action="edit-student" data-student="${s.id}">Sửa</button></div></td></tr>`).join('')||`<tr><td colspan="5"><div class="empty">Không tìm thấy học sinh.</div></td></tr>`}
function profiles(){return head('Hồ sơ học sinh','Một hồ sơ tổng hợp cho mỗi học sinh',`<button class="btn primary" data-action="add-student">+ Thêm học sinh</button>`)+`<div class="toolbar"><input class="grow" id="profileFilter" placeholder="Tìm học sinh..."></div><div class="grid grid3" id="profileCards"></div>`}
function fillProfiles(){const q=($('profileFilter')?.value||'').toLocaleLowerCase('vi');$('profileCards').innerHTML=D.students.filter(s=>!q||s.name.toLocaleLowerCase('vi').includes(q)).map(s=>{const v=D.violations.filter(x=>x.studentId===s.id).length,r=D.rewards.filter(x=>x.studentId===s.id).length,a=D.attendance.filter(x=>x.studentId===s.id&&x.date===today()).length;return `<div class="card"><h3 style="margin:0 0 4px">${esc(s.name)}</h3><div class="muted">${esc(s.birthDate||'')}</div><p>Hôm nay: ${a?'Có điểm danh':'Chưa điểm danh'} · Vi phạm: ${v} · Khen: ${r}</p><button class="btn primary" style="width:100%" data-action="profile" data-student="${s.id}">Mở trang tổng hợp</button></div>`}).join('')||`<div class="empty">Không có học sinh.</div>`}
function profile(id){const s=student(id);if(!s)return `<div class="empty">Không tìm thấy học sinh.</div>`;const att=D.attendance.filter(x=>x.studentId===id),v=D.violations.filter(x=>x.studentId===id),r=D.rewards.filter(x=>x.studentId===id),c=D.comments.filter(x=>x.studentId===id),l=D.learning;return head(s.name,'TRANG TỔNG HỢP · mọi dữ liệu liên quan',`<button class="btn secondary" data-route="profiles">← Hồ sơ</button><button class="btn primary" data-action="edit-student" data-student="${id}">Sửa</button>`)+`<div class="grid grid2"><div class="card"><h3>Thông tin</h3><p>Ngày sinh: <b>${esc(s.birthDate||'')}</b></p><p>Trạng thái: <span class="tag ${s.status==='active'?'good':'warn'}">${s.status==='active'?'Đang học':'Không còn học'}</span></p><div class="actions">${['attendance','violations','rewards','learning','progress','comments','links'].map(x=>`<button class="mini-btn" data-route="${x}" data-student="${id}">${MENU.find(m=>m[0]===x)[2]}</button>`).join('')}</div></div><div class="card"><h3>Học tập SMAS</h3>${['GK1','CK1','GK2','CK2'].map(k=>`<div style="padding:7px 0;border-bottom:1px solid #edf1f5"><b>${k}</b><span style="float:right">${(l[k]||[]).filter(x=>x.studentId===id).length} bản ghi</span></div>`).join('')}</div></div><div class="grid grid2" style="margin-top:12px"><div class="card"><h3>Vi phạm</h3>${v.length?v.slice(-8).reverse().map(x=>`<div style="padding:6px 0"><span class="tag bad">${esc(x.type)}</span> <small class="muted">${esc(x.date)}</small></div>`).join(''):`<div class="empty">Chưa có.</div>`}</div><div class="card"><h3>Khen thưởng</h3>${r.length?r.slice(-8).reverse().map(x=>`<div style="padding:6px 0"><span class="tag good">${esc(x.type)}</span> <small class="muted">${esc(x.date)}</small></div>`).join(''):`<div class="empty">Chưa có.</div>`}</div></div><div class="card" style="margin-top:12px"><h3>Nhận xét</h3>${c.length?c.slice(-6).reverse().map(x=>`<div style="padding:7px 0;border-bottom:1px solid #edf1f5">${esc(x.content)} <small class="muted">${esc(x.date)}</small></div>`).join(''):`<div class="empty">Chưa có nhận xét.</div>`}</div>`}
function attendance(){return head('Điểm danh','Ghi theo ngày, liên kết bằng Student ID',`<button class="btn secondary" data-action="attendance-all">Tất cả có mặt</button><button class="btn primary" data-action="save-attendance">Lưu</button>`)+`<div class="toolbar"><label style="display:flex;align-items:center;gap:6px">Ngày <input type="date" id="attDate" value="${today()}"></label></div><div class="table-wrap"><table class="table"><thead><tr><th>STT</th><th>Học sinh</th><th>Trạng thái</th><th>Ghi chú</th></tr></thead><tbody id="attRows"></tbody></table></div>`}
function fillAttendance(){const d=$('attDate').value||today(),map=new Map(D.attendance.filter(x=>x.date===d).map(x=>[x.studentId,x]));$('attRows').innerHTML=D.students.map((s,i)=>{const r=map.get(s.id)||{};return `<tr><td>${i+1}</td><td>${esc(s.name)}</td><td><select data-att-status="${s.id}"><option value="present" ${r.status==='present'||!r.status?'selected':''}>Có mặt</option><option value="excused" ${r.status==='excused'?'selected':''}>Có phép</option><option value="absent" ${r.status==='absent'?'selected':''}>Không phép</option></select></td><td><input data-att-note="${s.id}" value="${esc(r.note||'')}" placeholder="Ghi chú"></td></tr>`}).join('')}
function eventList(type,title,items,options){const rows=D[type].slice().reverse();return head(title,`Tổng: ${rows.length}`,`<button class="btn primary" data-action="add-${type==='violations'?'violation':'reward'}">+ Ghi mới</button>`)+`<div class="table-wrap"><table class="table"><thead><tr><th>Ngày</th><th>Học sinh</th><th>Nội dung</th><th>Ghi chú</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(student(x.studentId)?.name||x.studentId)}</td><td><span class="tag ${type==='violations'?'bad':'good'}">${esc(x.type)}</span></td><td>${esc(x.note||'')}</td></tr>`).join('')||`<tr><td colspan="4"><div class="empty">Chưa có dữ liệu.</div></td></tr>`}</tbody></table></div>`}
function violations(){return eventList('violations','Vi phạm',VIOLATIONS)}
function rewards(){return eventList('rewards','Khen thưởng',REWARDS)}
function learning(){return head('Học tập','Nhập và quản lý kết quả SMAS theo 4 đợt',`<button class="btn primary" data-action="import-learning">Nhập SMAS</button>`)+`<div class="tabs">${['GK1','CK1','GK2','CK2'].map((k,i)=>`<button class="btn ${routeParams.stage===k||(!routeParams.stage&&i===0)?'active':''}" data-action="learning-stage" data-stage="${k}">${k}</button>`).join('')}</div><div class="notice">Mỗi đợt có dữ liệu riêng, dùng Student ID để ghép về hồ sơ học sinh. File CSV/TSV có thể nhập trực tiếp; hệ thống không ghi đè bản gốc.</div><div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>Học sinh</th><th>Môn</th><th>Kết quả</th><th>Giai đoạn</th></tr></thead><tbody>${(D.learning[routeParams.stage||'GK1']||[]).map(x=>`<tr><td>${esc(student(x.studentId)?.name||x.studentId)}</td><td>${esc(x.subject||'')}</td><td>${esc(x.result||x.score||'')}</td><td>${esc(routeParams.stage||'GK1')}</td></tr>`).join('')||`<tr><td colspan="4"><div class="empty">Chưa có dữ liệu cho đợt này.</div></td></tr>`}</tbody></table></div>`}
function progress(){return head('Tiến bộ','Theo dõi thay đổi theo các giai đoạn học tập',`<button class="btn primary" data-action="add-progress">+ Ghi tiến bộ</button>`)+`<div class="table-wrap"><table class="table"><thead><tr><th>Ngày</th><th>Học sinh</th><th>Nội dung</th></tr></thead><tbody>${D.progress.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(student(x.studentId)?.name||x.studentId)}</td><td>${esc(x.content)}</td></tr>`).join('')||`<tr><td colspan="3"><div class="empty">Chưa có dữ liệu.</div></td></tr>`}</tbody></table></div>`}
function comments(){return head('Nhận xét','Ghi nhận nhận xét theo từng học sinh',`<button class="btn primary" data-action="add-comment">+ Thêm nhận xét</button>`)+`<div class="table-wrap"><table class="table"><thead><tr><th>Ngày</th><th>Học sinh</th><th>Nhận xét</th></tr></thead><tbody>${D.comments.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(student(x.studentId)?.name||x.studentId)}</td><td>${esc(x.content)}</td></tr>`).join('')||`<tr><td colspan="3"><div class="empty">Chưa có nhận xét.</div></td></tr>`}</tbody></table></div>`}
function links(){return head('Link học sinh','Quản lý liên kết cá nhân theo Student ID',`<button class="btn primary" data-action="add-link">+ Thêm link</button>`)+`<div class="table-wrap"><table class="table"><thead><tr><th>Học sinh</th><th>Loại</th><th>Link</th></tr></thead><tbody>${D.links.map(x=>`<tr><td>${esc(student(x.studentId)?.name||x.studentId)}</td><td>${esc(x.type||'')}</td><td><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.url)}</a></td></tr>`).join('')||`<tr><td colspan="3"><div class="empty">Chưa có link.</div></td></tr>`}</tbody></table></div>`}
function millionaire(){return head('Triệu Phú Học Đường','Khu vực trò chơi và ngân hàng câu hỏi',`<button class="btn primary" data-action="millionaire">Mở trò chơi</button>`)+`<div class="grid grid3"><div class="card"><h3>Ngân hàng câu hỏi</h3><div class="num" style="font-size:28px;font-weight:800">${D.millionaire.length}</div><div class="muted">Câu hỏi đã lưu</div></div><div class="card"><h3>Cấu trúc</h3><div>M1/M2/M3 = 50/30/20</div><div>Điểm = 1/2/3</div><div>Thời gian = 30/45/60 giây</div></div><div class="card"><h3>Bộ sách</h3><div>Kết nối tri thức với cuộc sống</div><div class="muted">TOÁN · TV · KHOA HỌC · LS-DL</div></div></div>`}
function ai(){return head('AI giáo viên','Khu vực hỗ trợ soạn giảng và xử lý dữ liệu',`<button class="btn primary" data-action="copy-ai-prompt">Sao chép mẫu yêu cầu</button>`)+`<div class="card"><h3>Trợ lý công việc</h3><p>Nhập yêu cầu vào ô dưới đây. Trang này không tự gửi dữ liệu ra dịch vụ trả phí.</p><textarea id="aiInput" style="width:100%;min-height:160px;padding:10px;border:1px solid #d7dee8;border-radius:9px" placeholder="Ví dụ: Phân tích học sinh cần quan tâm dựa trên dữ liệu hiện có..."></textarea><div class="actions" style="margin-top:10px"><button class="btn primary" data-action="ai-preview">Xem gợi ý</button><button class="btn secondary" data-action="ai-clear">Xóa</button></div><div id="aiOutput" style="margin-top:12px"></div></div>`}
function settings(){return head('Cấu hình','Thông tin hệ thống hiện tại',`<button class="btn primary" data-action="export-json">Xuất dữ liệu</button><button class="btn danger" data-action="reset-data">Đặt lại dữ liệu</button>`)+`<div class="grid grid2"><div class="card"><h3>Thông tin lớp</h3><div>Trường: <b>Trường Tiểu học Nghĩa Hành</b></div><div>Lớp: <b>5A3</b></div><div>Năm học: <b>2026–2027</b></div><div>GVCN: <b>Lê Hoàng</b></div></div><div class="card"><h3>Kho dữ liệu</h3><div>Học sinh: ${D.students.length}</div><div>Điểm danh: ${D.attendance.length}</div><div>Vi phạm: ${D.violations.length}</div><div>Khen thưởng: ${D.rewards.length}</div></div></div>`}
function page(){switch(route){case'home':return home();case'students':return students();case'profiles':return profiles();case'profile':return profile(routeParams.studentId);case'attendance':return attendance();case'violations':return violations();case'rewards':return rewards();case'learning':return learning();case'progress':return progress();case'comments':return comments();case'links':return links();case'millionaire':return millionaire();case'ai':return ai();case'settings':return settings();default:route='home';return home()}}
function render(){setMenu();$('pageTitle').textContent=(MENU.find(m=>m[0]===route)?.[2])||'Trang chủ';$('mainContent').innerHTML=page();if(route==='students')fillStudents();if(route==='profiles')fillProfiles();if(route==='attendance')fillAttendance();}
function openModal(title,body){$('modalRoot').innerHTML=`<div class="modal"><div class="page-head"><h2>${esc(title)}</h2><button class="mini-btn" data-action="close-modal">✕</button></div>${body}</div>`;$('modalRoot').classList.add('show')}
function closeModal(){$('modalRoot').classList.remove('show');$('modalRoot').innerHTML=''}
function studentSelect(name='studentId',selected=''){return `<select id="${name}" required>${D.students.map(s=>`<option value="${s.id}" ${s.id===selected?'selected':''}>${esc(s.name)}</option>`).join('')}</select>`}
function addStudentForm(id=''){const s=id?student(id):null;openModal(id?'Sửa học sinh':'Thêm học sinh',`<div class="form"><label>Họ tên</label><input id="fName" value="${esc(s?.name||'')}" autofocus><label>Ngày sinh</label><input id="fBirth" value="${esc(s?.birthDate||'')}" placeholder="dd/mm/yyyy"><label>Trạng thái</label><select id="fStatus"><option value="active" ${(s?.status||'active')==='active'?'selected':''}>Đang học</option><option value="inactive" ${s?.status==='inactive'?'selected':''}>Không còn học</option></select><div class="actions"><button class="btn secondary" data-action="close-modal">Hủy</button><button class="btn primary" data-action="save-student" data-student="${id}">Lưu</button></div></div>`)}
function addEventForm(kind){const arr=kind==='violation'?VIOLATIONS:REWARDS;const title=kind==='violation'?'Ghi vi phạm':'Ghi khen thưởng';openModal(title,`<div class="form"><label>Học sinh</label>${studentSelect()}<label>Nội dung</label><select id="eventType">${arr.map(x=>`<option>${esc(x)}</option>`).join('')}</select><label>Ghi chú</label><textarea id="eventNote" placeholder="Ghi chú thêm..."></textarea><div class="actions"><button class="btn secondary" data-action="close-modal">Hủy</button><button class="btn primary" data-action="save-event" data-kind="${kind}">Lưu</button></div></div>`)}
function addProgressForm(){openModal('Ghi tiến bộ',`<div class="form"><label>Học sinh</label>${studentSelect()}<label>Nội dung</label><textarea id="progressText" placeholder="Mô tả tiến bộ..."></textarea><div class="actions"><button class="btn secondary" data-action="close-modal">Hủy</button><button class="btn primary" data-action="save-progress">Lưu</button></div></div>`)}
function addCommentForm(){openModal('Thêm nhận xét',`<div class="form"><label>Học sinh</label>${studentSelect()}<label>Nhận xét</label><textarea id="commentText" placeholder="Nhập nhận xét..."></textarea><div class="actions"><button class="btn secondary" data-action="close-modal">Hủy</button><button class="btn primary" data-action="save-comment">Lưu</button></div></div>`)}
function addLinkForm(){openModal('Thêm link học sinh',`<div class="form"><label>Học sinh</label>${studentSelect()}<label>Loại link</label><input id="linkType" placeholder="Điểm danh / học tập / cá nhân..."><label>URL</label><input id="linkUrl" placeholder="https://..."><div class="actions"><button class="btn secondary" data-action="close-modal">Hủy</button><button class="btn primary" data-action="save-link">Lưu</button></div></div>`)}
function importStudents(){openModal('Nhập danh sách học sinh',`<div class="form"><div class="notice">Chấp nhận CSV/TSV theo dạng: Họ tên [tab] Ngày sinh. Dòng đầu nếu là tiêu đề sẽ được bỏ qua.</div><input type="file" id="studentFile" accept=".csv,.tsv,.txt"><div class="actions"><button class="btn secondary" data-action="close-modal">Hủy</button><button class="btn primary" data-action="do-import-students">Nhập</button></div></div>`)}
function importLearning(){openModal('Nhập kết quả SMAS',`<div class="form"><label>Đợt dữ liệu</label><select id="learnStage"><option>GK1</option><option>CK1</option><option>GK2</option><option>CK2</option></select><div class="notice">CSV/TSV: Họ tên hoặc Student ID, Môn, Kết quả. Hệ thống ghép theo Student ID trước, sau đó theo họ tên.</div><input type="file" id="learnFile" accept=".csv,.tsv,.txt"><div class="actions"><button class="btn secondary" data-action="close-modal">Hủy</button><button class="btn primary" data-action="do-import-learning">Nhập</button></div></div>`)}
function readText(file,cb){const r=new FileReader();r.onload=()=>cb(String(r.result||''));r.onerror=()=>toast('Không đọc được file');r.readAsText(file,'utf-8')}
function splitLine(x){return x.includes('\t')?x.split('\t'):x.split(',')}
function doImportStudents(){const f=$('studentFile')?.files?.[0];if(!f)return toast('Chọn file trước');readText(f,text=>{const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let added=0;for(let i=0;i<lines.length;i++){const c=splitLine(lines[i]).map(x=>x.trim());if(i===0&&/họ.?tên|ho.?ten/i.test(c[0]))continue;if(!c[0])continue;if(!D.students.some(s=>s.name.toLocaleLowerCase('vi')===c[0].toLocaleLowerCase('vi'))){D.students.push({id:uid(),name:c[0],birthDate:c[1]||'',gender:'',status:'active'});added++}}save();closeModal();render();toast(`Đã nhập ${added} học sinh`);})}
function doImportLearning(){const f=$('learnFile')?.files?.[0],stage=$('learnStage')?.value||'GK1';if(!f)return toast('Chọn file trước');readText(f,text=>{const lines=text.split(/\r?\n/).map(x=>x.trim()).filter(Boolean);let added=0;for(let i=0;i<lines.length;i++){const c=splitLine(lines[i]).map(x=>x.trim());if(i===0&&/họ.?tên|student.?id|môn|mon/i.test(c.join(' ')))continue;const key=c[0]||'';const s=student(key)||D.students.find(z=>z.name.toLocaleLowerCase('vi')===key.toLocaleLowerCase('vi'));if(!s)continue;D.learning[stage].push({studentId:s.id,subject:c[1]||'',result:c[2]||'',source:f.name,createdAt:today()});added++}save();closeModal();routeParams={stage};render();toast(`Đã nhập ${added} bản ghi vào ${stage}`);})}
function saveAttendance(all=false){const date=$('attDate')?.value||today();D.attendance=D.attendance.filter(x=>x.date!==date||!$('attRows'));if(all){D.students.forEach(s=>D.attendance.push({id:uid(),studentId:s.id,date,status:'present',note:'',createdAt:new Date().toISOString()}))}else{$$('select[data-att-status]').forEach(el=>D.attendance.push({id:uid(),studentId:el.dataset.attStatus,date,status:el.value,note:$(`input[data-att-note="${CSS.escape(el.dataset.attStatus)}"]`)?.value||'',createdAt:new Date().toISOString()}))}save();render();toast('Đã lưu điểm danh')}
function exportJson(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='quan-ly-lop-5A3-2026-2027.json';a.click();URL.revokeObjectURL(a.href)}
function resetData(){if(confirm('Đặt lại toàn bộ dữ liệu lớp về dữ liệu ban đầu?')){D=blank();save();route='home';routeParams={};render();toast('Đã đặt lại dữ liệu ban đầu')}}
function copyAi(){navigator.clipboard?.writeText('Phân tích dữ liệu lớp 5A3 dựa trên dữ liệu hiện có; không tự tạo số liệu; nêu rõ bằng chứng và đề xuất biện pháp giáo dục thực tế.').then(()=>toast('Đã sao chép mẫu yêu cầu')).catch(()=>toast('Không thể sao chép tự động'))}
function onClick(e){const routeBtn=e.target.closest('[data-route]');if(routeBtn){nav(routeBtn.dataset.route,{studentId:routeBtn.dataset.student||''});return}const action=e.target.closest('[data-action]');if(!action)return;const a=action.dataset.action;if(a==='close-modal'){closeModal();return}if(a==='refresh'){render();toast('Đã làm mới');return}if(a==='add-student'||a==='edit-student'){addStudentForm(action.dataset.student||'');return}if(a==='add-violation'){addEventForm('violation');return}if(a==='add-reward'){addEventForm('reward');return}if(a==='save-student'){const id=action.dataset.student,s=$.trim?null:null;const name=($('fName').value||'').trim();if(!name)return toast('Nhập họ tên');if(id){const x=student(id);x.name=name;x.birthDate=$('fBirth').value.trim();x.status=$('fStatus').value}else D.students.push({id:uid(),name,birthDate:$('fBirth').value.trim(),gender:'',status:$('fStatus').value});save();closeModal();render();toast(id?'Đã cập nhật học sinh':'Đã thêm học sinh');return}if(a==='save-event'){const s=$('studentId').value;const rec={id:uid(),studentId:s,type:$('eventType').value,note:$('eventNote').value.trim(),date:today(),createdAt:new Date().toISOString()};D[a==='save-event'&&action.dataset.kind==='violation'?'violations':'rewards'].push(rec);save();closeModal();render();toast('Đã lưu');return}if(a==='save-progress'){const s=$('studentId').value,t=$('progressText').value.trim();if(!t)return toast('Nhập nội dung');D.progress.push({id:uid(),studentId:s,content:t,date:today(),createdAt:new Date().toISOString()});save();closeModal();render();toast('Đã lưu tiến bộ');return}if(a==='save-comment'){const s=$('studentId').value,t=$('commentText').value.trim();if(!t)return toast('Nhập nhận xét');D.comments.push({id:uid(),studentId:s,content:t,date:today(),createdAt:new Date().toISOString()});save();closeModal();render();toast('Đã lưu nhận xét');return}if(a==='save-link'){const s=$('studentId').value,u=$('linkUrl').value.trim();if(!/^https?:\/\//i.test(u))return toast('URL phải bắt đầu bằng http:// hoặc https://');D.links.push({id:uid(),studentId:s,type:$('linkType').value.trim(),url:u,date:today()});save();closeModal();render();toast('Đã lưu link');return}if(a==='attendance-all'){saveAttendance(true);return}if(a==='save-attendance'){saveAttendance(false);return}if(a==='add-progress'){addProgressForm();return}if(a==='add-comment'){addCommentForm();return}if(a==='add-link'){addLinkForm();return}if(a==='import-students'){importStudents();return}if(a==='do-import-students'){doImportStudents();return}if(a==='import-learning'){importLearning();return}if(a==='do-import-learning'){doImportLearning();return}if(a==='learning-stage'){routeParams={stage:action.dataset.stage};render();return}if(a==='export-json'){exportJson();return}if(a==='reset-data'){resetData();return}if(a==='copy-ai-prompt'){copyAi();return}if(a==='ai-clear'){$('aiInput').value='';$('aiOutput').innerHTML='';return}if(a==='ai-preview'){const text=$('aiInput').value.trim();$('aiOutput').innerHTML=`<div class="notice"><b>Gợi ý xử lý:</b><br>${esc(text||'Hãy nhập một yêu cầu cụ thể.')}</div>`;return}if(a==='profile'){nav('profile',{studentId:action.dataset.student});return}if(a==='millionaire'){toast('Khu trò chơi đã sẵn sàng; ngân hàng câu hỏi dùng chung với hệ thống.');return}}
function onInput(e){if(e.target.id==='globalSearch'){const q=e.target.value.trim().toLocaleLowerCase('vi');if(route==='students'){const x=$('studentFilter');if(x){x.value=q;fillStudents()}}else if(route==='profiles'){const x=$('profileFilter');if(x){x.value=q;fillProfiles()}}}if(e.target.id==='studentFilter')fillStudents();if(e.target.id==='profileFilter')fillProfiles()}
function $(sel){return document.getElementById(sel)}
function $$(sel){return [...document.querySelectorAll(sel)]}
document.addEventListener('click',onClick);document.addEventListener('input',onInput);$('hamb').addEventListener('click',()=>{$('side').classList.toggle('open');$('overlay').classList.toggle('show')});$('overlay').addEventListener('click',()=>{$('side').classList.remove('open');$('overlay').classList.remove('show')});$('modalRoot').addEventListener('click',e=>{if(e.target.id==='modalRoot')closeModal()});window.addEventListener('popstate',()=>render());
render();
})();
</script>
