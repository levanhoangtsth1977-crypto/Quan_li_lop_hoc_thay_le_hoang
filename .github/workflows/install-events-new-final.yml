name: Install Events New Final
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old event modules and inject new final module
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for pat in [
            r'<script[^>]+src=["\'][^"\']*violations-menu-fix[^"\']*["\'][^>]*></script>\s*',
            r'<script[^>]+src=["\'][^"\']*event-delete[^"\']*["\'][^>]*></script>\s*',
            r'<script[^>]+src=["\'][^"\']*event-summary-by-student-fix[^"\']*["\'][^>]*></script>\s*',
            r'<script[^>]+src=["\'][^"\']*(reward|rewards|khen-thuong)[^"\']*["\'][^>]*></script>\s*'
          ]:
              s=re.sub(pat,'',s,flags=re.I)
          tag='<script src="events-new-final.js?v=20260825"></script>'
          s=re.sub(r'<script[^>]+src=["\']events-new-final\.js(?:\?[^"\']*)?["\'][^>]*></script>\s*','',s,flags=re.I)
          s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then echo 'No index change needed.'; else git commit -m 'Install new Vi Pham and Khen Thuong menus'; git push origin HEAD:master; fi