name: Activate canonical student links

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add canonical student-link loader to index
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="/student-links-canonical.js?v=20260918.1"></script>'
          if tag not in text:
              pos = text.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('Không tìm thấy </body> trong index.html')
              text = text[:pos] + '\n' + tag + '\n' + text[pos:]
              p.write_text(text, encoding='utf-8')
          else:
              print('Loader đã có, không thay đổi index.html.')

      - name: Commit patch and remove one-time workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm -f .github/workflows/patch-index-student-links.yml
          if git diff --cached --quiet; then
            echo 'Không có thay đổi.'
            exit 0
          fi
          git commit -m 'fix: activate canonical student profile links'
          git push
