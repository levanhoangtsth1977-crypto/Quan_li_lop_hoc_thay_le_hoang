name: one-time profile reconcile

on:
  push:
    branches: [master]

jobs:
  patch:
    if: "!contains(github.event.head_commit.message, '[profile-reconcile]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Add one-time existing-data reconciliation
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          old="let D=read();const migration=migrateLegacyProfiles(false);"
          new="""let D=read();const migration=migrateLegacyProfiles(false);
          const __LH_RECONCILE_MARK='LH_CANONICAL_GOOGLE_RECONCILED_2026_2027';
          async function __lhReconcileExisting(){
            try{
              if(localStorage.getItem(__LH_RECONCILE_MARK)==='1')return;
              const jobs=[
                ['VI_PHAM',D.violations||[]],
                ['KHEN_THUONG',D.rewards||[]],
                ['DIEM_DANH',D.attendance||[]],
                ['TIEN_BO',D.progress||[]],
                ['NHAN_XET',D.comments||[]],
                ['HOC_TAP',Object.values(D.learning||{}).flat()]
              ];
              let total=0;
              for(const [sheet,rows] of jobs){
                if(!rows.length)continue;
                await __lhSyncMany(sheet,rows);
                total+=rows.length;
              }
              localStorage.setItem(__LH_RECONCILE_MARK,'1');
              if(total)toast('Đã đồng bộ dữ liệu hồ sơ hiện có lên Google Sheets.');
            }catch(e){console.warn('[canonical reconcile]',e?.message||e)}
          }
          void __lhReconcileExisting();"""
          # normalize workflow indentation from the triple-quoted patch
          new='\n'.join(line[10:] if line.startswith('          ') else line for line in new.splitlines())
          if old not in s: raise SystemExit('ANCHOR_RECONCILE_NOT_FOUND')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit reconcile patch and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git rm .github/workflows/one-time-profile-reconcile.yml
          git add index.html
          git commit -m "fix: reconcile existing profile data to Google [profile-reconcile]"
          git push
