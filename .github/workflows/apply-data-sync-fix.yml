name: Apply data sync fix

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  inject-fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inject fix script into index
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="data-sync-vietnamese-fix.js?v=1.0.0"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('Không tìm thấy </body> trong index.html')
              s = s.replace(marker, tag + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')
          else:
              print('Fix script đã được nạp.')
          PY

      - name: Commit and push
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Không có thay đổi cần commit."
          else
            git commit -m "fix: nạp module đồng bộ và Việt hóa dữ liệu"
            git push
          fi
