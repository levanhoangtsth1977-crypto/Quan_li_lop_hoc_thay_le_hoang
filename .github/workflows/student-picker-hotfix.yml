name: Inject student picker V3

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject cache-busted picker script
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          tag = '<script src="student-picker-v3.js?v=20260913-01"></script>'
          html = re.sub(r'\s*<script[^>]+src=["\']student-picker-v3\.js(?:\?[^"\']*)?["\'][^>]*></script>', '', html, flags=re.I)
          if tag not in html:
              pos = html.lower().rfind('</body>')
              if pos < 0:
                  raise SystemExit('Missing </body> in index.html')
              html = html[:pos] + '\n    ' + tag + '\n' + html[pos:]
          p.write_text(html, encoding='utf-8')

      - name: Commit injected script tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No index.html change needed"
            exit 0
          fi
          git commit -m "Load student picker V3 with cache busting"
          git push
