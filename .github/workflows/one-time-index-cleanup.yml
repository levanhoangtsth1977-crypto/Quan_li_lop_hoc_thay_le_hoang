name: One-time index script cleanup

on:
  push:
    branches: [system-integrity-cleanup-20260916]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove retired script references and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          retired = {
              'ui-complete-fix.js',
              'ui-action-patch.js',
              'student-sync-dedupe.js',
              'data-sync-vietnamese-fix.js',
              'google-sheets-records-bridge.js',
              'google-sheets-auto-sync.js',
              'google-sheets-bulk-reconcile.js',
              'statistics-excellent.js',
              'events-fixed-static.js',
              'vong-quay-may-man.js',
              'vong-quay-may-man-fix.js',
              'attendance-status-final-fix.js',
              'student-links-fix.js',
              'event-save-jsonp-fix.js',
              'violation-save-repair.js',
              'student-picker-v3.js',
              'behavior-save-hardfix.js',
              'clear-targeted-violations-20260908.js',
              'site-integrity-guard.js',
          }

          before = text
          for name in retired:
              text = re.sub(r'^[ \t]*<script[^>]+src=["\'][^"\']*' + re.escape(name) + r'[^"\']*["\'][^>]*></script>\r?\n?', '', text, flags=re.I|re.M)

          text, changed = re.subn(
              r'(<script[^>]+src=["\']menu-runtime-fix\.js)(?:\?[^"\']*)?(["\'])',
              r'\1?v=9.3.0\2',
              text,
              count=1,
              flags=re.I,
          )

          if before == text:
              print('No index cleanup changes were necessary.')
          else:
              path.write_text(text, encoding='utf-8')
              print('Index cleanup applied.')

          for name in retired:
              if re.search(r'<script[^>]+src=["\'][^"\']*' + re.escape(name) + r'[^"\']*["\']', text, flags=re.I):
                  raise SystemExit(f'Retired script still referenced: {name}')

          print('Retired script references are absent from index.html.')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Remove retired script references from index'
            git push
          fi

          git rm .github/workflows/one-time-index-cleanup.yml
          git commit -m 'Remove one-time cleanup workflow'
          git push
