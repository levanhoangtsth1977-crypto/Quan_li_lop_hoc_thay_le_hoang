name: Fix utilities page order
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  reorder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move classroom layout above student list
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tien-ich.html')
          s = p.read_text(encoding='utf-8')
          old = '<div id="preview"></div><div id="layout"'
          new = '<div id="layout"'
          if old in s:
              s = s.replace(old, new, 1)
              marker = '</div></div><script>'
              if marker in s:
                  # Put preview after the layout container by adding it before the script.
                  s = s.replace(marker, '</div><div id="preview"></div></div><script>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit if changed
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tien-ich.html
          git diff --cached --quiet || git commit -m 'Put classroom layout above student list'
          git push
