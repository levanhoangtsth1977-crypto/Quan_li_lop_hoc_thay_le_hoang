name: Load event summary fix
on:
  push:
    branches:
      - '**'
permissions:
  contents: write
jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject latest event summary script
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'<script[^>]+src=["\']event-summary-by-student-fix\.js[^>]*></script>\s*', '', s, flags=re.I)
          tag = '<script src="event-summary-by-student-fix.js?v=4.0"></script>\n'
          if '</body>' not in s:
              raise SystemExit('Không tìm thấy </body> trong index.html')
          s = s.replace('</body>', tag + '</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          if ! git diff --quiet -- index.html; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add index.html
            git commit -m "Load event summary fix 4.0"
            git push
          fi
