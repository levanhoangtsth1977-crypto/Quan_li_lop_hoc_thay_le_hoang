name: Install excellent statistics UI

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject statistics script once
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="statistics-excellent.js"></script>'
          if tag not in s:
              marker = '</body>'
              if marker not in s:
                  raise SystemExit('Không tìm thấy </body> trong index.html')
              s = s.replace(marker, '    ' + tag + '\n' + marker, 1)
              p.write_text(s, encoding='utf-8')

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "feat: enable excellent student statistics UI"
            git push
          fi
