name: Enable preboot router

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  enable-preboot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Insert preboot router once
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="early-core-router.js?v=1.0"></script>'
          target = '<script src="script.js?v=4.1.1"></script>'
          if marker not in s and target in s:
              s = s.replace(target, marker + '\n' + target, 1)
              p.write_text(s, encoding='utf-8')
          PY

      - name: Install canonical delete menu module
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="/event-delete-menu-patch.js"></script>'
          # Remove every stale copy first, then place exactly one copy
          # immediately after the final application </script> and before </body>.
          s = s.replace(marker, '')
          last_script = s.rfind('</script>')
          body = s.rfind('</body>')
          if last_script < 0 or body < 0 or last_script > body:
              raise SystemExit('Không xác định được </script> cuối và </body> trong index.html')
          s = s[:last_script + len('</script>')] + '\n' + marker + s[body:]
          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate delete menu placement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          marker = '<script src="/event-delete-menu-patch.js"></script>'
          pos = s.find(marker)
          if s.count(marker) != 1:
              raise SystemExit(f'Delete menu include count: {s.count(marker)}')
          last_script = s.rfind('</script>', 0, pos + 1)
          body = s.find('</body>', pos)
          if last_script < 0 or body < 0 or not (last_script < pos < body):
              raise SystemExit('Delete menu include không nằm sau script chính và trước </body>.')
          print('Delete menu include placement OK')
          PY

      - name: Validate JavaScript syntax for delete module
        shell: bash
        run: |
          set -euo pipefail
          node --check event-delete-menu-patch.js

      - name: Commit index change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'No index change needed.'
            exit 0
          fi
          git commit -m 'fix: attach violation and reward delete menu'
          git push origin HEAD:master
