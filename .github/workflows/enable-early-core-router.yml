name: Enable preboot router

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  enable-preboot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Canonicalize index tail and attach delete menu
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="/event-delete-menu-patch.js"></script>'
          end_marker = '})();'
          end = s.rfind(end_marker)
          if end < 0:
              raise SystemExit('Không tìm thấy điểm kết thúc IIFE của ứng dụng trong index.html')
          # Keep the complete application through its final IIFE, then replace
          # any malformed tail with one canonical script/body/html sequence.
          prefix = s[:end + len(end_marker)]
          tail = '\n</script>\n' + marker + '\n</body>\n</html>\n'
          s = prefix + tail
          p.write_text(s, encoding='utf-8')
          print('Canonical index tail written')
          PY

      - name: Validate canonical index tail
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          marker = '<script src="/event-delete-menu-patch.js"></script>'
          expected = '\n</script>\n' + marker + '\n</body>\n</html>\n'
          if not s.endswith(expected):
              raise SystemExit('Đuôi index.html chưa ở dạng canonical')
          if s.count(marker) != 1:
              raise SystemExit(f'Số module delete: {s.count(marker)}')
          print('Canonical index tail OK')
          PY

      - name: Validate JavaScript syntax for delete module
        shell: bash
        run: |
          set -euo pipefail
          node --check event-delete-menu-patch.js

      - name: Commit canonical index
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Index already canonical.'
            exit 0
          fi
          git commit -m 'fix: canonicalize index tail for event delete menu'
          git push origin HEAD:master
