name: Install emergency menu router
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject emergency router v2
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script\b[^>]*src=["\'][^"\']*emergency-menu-router\.js(?:\?v=[^"\']*)?["\'][^>]*></script>\s*','',s,flags=re.I)
          s=s.replace('</body>','<script src="emergency-menu-router.js?v=20260825-v2"></script>\n</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify
        shell: bash
        run: |
          set -e
          test "$(grep -o 'emergency-menu-router.js?v=20260825-v2' index.html | wc -l | tr -d ' ')" = "1"
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m "Refresh emergency menu router cache version" && git push origin HEAD:master)
