name: Install final statistics UI
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install final statistics module
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script[^>]+src=["\']thong-ke-xuat-sac(?:-final)?\.js[^>]*></script>\s*','',s,flags=re.I)
          tag='<script src="thong-ke-xuat-sac-final.js?v=20260823"></script>'
          s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m "Install final statistics UI" && git push)
