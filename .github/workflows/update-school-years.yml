name: Update school year selector

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add school years to common selector
        shell: python
        run: |
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text(encoding="utf-8")
          old = '''            <select id="schoolYearSelect">\n                <option value="2026-2027">2026–2027</option>\n            </select>'''
          new = '''            <select id="schoolYearSelect">\n                <option value="2026-2027">2026–2027</option>\n                <option value="2027-2028">2027–2028</option>\n                <option value="2028-2029">2028–2029</option>\n                <option value="2029-2030">2029–2030</option>\n                <option value="2030-2031">2030–2031</option>\n                <option value="2031-2032">2031–2032</option>\n                <option value="2032-2033">2032–2033</option>\n                <option value="2033-2034">2033–2034</option>\n                <option value="2034-2035">2034–2035</option>\n                <option value="2035-2036">2035–2036</option>\n            </select>'''
          if old not in s:
              raise SystemExit("Expected selector block not found; no change made.")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")

      - name: Commit result and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-school-years.yml
          git rm .github/workflows/update-school-years.yml
          git commit -m "Add future school years to selector"
          git push
