name: Load Google Sheets Bulk Reconcile
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inject bulk reconcile script
        shell: python
        run: |
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          tag='<script src="google-sheets-bulk-reconcile.js?v=2.0"></script>'
          if tag not in text:
              marker='</body>'
              if marker not in text: raise SystemExit('Không tìm thấy </body>')
              text=text.replace(marker,'    '+tag+'\n'+marker,1)
              p.write_text(text,encoding='utf-8')
              print('BULK_RECONCILE_ATTACHED')
          else:
              print('BULK_RECONCILE_ALREADY_ATTACHED')
      - name: Commit
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: load bulk Google Sheets event reconciliation'
          git push
