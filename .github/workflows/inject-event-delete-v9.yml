name: Load event delete v16
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject delete fix v16
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          # Remove all copies of the delete-event module and the legacy compat override.
          s=re.sub(r'<script[^>]+event-delete-v9\.js[^>]*></script>\s*','',s)
          s=re.sub(r'<script[^>]+delete-event-compat-fix\.js[^>]*></script>\s*','',s)
          # Remove any accidental duplicate copies of these modules.
          s=re.sub(r'<script[^>]+event-delete-v9\.js[^>]*></script>\s*','',s)
          s=re.sub(r'<script[^>]+delete-event-compat-fix\.js[^>]*></script>\s*','',s)
          marker='<script src="event-delete-v9.js?v=16.0"></script>\n'
          s=s.replace('</body>',marker+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if ! git diff --cached --quiet; then git commit -m "fix: load universal delete v16 only"; git push; fi