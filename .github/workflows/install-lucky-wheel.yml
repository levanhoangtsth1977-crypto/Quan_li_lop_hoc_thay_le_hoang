name: Install Lucky Wheel

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject lucky wheel script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="vong-quay-may-man.js"></script>'
          if tag not in text:
              marker = '<script src="script.js"></script>'
              if marker in text:
                  text = text.replace(marker, marker + '\n    ' + tag, 1)
              elif '</body>' in text:
                  text = text.replace('</body>', '    ' + tag + '\n</body>', 1)
              else:
                  text += '\n' + tag + '\n'
              p.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "Lucky wheel already installed"
          else
            git commit -m "Tích hợp menu Vòng quay may mắn"
            git push
          fi
