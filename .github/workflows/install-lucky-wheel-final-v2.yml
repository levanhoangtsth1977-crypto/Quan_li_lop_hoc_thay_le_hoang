name: Install Lucky Wheel Final V2
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace old lucky wheel scripts with final engine
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script\b[^>]*src=["\'][^"\']*(?:vong-quay-may-man(?:-fix)?|lucky-wheel-final)\.js[^"\']*["\'][^>]*></script>\s*','',s,flags=re.I)
          tag='<script src="lucky-wheel-final.js?v=20260825-final2"></script>\n'
          s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify
        shell: bash
        run: |
          set -e
          test "$(grep -o 'lucky-wheel-final.js?v=20260825-final2' index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'vong-quay-may-man.js' index.html | wc -l | tr -d ' ')" = "0"
          test "$(grep -o 'vong-quay-may-man-fix.js' index.html | wc -l | tr -d ' ')" = "0"
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install standalone lucky wheel final engine"
          git push origin HEAD:master
