name: Inject event delete menu

on:
  push:
    branches: [master]
    paths:
      - event-delete-menu-patch.js
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Inject one canonical script include into index.html
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          marker = '<script src="/event-delete-menu-patch.js"></script>'
          if marker in html:
              print('Delete-menu patch already loaded; no change needed.')
              raise SystemExit(0)
          anchor = '})();'
          pos = html.rfind(anchor)
          if pos < 0:
              raise SystemExit('Không tìm thấy điểm kết thúc ứng dụng trong index.html')
          end = pos + len(anchor)
          html = html[:end] + '\n' + marker + '\n</body>\n</html>\n' + html[end:]
          p.write_text(html, encoding='utf-8')
          print('Injected:', marker)
          PY

      - name: Commit index change and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -f .github/workflows/inject-event-delete-menu.yml
          git add index.html event-delete-menu-patch.js
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'fix: add delete buttons to violations and rewards menus'
          git push origin HEAD:master
