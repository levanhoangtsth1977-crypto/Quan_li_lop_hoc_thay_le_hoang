name: Load utilities and delete compatibility fix
on:
  push:
    branches:
      - master
permissions:
  contents: write
jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject scripts into index
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tags=[
            '<script src="delete-event-compat-fix.js?v=1.0"></script>',
            '<script src="tien-ich.js?v=1.0"></script>'
          ]
          marker='</body>'
          for tag in tags:
              if tag not in s:
                  s=s.replace(marker,tag+'\n'+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Load delete compatibility and Tiện ích menu"
            git push
          fi