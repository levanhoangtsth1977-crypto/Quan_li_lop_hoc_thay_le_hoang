name: Load utilities and delete compatibility fix
on:
  push:
    branches:
      - master
permissions:
  contents: write
jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject current utility and delete scripts
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script\s+src=["\']tien-ich\.js(?:\?v=[^"\']*)?["\']\s*></script>', '<script src="tien-ich.js?v=5.0"></script>', s)
          if '<script src="tien-ich.js?v=5.0"></script>' not in s:
              s=s.replace('</body>','<script src="tien-ich.js?v=5.0"></script>\n</body>',1)
          if '<script src="delete-event-compat-fix.js?v=1.0"></script>' not in s:
              s=s.replace('</body>','<script src="delete-event-compat-fix.js?v=1.0"></script>\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if ! git diff --quiet -- index.html; then
            git add index.html
            git commit -m "Load Tiện ích V5 and refresh cache"
            git push
          fi