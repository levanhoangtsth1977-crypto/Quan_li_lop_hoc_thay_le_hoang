name: Fix delete-all buttons
on:
  push:
    paths:
      - '.github/workflows/fix-delete-all.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch delete-all UI
        shell: python
        run: |
          from pathlib import Path
          api = 'https://script.google.com/macros/s/AKfycbxTPwf-jhrR8JOoKY5ZLuzlsDgcv3nWILtDPTrYNWZCEPpm2rkpXTn-sPAdFaUyy0z_uw/exec'
          p = Path('violations-menu-fix.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace("function apiUrl(){\n  return window.GAS_API_URL || window.API_URL || window.SCRIPT_URL || window.GOOGLE_APPS_SCRIPT_URL || '';\n}", "function apiUrl(){ return '" + api + "'; }")
          s = s.replace("function injectDeleteAllButton(){", "function injectDeleteAllButton(){ return; // disabled: final bridge below is the single source of truth\n")
          s = s.replace("const API=()=>window.GAS_API_URL||window.API_URL||window.SCRIPT_URL||window.GOOGLE_APPS_SCRIPT_URL||'';", "const API=()=>\"" + api + "\";")
          p.write_text(s, encoding='utf-8')
          q = Path('event-delete-all-ui.js')
          q.write_text("""/* DELETE-ALL UI compatibility layer.\n   The final buttons are owned by violations-menu-fix.js.\n   This file only removes legacy duplicate buttons.\n*/\n(function(){\n  'use strict';\n  function cleanup(){\n    ['btnDeleteAllViolations','btnDeleteAllRewards','lhDeleteAllViolations'].forEach(function(id){\n      var el=document.getElementById(id);\n      if(el) el.remove();\n    });\n  }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',cleanup,{once:true}); else cleanup();\n  new MutationObserver(cleanup).observe(document.documentElement,{childList:true,subtree:true});\n})();\n""", encoding='utf-8')
      - name: Commit fixes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add violations-menu-fix.js event-delete-all-ui.js
          git diff --cached --quiet && exit 0
          git commit -m 'fix: single delete-all buttons with GAS endpoint'
          git push