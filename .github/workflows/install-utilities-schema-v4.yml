name: Install utilities schema v4
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install schema fix
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script\b[^>]*src=["\'][^"\']*tien-ich-schema-v4-fix\.js[^"\']*["\'][^>]*></script>\s*','',s,flags=re.I)
          tag='<script src="tien-ich-schema-v4-fix.js?v=20260825-v4"></script>\n'
          s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify
        shell: bash
        run: |
          set -e
          test "$(grep -o 'tien-ich-schema-v4-fix.js?v=20260825-v4' index.html | wc -l | tr -d ' ')" = "1"
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install utilities upload schema v4"
          git push origin HEAD:master
