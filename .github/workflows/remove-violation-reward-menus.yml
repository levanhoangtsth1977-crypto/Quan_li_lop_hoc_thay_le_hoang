name: Remove Vi Pham and Khen Thuong menus
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install removal module
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          import re
          tag='<script src="remove-violation-reward-menus.js?v=20260825"></script>'
          s=re.sub(r'<script\s+src=["\']remove-violation-reward-menus\.js(?:\?[^"\']*)?["\']\s*></script>\s*','',s,flags=re.I)
          s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Remove Vi Pham and Khen Thuong menus"
          git push origin HEAD:master
