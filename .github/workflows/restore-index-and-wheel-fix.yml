name: Restore Index and Install Lucky Wheel Fix
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore verified good index and add wheel fix
        shell: bash
        run: |
          git checkout 7ef6e13737b7fb481e992c63082624709e870087 -- index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script\s+src=["\']vong-quay-may-man-fix\.js(?:\?[^"\']*)?["\']\s*></script>\s*','',s,flags=re.I)
          tag='<script src="vong-quay-may-man-fix.js?v=20260825"></script>'
          if '</body>' not in s:
              raise SystemExit('index.html missing </body>')
          s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git commit -m 'Restore verified index and install wheel fix'
          git push origin HEAD:master
