name: Install final direct menu controller
on:
  push:
    branches: [master]
permissions:
  contents: write
jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject final controllers
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script\b[^>]*src=["\'][^"\']*menu-final-direct\.js[^"\']*["\'][^>]*></script>\s*','',s,flags=re.I)
          s=re.sub(r'<script\b[^>]*src=["\'][^"\']*menu-special-fix\.js[^"\']*["\'][^>]*></script>\s*','',s,flags=re.I)
          tag='<script src="menu-final-direct.js?v=20260825-final"></script>\n<script src="menu-special-fix.js?v=20260825-special1"></script>\n'
          s=s.replace('</body>',tag+'</body>',1)
          p.write_text(s,encoding='utf-8')
      - name: Verify
        shell: bash
        run: |
          set -e
          test "$(grep -o 'menu-final-direct.js?v=20260825-final' index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -o 'menu-special-fix.js?v=20260825-special1' index.html | wc -l | tr -d ' ')" = "1"
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install final special menu controller"
          git push origin HEAD:master
