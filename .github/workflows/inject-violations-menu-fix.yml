name: Inject Vi Pham Menu Fix

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - name: Force activate latest Vi Pham menu module
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          import re
          # Remove every previous injection of this module, regardless of version.
          s = re.sub(r'<script\s+src=["\']violations-menu-fix\.js(?:\?[^"\']*)?["\']\s*></script>\s*', '', s, flags=re.I)
          # Add the current module after script.js so it runs after the main app code.
          tag = '<script src="violations-menu-fix.js?v=2.0"></script>'
          needle = '<script src="script.js"></script>'
          if needle in s:
              s = s.replace(needle, needle + '\n' + tag, 1)
          else:
              s = s.replace('</body>', tag + '\n</body>', 1)
          p.write_text(s, encoding='utf-8')
          PY

      - name: Verify module is injected exactly once
        shell: bash
        run: |
          set -e
          test "$(grep -o 'violations-menu-fix.js?v=2.0' index.html | wc -l | tr -d ' ')" = "1"

      - name: Commit activation change only
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- index.html; then
            echo 'No change needed.'
            exit 0
          fi
          git add index.html
          git commit -m 'fix: force latest Vi Pham menu module'
          git push origin HEAD:master
