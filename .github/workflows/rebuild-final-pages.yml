name: Rebuild final static pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore known-good index and install stable pages
        shell: bash
        run: |
          set -e
          git checkout 7ef6e13737b7fb481e992c63082624709e870087 -- index.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          for pat in [
              r'<script[^>]+src=["\'][^"\']*events-new-final\.js[^"\']*["\'][^>]*></script>\s*',
              r'<script[^>]+src=["\'][^"\']*events-fixed-static\.js[^"\']*["\'][^>]*></script>\s*',
              r'<script[^>]+src=["\'][^"\']*vong-quay-may-man(?:-fix)?\.js[^"\']*["\'][^>]*></script>\s*',
              r'<script[^>]+src=["\'][^"\']*lucky-wheel-final\.js[^"\']*["\'][^>]*></script>\s*',
              r'<script[^>]+src=["\'][^"\']*emergency-menu-router\.js[^"\']*["\'][^>]*></script>\s*',
              r'<script[^>]+src=["\'][^"\']*menu-final-direct\.js[^"\']*["\'][^>]*></script>\s*'
          ]:
              s=re.sub(pat,'',s,flags=re.I)
          menu='<button type="button" class="menu-item" data-page="lucky-wheel" id="lhLuckyWheelStatic"><i class="fa-solid fa-dharmachakra"></i><span>Vòng quay may mắn</span></button>'
          if 'id="lhLuckyWheelStatic"' not in s:
              s=s.replace('<button type="button" class="menu-item" data-page="settings">', menu+'<button type="button" class="menu-item" data-page="settings">',1)
          lucky='''<section class="page-section" id="page-lucky-wheel" data-page-section="lucky-wheel"><div class="page-header"><div><span class="page-eyebrow"><i class="fa-solid fa-dharmachakra"></i> Hoạt động lớp học</span><h1>🎡 Vòng quay may mắn</h1><p>Gọi ngẫu nhiên học sinh. Không thay đổi dữ liệu gốc.</p></div></div><div class="lh-wheel-panel"><div class="lh-wheel-controls"><label>Phạm vi chọn<select id="lhWheelScope"><option value="all">👥 Toàn lớp</option><option value="to1">Tổ 1</option><option value="to2">Tổ 2</option><option value="to3">Tổ 3</option><option value="to4">Tổ 4</option></select></label><button type="button" class="button secondary" id="lhWheelReset">Vòng mới</button></div><div class="lh-wheel-stage"><div class="lh-wheel-circle"><div class="lh-wheel-pointer">▼</div><div class="lh-wheel-center">🎡</div></div><div class="lh-wheel-result"><div class="lh-wheel-caption">HỌC SINH ĐƯỢC CHỌN</div><div class="lh-wheel-name" id="lhWheelName">SẴN SÀNG</div><div class="lh-wheel-sub" id="lhWheelSub">Nhấn “QUAY NGAY” để chọn học sinh</div><button type="button" class="button primary lh-wheel-spin" id="lhWheelSpin">🎯 QUAY NGAY</button><div class="lh-wheel-count" id="lhWheelCount">Đã gọi 0/0 học sinh</div></div></div><div class="lh-wheel-called-wrap"><div class="lh-wheel-called-head"><b>Danh sách đã gọi</b><span>Không lặp trong cùng một vòng</span></div><div id="lhWheelCalled" class="lh-wheel-called"><div class="lh-wheel-empty">Chưa gọi học sinh nào.</div></div></div></div></section>'''
          if 'id="page-lucky-wheel"' not in s:
              s=s.replace('<section class="page-section" id="page-learning"',lucky+'\n            <section class="page-section" id="page-learning"',1)
          tags=['<script src="events-fixed-static.js?v=20260825"></script>','<script src="vong-quay-may-man.js?v=20260825"></script>','<script src="vong-quay-may-man-fix.js?v=20260825"></script>']
          for tag in tags:
              src=tag.split('src="',1)[1].split('"',1)[0]
              s=s.replace('</body>',tag+'\n</body>',1)
          direct=r'''<script id="lh-inline-menu-final">(function(){'use strict';function go(p){var t=document.querySelector('[data-page-section="'+p+'"]');if(!t)return false;document.querySelectorAll('[data-page-section]').forEach(function(x){x.classList.remove('active');x.hidden=true});t.classList.add('active');t.hidden=false;document.querySelectorAll('.menu-item[data-page]').forEach(function(b){b.classList.toggle('active',b.dataset.page===p)});var q=document.getElementById('pageTitle');if(q){var m={dashboard:'Trang chủ',students:'Học sinh',attendance:'Điểm danh',violations:'Vi phạm',rewards:'Khen thưởng',learning:'Học tập',comments:'Nhận xét',statistics:'Thống kê','student-links':'Link học sinh',ai:'AI giáo viên','lucky-wheel':'Vòng quay may mắn',settings:'Cài đặt'};q.textContent=m[p]||p}var s=document.getElementById('sidebar'),o=document.getElementById('sidebarOverlay');if(window.innerWidth<=900){if(s)s.classList.remove('open');if(o)o.style.display='none'}if(p==='lucky-wheel')window.dispatchEvent(new Event('pagechange'));return true}document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('.main-menu .menu-item[data-page]');if(!b)return;var p=b.dataset.page;if(document.querySelector('[data-page-section="'+p+'"]')){e.preventDefault();e.stopImmediatePropagation();go(p)}},true);document.addEventListener('DOMContentLoaded',function(){var s=document.getElementById('sidebar');var o=document.getElementById('sidebarOverlay');var t=document.getElementById('sidebarToggle');if(t)t.onclick=function(e){e.preventDefault();e.stopImmediatePropagation();if(s){s.classList.toggle('open');if(s.classList.contains('open')&&o)o.style.display='none'}};if(o)o.style.display='none'});})();</script>'''
          s=s.replace('</body>',direct+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          grep -q 'id="page-violations"' index.html
          grep -q 'id="page-rewards"' index.html
          grep -q 'id="page-lucky-wheel"' index.html
          grep -q 'lh-inline-menu-final' index.html
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet || (git commit -m "Rebuild stable pages with direct inline menu router" && git push origin HEAD:master)
