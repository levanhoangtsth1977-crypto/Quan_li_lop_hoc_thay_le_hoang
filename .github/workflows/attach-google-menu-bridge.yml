name: Attach Google Sheets Bridges

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  attach-bridges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure Google Sheets bridges are loaded by index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tags = [
              '<script src="google-sheets-menu-bridge.js"></script>',
              '<script src="google-sheets-records-bridge.js"></script>',
          ]
          marker = '</body>'
          if marker not in text:
              raise SystemExit('index.html không có </body>; dừng để tránh sửa sai cấu trúc.')
          changed = False
          for tag in tags:
              if tag not in text:
                  text = text.replace(marker, '    ' + tag + '\n' + marker, 1)
                  changed = True
          if changed:
              p.write_text(text, encoding='utf-8')
              print('BRIDGES_ATTACHED')
          else:
              print('BRIDGES_ALREADY_ATTACHED')

      - name: Commit bridge attachment
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'Không có thay đổi.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: load Google Sheets event records bridge'
          git push
