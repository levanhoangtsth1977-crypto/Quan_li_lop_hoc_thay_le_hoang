name: Attach Google Sheets Menu Bridge

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  attach-bridge:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure bridge script is loaded by index.html
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          tag = '<script src="google-sheets-menu-bridge.js"></script>'
          if tag not in text:
              marker = '</body>'
              if marker not in text:
                  raise SystemExit('index.html không có </body>; dừng để tránh sửa sai cấu trúc.')
              text = text.replace(marker, '    ' + tag + '\n' + marker, 1)
              p.write_text(text, encoding='utf-8')
              print('BRIDGE_ATTACHED')
          else:
              print('BRIDGE_ALREADY_ATTACHED')

      - name: Commit bridge attachment
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo 'Không có thay đổi.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: load Google Sheets menu bridge'
          git push
