name: Restore core menu and standalone utilities

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove conflicting UI/event layers and install safe picker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          patterns=[
            r'menu-final-direct\\.js',
            r'menu-special-fix\\.js',
            r'emergency-menu-router\\.js',
            r'tien-ich-final\\.js',
            r'tien-ich-schema-v4-fix\\.js',
            r'event-sync-multi-v21\\.js',
            r'event-ui-stability-v214\\.js',
            r'dashboard-legacy-events-cleanup\\.js'
          ]
          for pat in patterns:
            s=re.sub(r'<script\\b[^>]*src=["\\\'][^"\\\']*'+pat+r'[^"\\\']*["\\\'][^>]*></script>\\s*','',s,flags=re.I)
          # Keep exactly one standalone utilities link.
          s=re.sub(r'<a[^>]*id=["\\\'][^"\\\']*(?:lhUtilitiesStandalone|lhStandaloneUtilities)[^"\\\']*["\\\'][^>]*>.*?</a>\\s*','',s,flags=re.I|re.S)
          link='<a class="menu-item" id="lhUtilitiesStandalone" href="tien-ich.html"><i class="fa-solid fa-toolbox"></i><span>Tiện ích</span></a>'
          marker='<button type="button" class="menu-item" data-page="settings">'
          s=s.replace(marker,link+'\\n'+marker,1) if marker in s else s.replace('</nav>',link+'\\n</nav>',1)
          tag='<script src="safe-student-picker.js?v=1.0.0"></script>\\n'
          # Ensure one safe picker script.
          s=re.sub(r'<script\\b[^>]*src=["\\\'][^"\\\']*safe-student-picker\\.js[^"\\\']*["\\\'][^>]*></script>\\s*','',s,flags=re.I)
          s=s.replace('</body>',tag+'</body>',1) if '</body>' in s else s+tag
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify
        shell: bash
        run: |
          set -e
          test "$(grep -oi 'tien-ich.html' index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -oi 'safe-student-picker.js' index.html | wc -l | tr -d ' ')" = "1"
          ! grep -qi 'event-sync-multi-v21.js' index.html
          ! grep -qi 'event-ui-stability-v214.js' index.html
          ! grep -qi 'menu-final-direct.js' index.html
          ! grep -qi 'menu-special-fix.js' index.html
          ! grep -qi 'emergency-menu-router.js' index.html
          ! grep -qi 'tien-ich-final.js' index.html
          ! grep -qi 'tien-ich-schema-v4-fix.js' index.html

      - name: Commit normalized index
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore core menus and isolate student picker"
          git push origin HEAD:master
