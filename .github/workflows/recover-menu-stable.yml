name: Verify canonical class-management app

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical menus, student links and modules
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f student-profile-v5.html
          test -f student-links-canonical.js
          test -f api/student-data.js
          test -f api/google.js

          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re
          from html.parser import HTMLParser

          html = Path('index.html').read_text(encoding='utf-8')
          required = [
              'home','students','profiles','attendance','violations','rewards',
              'learning','progress','comments','links','millionaire','ai','settings'
          ]

          nav = re.findall(r'data-nav="([^"]+)"', html)
          counts = Counter(nav)
          bad = [x for x in required if counts[x] != 1]
          if bad:
              raise SystemExit(f'data-nav missing/duplicate: {bad}')

          if '<script src="/student-links-canonical.js?v=20260918.1"></script>' not in html:
              raise SystemExit('Canonical student-link loader missing')
          if html.count('student-links-canonical.js') != 1:
              raise SystemExit('Student-link loader duplicated')
          if html.count('event-delete-menu-patch.js') != 1:
              raise SystemExit('Delete-menu module count is not exactly 1')
          if 'jsonp(' in html:
              raise SystemExit('Obsolete jsonp() call remains in index.html')
          if "fetch('/api/google?action=get_students&_='+Date.now()" not in html:
              raise SystemExit('Canonical Google student roster fetch missing')
          if 'student-profile-v5.html?t=' not in html:
              raise SystemExit('Student profile link generator missing')
          if '5C' in html or '5c' in html:
              raise SystemExit('Legacy class 5C found in index.html')

          # Ensure there is exactly one student-link action and one renderer.
          if html.count('data-action="generate-links"') != 1:
              raise SystemExit('generate-links action missing/duplicated')
          if html.count('function fillLinks()') != 1:
              raise SystemExit('fillLinks() missing/duplicated')

          print('Canonical menu/link integrity OK')

          class P(HTMLParser):
              VOID = {'meta','link','input','img','br','hr','source','area','base','embed','param','track','wbr'}
              def __init__(self):
                  super().__init__()
                  self.stack=[]
              def handle_starttag(self, tag, attrs):
                  if tag not in self.VOID:
                      self.stack.append(tag)
              def handle_endtag(self, tag):
                  if tag in self.VOID:
                      return
                  if not self.stack or self.stack[-1] != tag:
                      raise SystemExit(f'HTML nesting mismatch at </{tag}>')
                  self.stack.pop()

          p = P()
          p.feed(html)
          p.close()
          if p.stack:
              raise SystemExit(f'Unclosed HTML tags: {p.stack[-10:]}')
          print('HTML nesting OK')
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check student-links-canonical.js
          node --check api/student-data.js
          node --check api/google.js
          node --check event-delete-menu-patch.js
          echo "JavaScript syntax OK"
