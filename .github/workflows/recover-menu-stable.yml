name: Verify core menu integrity

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate menu, sections, internal links and module wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f menu-runtime-fix.js

          python - <<'PY'
          from pathlib import Path
          from collections import Counter
          import re
          from html.parser import HTMLParser

          html = Path('index.html').read_text(encoding='utf-8')
          runtime = Path('menu-runtime-fix.js').read_text(encoding='utf-8')
          required = [
              'dashboard','students','attendance','violations','rewards','learning',
              'statistics','student-links','ai','lucky-wheel','settings'
          ]

          # One and only one canonical menu route per required page.
          routes = re.findall(r'data-page=["\']([^"\']+)', html)
          counts = Counter(routes)
          missing = [x for x in required if counts[x] != 1]
          extras = sorted(set(routes) - set(required))
          if missing:
              raise SystemExit(f'data-page missing/duplicate: {missing}')
          if extras:
              raise SystemExit(f'data-page invalid: {extras}')

          # One and only one section for every menu route.
          sections = re.findall(r'data-page-section=["\']([^"\']+)', html)
          section_ids = re.findall(r'id=["\']page-([^"\']+)["\']', html)
          for page in required:
              if sections.count(page) != 1:
                  raise SystemExit(f'data-page-section missing/duplicate: {page}: {sections.count(page)}')
              if section_ids.count(page) != 1:
                  raise SystemExit(f'page section id missing/duplicate: {page}: {section_ids.count(page)}')

          # Internal SPA links must point to a canonical page.
          links = re.findall(r'data-page-link=["\']([^"\']+)', html)
          bad_links = sorted(set(links) - set(required))
          if bad_links:
              raise SystemExit(f'data-page-link invalid: {bad_links}')

          # Standalone utilities link must remain an actual file link.
          hrefs = re.findall(r'href=["\']([^"\']+)', html)
          if 'tien-ich.html' not in hrefs:
              raise SystemExit('Standalone Tiện ích link missing')
          if not Path('tien-ich.html').is_file():
              raise SystemExit('tien-ich.html missing')

          # Static script includes: no duplicate exact JS/CSS paths in index.html.
          scripts = re.findall(r'<script[^>]+src=["\']([^"\']+)', html, flags=re.I)
          for label, values in [
              ('JS', scripts),
              ('CSS', re.findall(r'<link[^>]+href=["\']([^"\']+)', html, flags=re.I))
          ]:
              normalized = [x.split('?')[0] for x in values]
              dup = sorted(k for k,v in Counter(normalized).items() if k and v > 1)
              if dup:
                  raise SystemExit(f'Duplicate {label} includes in index.html: {dup}')

          # Static modules below are intentionally owned by index.html.
          for name in ('learning-smas-import.js','behavior-records-ai-summary.js'):
              count = sum(1 for src in scripts if src.split('?')[0] == name)
              if count != 1:
                  raise SystemExit(f'Static module include count for {name}: {count}')

          # Runtime-only modules must be loaded by one canonical loadOnce entry.
          for name in ('behavior-quick-options.js','home-class-logo.js','site-link-integrity.js'):
              count = runtime.count("loadOnce('" + name + "'")
              if count != 1:
                  raise SystemExit(f'Runtime loader count for {name}: {count}')

          # The two static modules above must NOT also be runtime loaded.
          for name in ('learning-smas-import.js','behavior-records-ai-summary.js'):
              if "loadOnce('" + name + "'" in runtime:
                  raise SystemExit(f'Duplicate runtime/static ownership for {name}')

          # No obsolete menu entry or legacy class in index.html.
          if re.search(r'data-page=["\']comments["\']', html):
              raise SystemExit('Legacy comments menu found')
          if '5C' in html or '5c' in html:
              raise SystemExit('Legacy class 5C found in index.html')

          print('Static menu/link/module integrity OK')
          PY

      - name: Validate HTML nesting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.stack=[]
              def handle_starttag(self, tag, attrs):
                  if tag not in {'meta','link','input','img','br','hr','source','area','base','embed','param','track','wbr'}:
                      self.stack.append(tag)
              def handle_endtag(self, tag):
                  if tag in {'meta','link','input','img','br','hr','source','area','base','embed','param','track','wbr'}:
                      return
                  if not self.stack or self.stack[-1] != tag:
                      raise SystemExit(f'HTML nesting mismatch at </{tag}>')
                  self.stack.pop()
          p=P()
          p.feed(Path('index.html').read_text(encoding='utf-8'))
          p.close()
          if p.stack:
              raise SystemExit(f'Unclosed HTML tags: {p.stack[-10:]}')
          print('HTML integrity OK')
          PY
