name: Verify core menu integrity

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate core menu wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html

          for route in dashboard students attendance violations rewards learning statistics student-links ai lucky-wheel settings; do
            grep -q "data-page=\"$route\"" index.html || { echo "Missing menu route: $route"; exit 1; }
          done

          for page in dashboard students attendance violations rewards learning statistics student-links ai; do
            grep -q "id=\"page-$page\"" index.html || { echo "Missing page section: page-$page"; exit 1; }
            grep -q "data-page-section=\"$page\"" index.html || { echo "Missing section marker: $page"; exit 1; }
          done

          for hook in studentTableBody attendanceTableBody violationTableBody rewardTableBody; do
            grep -q "id=\"$hook\"" index.html || { echo "Missing table hook: $hook"; exit 1; }
          done

          if grep -q 'data-page="comments"' index.html; then
            echo 'Obsolete comments menu remains'; exit 1
          fi

          if grep -qF 'n\n<a class="menu-item"' index.html; then
            echo 'Corrupt literal newline marker remains in navigation'; exit 1
          fi

          test "$(grep -o 'data-page=\"learning\"' index.html | wc -l | tr -d ' ')" -eq 1
          test "$(grep -o 'id=\"page-learning\"' index.html | wc -l | tr -d ' ')" -eq 1

          # Script references must be unique. This catches accidental loader duplication.
          for file in student-links-fix.js learning-smas-import.js behavior-records-ai-summary.js; do
            count=$(grep -o "$file" index.html | wc -l | tr -d ' ')
            test "$count" -eq 1 || { echo "Expected exactly one reference for $file; found $count"; exit 1; }
          done

      - name: Validate HTML nesting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser

          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.stack=[]
              def handle_starttag(self, tag, attrs):
                  if tag not in {'meta','link','input','img','br','hr','source','area','base','embed','param','track','wbr'}:
                      self.stack.append(tag)
              def handle_startendtag(self, tag, attrs):
                  pass
              def handle_endtag(self, tag):
                  if tag in {'meta','link','input','img','br','hr','source','area','base','embed','param','track','wbr'}:
                      return
                  if not self.stack or self.stack[-1] != tag:
                      raise SystemExit(f'HTML nesting mismatch at </{tag}>')
                  self.stack.pop()

          parser=Parser()
          parser.feed(Path('index.html').read_text(encoding='utf-8'))
          parser.close()
          if parser.stack:
              raise SystemExit(f'Unclosed HTML tags: {parser.stack[-10:]}')
          print('HTML integrity OK')
          PY
