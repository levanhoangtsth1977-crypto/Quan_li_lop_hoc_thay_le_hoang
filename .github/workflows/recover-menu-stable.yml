name: Restore core menu and standalone utilities

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize core menus, learning UI and behavior tables
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Remove known conflicting external runtime layers from the HTML only.
          for name in [
            'menu-final-direct.js','menu-special-fix.js','emergency-menu-router.js',
            'tien-ich-final.js','tien-ich-schema-v4-fix.js','event-sync-multi-v21.js',
            'event-ui-stability-v214.js','dashboard-legacy-events-cleanup.js',
            'safe-student-picker.js'
          ]:
            s=re.sub(r'<script\\b[^>]*src=["\\\'][^"\\\']*'+re.escape(name)+r'[^"\\\']*["\\\'][^>]*></script>\\s*','',s,flags=re.I)

          # Keep Học tập, remove only obsolete standalone Nhận xét menu.
          s=re.sub(r'<button\\b[^>]*data-page=["\\\']comments["\\\'][^>]*>.*?</button>\\s*','',s,flags=re.I|re.S)
          s=re.sub(r'<a\\b[^>]*data-page=["\\\']comments["\\\'][^>]*>.*?</a>\\s*','',s,flags=re.I|re.S)

          # Guarantee the Learning menu item and real HTML section.
          if not re.search(r'data-page=["\\\']learning["\\\']',s,re.I):
            item='<button type="button" class="menu-item" data-page="learning"><i class="fa-solid fa-book-open"></i><span>Học tập</span></button>\\n'
            marker='<button type="button" class="menu-item" data-page="statistics">'
            s=s.replace(marker,item+marker,1) if marker in s else s.replace('</nav>',item+'</nav>',1)
          if not re.search(r'id=["\\\']page-learning["\\\']',s,re.I):
            section='<section class="page-section" id="page-learning" data-page-section="learning"><div class="page-header"><div><span class="page-eyebrow"><i class="fa-solid fa-book-open"></i> Dữ liệu học tập</span><h1>Học tập</h1><p>Kết quả học tập định kỳ từ bảng tổng hợp SMAS.</p></div></div><div id="lhLearningPageBody"></div></section>\\n'
            m=re.search(r'(?=<section\\b[^>]*id=["\\\']page-statistics["\\\'])',s,re.I)
            s=re.sub(m,section,s,count=1,flags=re.I) if m else s.replace('</main>',section+'</main>',1)

          # Guarantee a real violation table in static HTML.
          if not re.search(r'id=["\\\']violationTableBody["\\\']',s,re.I):
            table='<div class="table-container" id="lhViolationTableWrap"><table class="data-table" id="violationTable"><thead><tr><th>STT</th><th>Họ tên học sinh</th><th>Ngày vi phạm</th><th>Nội dung vi phạm</th><th>Hình thức xử lý</th><th>Thao tác</th></tr></thead><tbody id="violationTableBody"><tr><td colspan="6"><div class="empty-state"><strong>Chưa có dữ liệu vi phạm</strong><p>Các ghi nhận mới sẽ xuất hiện tại đây.</p></div></td></tr></tbody></table></div>\\n'
            anchor=re.search(r'(<div class=["\\\']info-banner warning["\\\'][\\s\\S]*?</div>)',s,re.I)
            s=s[:anchor.end()]+table+s[anchor.end():] if anchor else s.replace('</main>',table+'</main>',1)

          # Guarantee reward body id without altering the reward structure.
          if not re.search(r'id=["\\\']rewardTableBody["\\\']',s,re.I):
            s=re.sub(r'(<section\\b[^>]*id=["\\\']page-rewards["\\\'][\\s\\S]*?<tbody)\\b[^>]*>',r'\\1 id="rewardTableBody">',s,count=1,flags=re.I)

          # Exactly one direct loader for each module that needs deterministic loading.
          for filename,tag in [
            ('student-links-fix.js','<script src="student-links-fix.js?v=3.4.1"></script>\\n'),
            ('learning-smas-import.js','<script src="learning-smas-import.js?v=2.0.0"></script>\\n'),
            ('behavior-records-ai-summary.js','<script src="behavior-records-ai-summary.js?v=1.1.0"></script>\\n')
          ]:
            s=re.sub(r'<script\\b[^>]*src=["\\\'][^"\\\']*'+re.escape(filename)+r'[^"\\\']*["\\\'][^>]*></script>\\s*','',s,flags=re.I)
            s=s.replace('</body>',tag+'</body>',1) if '</body>' in s else s+tag

          p.write_text(s,encoding='utf-8')
          print('normalized index')
          PY

      - name: Verify required structure only
        shell: bash
        run: |
          set -e
          grep -qi 'data-page="learning"' index.html
          grep -qi 'id="page-learning"' index.html
          grep -qi 'data-page-section="learning"' index.html
          grep -qi 'id="violationTable"' index.html
          grep -qi 'id="violationTableBody"' index.html
          grep -qi 'id="rewardTableBody"' index.html
          grep -qi 'student-links-fix.js' index.html
          grep -qi 'learning-smas-import.js' index.html
          grep -qi 'behavior-records-ai-summary.js' index.html
          if grep -qi 'data-page="comments"' index.html; then echo 'obsolete comments menu remains'; exit 1; fi

      - name: Commit normalized index
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add static behavior tables and stable module loaders"
          git push origin HEAD:master
