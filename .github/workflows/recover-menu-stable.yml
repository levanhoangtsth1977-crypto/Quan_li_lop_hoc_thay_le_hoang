name: Verify core menu integrity

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate core menu wiring
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          for route in dashboard students attendance violations rewards learning statistics student-links ai lucky-wheel settings; do grep -q "data-page=\"$route\"" index.html; done
          for page in dashboard students attendance violations rewards learning statistics student-links ai; do grep -q "id=\"page-$page\"" index.html; grep -q "data-page-section=\"$page\"" index.html; done
          for hook in studentTableBody attendanceTableBody violationTableBody rewardTableBody; do grep -q "id=\"$hook\"" index.html; done
          ! grep -q 'data-page="comments"' index.html
          ! grep -qF 'n\\n<a class="menu-item"' index.html
          test "$(grep -o 'data-page=\"learning\"' index.html | wc -l | tr -d ' ')" -eq 1
          test "$(grep -o 'id=\"page-learning\"' index.html | wc -l | tr -d ' ')" -eq 1
          for file in google-api-bridge.js student-links-fix.js learning-smas-import.js behavior-records-ai-summary.js event-save-jsonp-fix.js; do
            test "$(grep -o "$file" index.html | wc -l | tr -d ' ')" -eq 1
          done
          echo 'Core menu integrity OK'
      - name: Validate HTML nesting
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class P(HTMLParser):
              def __init__(self): super().__init__(); self.stack=[]
              def handle_starttag(self, tag, attrs):
                  if tag not in {'meta','link','input','img','br','hr','source','area','base','embed','param','track','wbr'}: self.stack.append(tag)
              def handle_endtag(self, tag):
                  if tag in {'meta','link','input','img','br','hr','source','area','base','embed','param','track','wbr'}: return
                  if not self.stack or self.stack[-1] != tag: raise SystemExit(f'HTML nesting mismatch at </{tag}>')
                  self.stack.pop()
          p=P(); p.feed(Path('index.html').read_text(encoding='utf-8')); p.close()
          if p.stack: raise SystemExit(f'Unclosed HTML tags: {p.stack[-10:]}')
          print('HTML integrity OK')
          PY
