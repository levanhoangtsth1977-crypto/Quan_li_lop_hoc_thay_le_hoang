name: Restore core menu and standalone utilities

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clean conflicting menu and utilities modules
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          patterns=[
            r'<script\\b[^>]*src=["\\\'][^"\\\']*menu-final-direct\\.js[^"\\\']*["\\\'][^>]*></script>\\s*',
            r'<script\\b[^>]*src=["\\\'][^"\\\']*menu-special-fix\\.js[^"\\\']*["\\\'][^>]*></script>\\s*',
            r'<script\\b[^>]*src=["\\\'][^"\\\']*emergency-menu-router\\.js[^"\\\']*["\\\'][^>]*></script>\\s*',
            r'<script\\b[^>]*src=["\\\'][^"\\\']*tien-ich-final\\.js[^"\\\']*["\\\'][^>]*></script>\\s*',
            r'<script\\b[^>]*src=["\\\'][^"\\\']*tien-ich-schema-v4-fix\\.js[^"\\\']*["\\\'][^>]*></script>\\s*',
            r'<script\\b[^>]*src=["\\\'][^"\\\']*event-sync-multi-v21\\.js[^"\\\']*["\\\'][^>]*></script>\\s*',
            r'<script\\b[^>]*src=["\\\'][^"\\\']*event-ui-stability-v214\\.js[^"\\\']*["\\\'][^>]*></script>\\s*'
          ]
          for pat in patterns:s=re.sub(pat,'',s,flags=re.I)
          s=re.sub(r'<!-- LH STABLE MENU BEGIN -->.*?<!-- LH STABLE MENU END -->\\s*','',s,flags=re.S)
          s=re.sub(r'<a[^>]*id=["\\\'][^"\\\']*(?:lhUtilitiesStandalone|lhStandaloneUtilities)[^"\\\']*["\\\'][^>]*>.*?</a>\\s*','',s,flags=re.I|re.S)
          s=re.sub(r'<button[^>]*data-page=["\\\']utilities["\\\'][^>]*>.*?</button>\\s*','',s,flags=re.I|re.S)
          link='<a class="menu-item" id="lhUtilitiesStandalone" href="tien-ich.html"><i class="fa-solid fa-toolbox"></i><span>Tiện ích</span></a>'
          if 'id="lhUtilitiesStandalone"' not in s:
            marker='<button type="button" class="menu-item" data-page="settings">'
            s=s.replace(marker,link+'\\n'+marker,1) if marker in s else s.replace('</nav>',link+'\\n</nav>',1)
          p.write_text(s,encoding='utf-8')
          PY

      - name: Install stable cleanup and V21.4 sync
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          for f in ['dashboard-legacy-events-cleanup.js','event-sync-multi-v21.js','event-ui-stability-v214.js']:
            s=re.sub(rf'<script\\b[^>]*src=["\\\'][^"\\\']*{re.escape(f)}[^"\\\']*["\\\'][^>]*></script>\\s*','',s,flags=re.I)
          tags='<script src="dashboard-legacy-events-cleanup.js?v=1.0"></script>\\n<script src="event-sync-multi-v21.js?v=21.4"></script>\\n<script src="event-ui-stability-v214.js?v=21.4.0"></script>\\n'
          s=s.replace('</body>',tags+'</body>',1) if '</body>' in s else s+tags
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify
        shell: bash
        run: |
          set -e
          test "$(grep -oi 'tien-ich.html' index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -oi 'event-sync-multi-v21.js' index.html | wc -l | tr -d ' ')" = "1"
          test "$(grep -oi 'event-ui-stability-v214.js' index.html | wc -l | tr -d ' ')" = "1"
          ! grep -qi 'menu-final-direct.js' index.html
          ! grep -qi 'menu-special-fix.js' index.html
          ! grep -qi 'emergency-menu-router.js' index.html
          ! grep -qi 'tien-ich-final.js' index.html
          ! grep -qi 'tien-ich-schema-v4-fix.js' index.html

      - name: Commit normalized index
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Install V21.4 stable selector UI"
          git push origin HEAD:master
