name: Recover stable menu navigation

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  recover:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove conflicting menu controllers
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          import re
          patterns = [
              r'<script\b[^>]*src=["\'][^"\']*menu-final-direct\.js[^"\']*["\'][^>]*></script>\s*',
              r'<script\b[^>]*src=["\'][^"\']*emergency-menu-router\.js[^"\']*["\'][^>]*></script>\s*',
              r'<script\b[^>]*src=["\'][^"\']*lucky-wheel-final\.js[^"\']*["\'][^>]*></script>\s*',
              r'<script\b[^>]*src=["\'][^"\']*vong-quay-may-man\.js[^"\']*["\'][^>]*></script>\s*',
              r'<script\b[^>]*src=["\'][^"\']*vong-quay-may-man-fix\.js[^"\']*["\'][^>]*></script>\s*',
          ]
          for pat in patterns:
              s = re.sub(pat, '', s, flags=re.I)
          p.write_text(s, encoding='utf-8')
      - name: Verify stable inline controller remains
        shell: bash
        run: |
          set -e
          grep -q "__LH_INLINE_MENU__" index.html
          if grep -qi "menu-final-direct.js\|emergency-menu-router.js\|lucky-wheel-final.js\|vong-quay-may-man.js\|vong-quay-may-man-fix.js" index.html; then
            echo "Conflicting menu/wheel scripts remain" >&2
            exit 1
          fi
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Recover stable inline menu controller"
          git push origin HEAD:master
