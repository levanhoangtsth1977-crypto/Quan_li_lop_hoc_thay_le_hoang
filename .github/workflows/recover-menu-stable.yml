name: Restore core menu and standalone utilities

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize UI and load stable cleanup layers
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          for name in [
            'menu-final-direct.js','menu-special-fix.js','emergency-menu-router.js',
            'tien-ich-final.js','tien-ich-schema-v4-fix.js','event-sync-multi-v21.js',
            'event-ui-stability-v214.js','dashboard-legacy-events-cleanup.js'
          ]:
            s=re.sub(r'<script\b[^>]*src=["\'][^"\']*'+re.escape(name)+r'[^"\']*["\'][^>]*></script>\s*','',s,flags=re.I)

          # Remove only the obsolete standalone Nhận xét menu. Học tập stays because it owns SMAS.
          s=re.sub(r'<button\b[^>]*data-page=["\']comments["\'][^>]*>.*?</button>\s*','',s,flags=re.I|re.S)

          # If an older cleanup removed Học tập, restore the canonical menu item.
          if not re.search(r'data-page=["\']learning["\']',s,re.I):
            item='<button type="button" class="menu-item" data-page="learning"><i class="fa-solid fa-book-open"></i><span>Học tập</span></button>\n'
            marker='<button type="button" class="menu-item" data-page="statistics">'
            if marker in s: s=s.replace(marker,item+marker,1)
            else: s=s.replace('</nav>',item+'</nav>',1)

          # Keep exactly one utilities link.
          s=re.sub(r'<a[^>]*id=["\'][^"\']*(?:lhUtilitiesStandalone|lhStandaloneUtilities)[^"\']*["\'][^>]*>.*?</a>\s*','',s,flags=re.I|re.S)
          link='<a class="menu-item" id="lhUtilitiesStandalone" href="tien-ich.html"><i class="fa-solid fa-toolbox"></i><span>Tiện ích</span></a>'
          marker='<button type="button" class="menu-item" data-page="settings">'
          if marker in s: s=s.replace(marker,link+'\n'+marker,1)
          elif 'id="lhUtilitiesStandalone"' not in s: s=s.replace('</nav>',link+'\n</nav>',1)

          s=re.sub(r'<script\b[^>]*src=["\'][^"\']*safe-student-picker\.js[^"\']*["\'][^>]*></script>\s*','',s,flags=re.I)
          s=s.replace('</body>','<script src="safe-student-picker.js?v=1.0.0"></script>\n</body>',1) if '</body>' in s else s

          s=re.sub(r'<script\b[^>]*src=["\'][^"\']*learning-comments-menu-removal\.js[^"\']*["\'][^>]*></script>\s*','',s,flags=re.I)
          cleanup='<script src="learning-comments-menu-removal.js?v=2.1.0"></script>\n'
          s=s.replace('</body>',cleanup+'</body>',1) if '</body>' in s else s+cleanup

          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify normalized index
        shell: bash
        run: |
          set -e
          grep -qi 'data-page="learning"' index.html
          grep -qi 'learning-comments-menu-removal.js?v=2.1.0' index.html
          grep -qi 'safe-student-picker.js' index.html
          ! grep -qi 'data-page="comments"' index.html
          ! grep -qi 'event-ui-stability-v214.js' index.html
          ! grep -qi 'event-sync-multi-v21.js' index.html
          ! grep -qi 'menu-final-direct.js' index.html
          ! grep -qi 'menu-special-fix.js' index.html
          ! grep -qi 'emergency-menu-router.js' index.html

      - name: Commit normalized index
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Restore Học tập and remove obsolete comments menu"
          git push origin HEAD:master
