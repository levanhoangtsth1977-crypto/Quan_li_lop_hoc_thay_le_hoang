name: Inject event save JSONP fix

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ensure event save fix is loaded exactly once
        shell: bash
        run: |
          set -e
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<script\b[^>]*src=["\'][^"\']*event-save-jsonp-fix\.js[^"\']*["\'][^>]*></script>\s*','',s,flags=re.I)
          tag='<script src="event-save-jsonp-fix.js?v=20260908.1"></script>\n'
          if '</body>' in s:
              s=s.replace('</body>',tag+'</body>',1)
          else:
              s += '\n' + tag
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify
        shell: bash
        run: |
          set -e
          test "$(grep -oi 'event-save-jsonp-fix.js' index.html | wc -l | tr -d ' ')" = "1"

      - name: Commit
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix: load JSONP event save fallback"
          git push origin HEAD:master
