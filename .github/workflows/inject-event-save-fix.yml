name: Normalize core HTML loaders and event save fallback

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Normalize core loaders and navigation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Repair the known literal navigation corruption: the two characters "\\n".
          s=s.replace('            n\\\\n<a class="menu-item"', '            <a class="menu-item"')
          s=s.replace('n\\\\n<a class="menu-item"', '<a class="menu-item"')

          # Deduplicate deterministic core loaders, retaining the first script tag.
          for filename in [
              'google-api-bridge.js',
              'student-links-fix.js',
              'learning-smas-import.js',
              'behavior-records-ai-summary.js'
          ]:
              pattern=r'\\s*<script\\b[^>]*src=["\\\'][^"\\\']*'+re.escape(filename)+r'[^"\\\']*["\\\'][^>]*></script>'
              matches=list(re.finditer(pattern,s,flags=re.I))
              if len(matches)>1:
                  parts=[]; pos=0
                  for i,m in enumerate(matches):
                      parts.append(s[pos:m.start()])
                      if i==0: parts.append(m.group(0))
                      pos=m.end()
                  parts.append(s[pos:])
                  s=''.join(parts)

          # Canonicalize current AI-summary cache version.
          s=re.sub(r'(<script\\b[^>]*src=["\\\'][^"\\\']*behavior-records-ai-summary\\.js)(?:\\?[^"\\\']*)?(["\\\'][^>]*></script>)', r'\\1?v=1.2.0\\2', s, count=1, flags=re.I)

          # Ensure the event-save JSONP fallback exists exactly once.
          s=re.sub(r'\\s*<script\\b[^>]*src=["\\\'][^"\\\']*event-save-jsonp-fix\\.js[^"\\\']*["\\\'][^>]*></script>', '', s, flags=re.I)
          tag='<script src="event-save-jsonp-fix.js?v=20260908.1"></script>\\n'
          if '</body>' in s:
              s=s.replace('</body>',tag+'</body>',1)
          else:
              s += '\\n'+tag

          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify deterministic wiring
        shell: bash
        run: |
          set -euo pipefail
          ! grep -qF 'n\\\\n<a class="menu-item"' index.html
          for file in google-api-bridge.js student-links-fix.js learning-smas-import.js behavior-records-ai-summary.js event-save-jsonp-fix.js; do
            test "$(grep -o "$file" index.html | wc -l | tr -d ' ')" -eq 1
          done
          grep -q 'behavior-records-ai-summary.js?v=1.2.0' index.html
          test "$(grep -o 'data-page=\"learning\"' index.html | wc -l | tr -d ' ')" -eq 1
          test "$(grep -o 'id=\"page-learning\"' index.html | wc -l | tr -d ' ')" -eq 1

      - name: Commit normalized index only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+users.noreply.github.com
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Normalize core HTML loaders and navigation"
          git push origin HEAD:master
